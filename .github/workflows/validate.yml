name: Validate Agent

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate YAML files
        run: |
          pip install pyyaml
          python -c "
          import yaml
          import glob
          import sys

          errors = []
          for f in glob.glob('.agent/**/*.yaml', recursive=True):
              try:
                  with open(f) as file:
                      yaml.safe_load(file)
                  print(f'✅ {f}')
              except Exception as e:
                  errors.append(f'{f}: {e}')
                  print(f'❌ {f}: {e}')

          if errors:
              sys.exit(1)
          print('All YAML files valid!')
          "

      - name: Validate JSON files
        run: |
          python -c "
          import json
          import glob
          import sys

          errors = []
          for f in glob.glob('.agent/**/*.json', recursive=True):
              try:
                  with open(f) as file:
                      json.load(file)
                  print(f'✅ {f}')
              except Exception as e:
                  errors.append(f'{f}: {e}')
                  print(f'❌ {f}: {e}')

          if errors:
              sys.exit(1)
          print('All JSON files valid!')
          "

      - name: Check required files exist
        run: |
          required_files=(
            ".agent/manifest.yaml"
            ".agent/config.yaml"
            ".agent/skills/index.json"
            "README.md"
            "CLAUDE.md"
            "GEMINI.md"
          )

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ $file missing"
              exit 1
            fi
          done

      - name: Version consistency check
        run: |
          python -c "
          import yaml
          import json

          # Load manifest version
          with open('.agent/manifest.yaml') as f:
              manifest = yaml.safe_load(f)
          version = manifest.get('version', '')
          print(f'Manifest version: {version}')

          # Check index.json
          with open('.agent/skills/index.json') as f:
              index = json.load(f)
          index_version = index.get('version', '')
          print(f'Index version: {index_version}')

          if not index_version.startswith(version.rsplit('.', 1)[0]):
              print('⚠️  Version mismatch detected')
          else:
              print('✅ Versions consistent')
          "

      - name: Validate skill structure
        run: |
          python -c "
          import os
          import sys

          errors = []
          skills_dir = '.agent/skills'

          for skill in os.listdir(skills_dir):
              skill_path = os.path.join(skills_dir, skill)
              if os.path.isdir(skill_path):
                  skill_md = os.path.join(skill_path, 'SKILL.md')
                  if os.path.exists(skill_md):
                      print(f'✅ {skill}/SKILL.md')
                  else:
                      errors.append(f'{skill}: Missing SKILL.md')
                      print(f'❌ {skill}: Missing SKILL.md')

          if errors:
              print(f'\n⚠️  {len(errors)} skills missing SKILL.md')
          else:
              print('\nAll skills have valid structure!')
          "

      - name: Check markdown files
        run: |
          python -c "
          import glob

          warnings = []
          for f in glob.glob('**/*.md', recursive=True):
              if 'node_modules' in f:
                  continue
              try:
                  with open(f, encoding='utf-8', errors='ignore') as file:
                      content = file.read()
                      if content and not content.endswith('\n'):
                          warnings.append(f'{f}: missing final newline')
                  print(f'✅ {f}')
              except Exception as e:
                  print(f'❌ {f}: {e}')

          if warnings:
              print(f'\n⚠️  {len(warnings)} warnings (non-blocking)')
              for w in warnings[:5]:
                  print(f'  - {w}')
          print('\nMarkdown check complete!')
          "

  test-cli:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CLI dependencies
        working-directory: domyh-awf-cli
        run: npm ci

      - name: Build CLI
        working-directory: domyh-awf-cli
        run: npm run build

      - name: Run CLI tests
        working-directory: domyh-awf-cli
        run: npm test
