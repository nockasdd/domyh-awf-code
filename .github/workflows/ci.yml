name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .agent/ configs/
          config_data: |
            extends: relaxed
            rules:
              line-length:
                max: 200
              truthy: disable

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
          config: |
            {
              "MD013": false,
              "MD033": false,
              "MD041": false
            }

      - name: Check JSON syntax
        run: |
          errors=0
          for f in $(find configs/ -name '*.json'); do
            if ! python3 -c "import json; json.load(open('$f'))"; then
              echo "❌ Invalid JSON: $f"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then exit 1; fi

      - name: Validate public agent content
        run: node scripts/validate-agent-public.mjs

      - name: Check broken links in README
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress README.md README_VN.md
          fail: true

      - name: Check version consistency
        run: |
          version=$(grep -m1 'version:' .agent/core/VERSION.yaml | grep -oP '\d+\.\d+\.\d+')
          echo "SSoT version: $version"
          errors=0
          for f in .agent/manifest.yaml IDE_COMPATIBILITY.md; do
            if ! grep -q "$version" "$f"; then
              echo "❌ Version mismatch in $f"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then exit 1; fi
          echo "✅ Version consistent across all files"
