# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: vi-VN # Default; user can change via nock awf init --language en

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false

  path_instructions:
    - path: "**/*.ts"
      instructions: |
        Follow DOMYH Awesome Code standards:
        - TypeScript strict mode
        - Explicit types, no any
        - Proper error handling
        - Clean code principles
        Load rules: `.agent/rules/SACRED_RULES.xml`
        Load skill: `.agent/skills/languages/typescript/SKILL.md`

    - path: "**/*.vue"
      instructions: |
        Follow DOMYH Awesome Code standards:
        - Vue 3 Composition API with <script setup>
        - Type-safe props and emits
        - Proper ref/reactive usage
        Load rules: `.agent/rules/SACRED_RULES.xml`
        Load skill: `.agent/skills/frameworks/vue/SKILL.md`

    - path: "**/*.go"
      instructions: |
        Follow DOMYH Awesome Code standards:
        - Effective Go conventions
        - Proper error wrapping
        - Context propagation
        Load rules: `.agent/rules/SACRED_RULES.xml`
        Load skill: `.agent/skills/languages/go/SKILL.md`

    - path: "**/*.py"
      instructions: |
        Follow DOMYH Awesome Code standards:
        - PEP 8 compliance
        - Type hints
        - Proper exception handling
        Load rules: `.agent/rules/SACRED_RULES.xml`
        Load skill: `.agent/skills/languages/python/SKILL.md`

chat:
  auto_reply: true

# DOMYH Awesome Code Agent Framework — Enforced Config v7
#
# ⛔ MANDATORY: MUST call hsa_get_agent_config('bootstrap') FIRST.
# MUST call hsa_search(query) before implementing code.
# Use hsa_search(action:'docs', doc_libraries:['lib']) for external library docs (24+ built-in).
# MUST call hsa_session(action:'intent', focus, mode) for session governance.
#
# ❌ NEVER: grep_search for code (use hsa_search), skip skills search, code without declare_intent.
# 🔄 Cascade: hsa_delegate(action:'cascade', cascade_text:'[prompt]', task_type:'code|test|review|debug|browser|research') for cross-model delegation. Model auto-selected from dashboard.
#
# Core: Do No Harm | Truthfulness (file:line) | User Sovereignty | Confirm destructive | File outlines+grep first
# Terminal Safety (Win): NO pipes (|grep/tail/head), NO pagers (less/more), use git --no-pager, add -y/-c/-e flags. FIRST call hsa_detect to check IDE shell: cmd → cmd /c, bash → native syntax, powershell → PS syntax. Default fallback: cmd /c.
#
# Skills & Workflows: .agent/skills/{cat}/{name}/SKILL.md (96 skills, 8 categories incl. governance)
# Fallback: Match intent → read .agent/workflows/{id}.md → load skill → execute (44 commands)
