# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: vi-VN # Default; user can change via nock awf init --language en

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false

  path_instructions:
    - path: "**/*.ts"
      instructions: |
        Follow DOMYH Awesome Code standards:
        - TypeScript strict mode
        - Explicit types, no any
        - Proper error handling
        - Clean code principles
        Load rules: `.agent/rules/SACRED_RULES.xml`
        Load skill: `.agent/skills/languages/typescript/SKILL.md`

    - path: "**/*.vue"
      instructions: |
        Follow DOMYH Awesome Code standards:
        - Vue 3 Composition API with <script setup>
        - Type-safe props and emits
        - Proper ref/reactive usage
        Load rules: `.agent/rules/SACRED_RULES.xml`
        Load skill: `.agent/skills/frameworks/vue/SKILL.md`

    - path: "**/*.go"
      instructions: |
        Follow DOMYH Awesome Code standards:
        - Effective Go conventions
        - Proper error wrapping
        - Context propagation
        Load rules: `.agent/rules/SACRED_RULES.xml`
        Load skill: `.agent/skills/languages/go/SKILL.md`

    - path: "**/*.py"
      instructions: |
        Follow DOMYH Awesome Code standards:
        - PEP 8 compliance
        - Type hints
        - Proper exception handling
        Load rules: `.agent/rules/SACRED_RULES.xml`
        Load skill: `.agent/skills/languages/python/SKILL.md`

chat:
  auto_reply: true

# DOMYH Awesome Code Agent Framework — Enriched Config v4
#
# MANDATORY: Read `.agent/rules/SACRED_RULES.xml` and `.agent/memory/CONTEXT_SNAPSHOT.md` FIRST
#
# Core Rules: CORE_001 (Do No Harm), CORE_002 (Truthfulness), CORE_003 (User Sovereignty)
# SAFE_001: Confirm before destructive actions
#
# Loading Protocol: Match user intent → read `.agent/workflows/{id}.md` → load skill
# Keywords: fix→/fix, debug→/debug, test→/test, code→/code, refactor→/refactor,
#   deploy→/deploy, security→/security, review→/review, plan→/plan, doc→/doc
#
# Commands (41): /code, /debug, /test, /fix, /deploy, /ap, /plan, /refactor, /help + 32 more
# Personas: Developer, Architect, Auditor, Debugger, Tester, DevOps, Documenter,
#   Planner, Researcher, Orchestrator, Security
# Skills: Progressive Disclosure (META.yaml → SKILL.md → ADVANCED.md)
# MCP Tools: hsa_get_context, hsa_detect_stack, hsa_search_skills, hsa_trace_flow,
#   hsa_check_changes, hsa_declare_intent, hsa_track_progress
