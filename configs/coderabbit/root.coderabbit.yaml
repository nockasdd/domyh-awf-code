# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: vi-VN # Default; user can change via nock awf init --language en

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false

  path_instructions:
    - path: "**/*.ts"
      instructions: |
        Follow DOMYH Awesome Code standards:
        - TypeScript strict mode
        - Explicit types, no any
        - Proper error handling
        - Clean code principles
        Load rules: `.agent/rules/SACRED_RULES.xml`
        Load skill: `.agent/skills/languages/typescript/SKILL.md`

    - path: "**/*.vue"
      instructions: |
        Follow DOMYH Awesome Code standards:
        - Vue 3 Composition API with <script setup>
        - Type-safe props and emits
        - Proper ref/reactive usage
        Load rules: `.agent/rules/SACRED_RULES.xml`
        Load skill: `.agent/skills/frameworks/vue/SKILL.md`

    - path: "**/*.go"
      instructions: |
        Follow DOMYH Awesome Code standards:
        - Effective Go conventions
        - Proper error wrapping
        - Context propagation
        Load rules: `.agent/rules/SACRED_RULES.xml`
        Load skill: `.agent/skills/languages/go/SKILL.md`

    - path: "**/*.py"
      instructions: |
        Follow DOMYH Awesome Code standards:
        - PEP 8 compliance
        - Type hints
        - Proper exception handling
        Load rules: `.agent/rules/SACRED_RULES.xml`
        Load skill: `.agent/skills/languages/python/SKILL.md`

chat:
  auto_reply: true

# DOMYH Awesome Code Agent Framework — Enriched Config v6
#
# MANDATORY: Read `.agent/rules/SACRED_RULES.xml` and `.agent/memory/CONTEXT_SNAPSHOT.md` FIRST
#
# MCP Tools — ALWAYS PREFER (if domyh-hsa connected):
#   USE MCP TOOLS FIRST: hsa_get_agent_config(bootstrap), hsa_get_context,
#   hsa_search_skills, hsa_detect_stack, hsa_trace_flow,
#   hsa_declare_intent, hsa_track_progress
#   If MCP NOT connected, fall back to Loading Protocol.
#
# Core: Do No Harm | Truthfulness (file:line) | User Sovereignty | Confirm destructive | File outlines+grep first
# Terminal Safety (Win): NO pipes (|grep/tail/head), NO pagers (less/more), use git --no-pager, add -y/-c/-e flags
#
# Skills & Workflows: .agent/skills/{cat}/{name}/SKILL.md (85+ skills)
# Fallback Loading Protocol: Match intent → read .agent/workflows/{id}.md → load skill → execute (41 commands)
