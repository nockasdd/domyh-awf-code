# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: vi-VN

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false

  path_instructions:
    - path: "**/*.ts"
      instructions: |
        Principles: simplicity first, surgical changes, verify before done.
        TypeScript strict mode, explicit types, proper error handling.
        Skill: `.agent/skills/languages/typescript/SKILL.md`

    - path: "**/*.vue"
      instructions: |
        Vue 3 Composition API with <script setup>, type-safe props/emits.
        Skill: `.agent/skills/frameworks/vue/SKILL.md`

    - path: "**/*.go"
      instructions: |
        Effective Go conventions, proper error wrapping, context propagation.
        Skill: `.agent/skills/languages/go/SKILL.md`

    - path: "**/*.py"
      instructions: |
        PEP 8, type hints, proper exception handling.
        Skill: `.agent/skills/languages/python/SKILL.md`

chat:
  auto_reply: true

# DOMYH Awesome Code — NockDev
# Principles: think before coding, simplicity first, surgical changes, verify before done, stop when uncertain, session discipline.
# MCP: hsa_get_agent_config('bootstrap'), hsa_session(action='intent'), hsa_search(action='skills').
# Fallback: .agent/workflows/{command}.md, .agent/rules/AGENT_RULES.md
# Terminal (Windows): no pipes, no pagers, detect shell first.
