[project]
name = "ida-mcp-bridge"
version = "0.1.0"
description = "Dual-Mode MCP Bridge for IDA Pro 8.x/9.x"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "psutil>=5.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# This project is a flat script, not an installable package — server.py runs
# directly under `uv run`. Bypassing selection is what keeps hatchling from
# looking for a src/ that does not exist and failing every resolve.
[tool.hatch.build.targets.wheel]
bypass-selection = true
