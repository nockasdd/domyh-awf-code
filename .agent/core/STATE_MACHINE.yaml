# =============================================================================
# DOMYH Awesome Code v6.1.2
# State Machine Flow Engine - LangGraph-inspired architecture
# =============================================================================

version: "6.1.2"

# =============================================================================
# STATE DEFINITION
# The shared state that flows through all nodes
# =============================================================================

state_schema:
  description: "TypedDict-like state passed between nodes"

  fields:
    # Core message history
    messages:
      type: "List[Message]"
      description: "Conversation history"
      max_tokens: 8000

    # Current execution context
    current_node:
      type: "str"
      description: "Currently executing node"

    # Iteration tracking for loops
    iteration:
      type: "int"
      default: 0
      max: 10

    # Working memory for current task
    working_memory:
      type: "Dict[str, Any]"
      description: "Temporary data for current task"

    # Plan/steps for multi-step tasks
    plan:
      type: "List[Step]"
      description: "Current execution plan"

    # Results from tool executions
    tool_results:
      type: "List[ToolResult]"
      description: "Results from tool calls"

    # Error tracking
    errors:
      type: "List[Error]"
      description: "Errors encountered"
      max: 5

    # Reflection notes
    reflections:
      type: "List[Reflection]"
      description: "Self-critique and insights"

# =============================================================================
# NODE DEFINITIONS
# Each node is a computational step in the graph
# =============================================================================

nodes:
  # ---------------------------------------------------------------------------
  # ENTRY NODE: Router
  # ---------------------------------------------------------------------------
  router:
    description: "Analyze input and determine execution path"
    function: "route_request"
    inputs: ["messages"]
    outputs: ["current_node", "working_memory"]

    logic: |
      1. Parse user intent from last message
      2. Classify request type (code/debug/plan/review/etc)
      3. Load relevant skills and context
      4. Set initial working_memory
      5. Return next node to execute

    routes:
      simple_query: "responder"
      code_request: "planner"
      debug_request: "analyzer"
      review_request: "critic"
      multi_step: "planner"

  # ---------------------------------------------------------------------------
  # PLANNER: Break down complex tasks
  # ---------------------------------------------------------------------------
  planner:
    description: "Create execution plan for complex tasks"
    function: "create_plan"
    inputs: ["messages", "working_memory"]
    outputs: ["plan"]

    logic: |
      1. Analyze task requirements
      2. Break into smaller steps
      3. Identify dependencies
      4. Estimate effort per step
      5. Create ordered plan

    plan_format:
      - step_id: "string"
        description: "string"
        action: "string"
        dependencies: ["step_ids"]
        estimated_tokens: "int"

  # ---------------------------------------------------------------------------
  # EXECUTOR: Execute actions
  # ---------------------------------------------------------------------------
  executor:
    description: "Execute planned actions"
    function: "execute_step"
    inputs: ["plan", "working_memory", "iteration"]
    outputs: ["tool_results", "working_memory"]

    logic: |
      1. Get current step from plan
      2. Prepare tool calls
      3. Execute tools
      4. Collect results
      5. Update working_memory

    tool_types:
      - file_operations
      - code_generation
      - search_operations
      - terminal_commands

  # ---------------------------------------------------------------------------
  # CRITIC: Evaluate outputs (Reflexion pattern)
  # ---------------------------------------------------------------------------
  critic:
    description: "Evaluate and critique outputs"
    function: "evaluate_output"
    inputs: ["tool_results", "working_memory", "messages"]
    outputs: ["reflections", "errors"]

    logic: |
      1. Check output quality
      2. Validate against requirements
      3. Identify issues
      4. Generate constructive feedback
      5. Decide: accept, retry, or escalate

    evaluation_criteria:
      correctness:
        weight: 0.4
        checks: ["syntax", "logic", "types"]
      completeness:
        weight: 0.3
        checks: ["all_requirements", "edge_cases"]
      quality:
        weight: 0.3
        checks: ["best_practices", "readability"]

    decisions:
      accept: "Output meets criteria (score >= 0.8)"
      retry: "Fixable issues found (score 0.5-0.8)"
      escalate: "Major issues need user input (score < 0.5)"

  # ---------------------------------------------------------------------------
  # MEMORY MANAGER: Update persistent memory
  # ---------------------------------------------------------------------------
  memory_manager:
    description: "Update memory based on execution"
    function: "manage_memory"
    inputs: ["working_memory", "reflections", "tool_results"]
    outputs: ["memory_updates"]

    operations:
      remember:
        trigger: "Important new information"
        target: ["core_memory", "archival_memory"]

      update:
        trigger: "Corrected information"
        target: ["core_memory"]

      consolidate:
        trigger: "Session end or threshold reached"
        action: "Summarize and archive"

      connect:
        trigger: "Related information found"
        target: ["graph_memory"]

  # ---------------------------------------------------------------------------
  # RESPONDER: Generate final response
  # ---------------------------------------------------------------------------
  responder:
    description: "Generate user-facing response"
    function: "generate_response"
    inputs: ["working_memory", "tool_results", "reflections"]
    outputs: ["messages"]

    format:
      include_summary: true
      include_changes: true
      include_next_steps: true
      mask_secrets: true

# =============================================================================
# EDGE DEFINITIONS
# Connections between nodes with conditions
# =============================================================================

edges:
  # Entry edges
  - from: "START"
    to: "router"
    condition: "always"

  # Router outputs
  - from: "router"
    to: "planner"
    condition: "requires_planning"

  - from: "router"
    to: "executor"
    condition: "simple_action"

  - from: "router"
    to: "responder"
    condition: "simple_query"

  # Planner outputs
  - from: "planner"
    to: "executor"
    condition: "plan_created"

  - from: "planner"
    to: "responder"
    condition: "needs_user_confirmation"

  # Executor outputs
  - from: "executor"
    to: "critic"
    condition: "always"

  # Critic outputs (CYCLIC - key for agentic loops)
  - from: "critic"
    to: "executor"
    condition: "retry_needed AND iteration < max_retries"
    priority: 1

  - from: "critic"
    to: "planner"
    condition: "replan_needed"
    priority: 2

  - from: "critic"
    to: "memory_manager"
    condition: "success OR max_retries_reached"
    priority: 3

  # Memory manager outputs
  - from: "memory_manager"
    to: "responder"
    condition: "always"

  # Terminal edge
  - from: "responder"
    to: "END"
    condition: "always"

# =============================================================================
# AGENTIC LOOP CONFIGURATION
# Settings for self-improvement cycles
# =============================================================================

agentic_loops:
  # ReAct loop: Think → Act → Observe → Reflect
  react:
    enabled: true
    max_iterations: 5

    phases:
      think:
        description: "Analyze current state and plan next action"
        node: "router"

      act:
        description: "Execute planned action"
        node: "executor"

      observe:
        description: "Collect and process results"
        node: "critic"

      reflect:
        description: "Update knowledge based on outcome"
        node: "memory_manager"

  # Reflexion loop: Learn from failures
  reflexion:
    enabled: true

    on_failure:
      - action: "store_reflection"
        target: "reflections"
        format: |
          What went wrong: {error_description}
          Root cause: {analysis}
          How to prevent: {prevention}

      - action: "update_memory"
        target: "error_patterns"

      - action: "retry_with_insight"
        max_retries: 3

# =============================================================================
# CHECKPOINT & RECOVERY
# For resuming interrupted executions
# =============================================================================

checkpoints:
  enabled: true

  save_triggers:
    - "before_executor"
    - "after_critic"
    - "on_error"

  storage:
    location: ".agent/memory/checkpoints/"
    format: "json"
    retention: "7 days"

  recovery:
    auto_resume: true
    max_age: "24 hours"

# =============================================================================
# HUMAN-IN-THE-LOOP GATES
# Points where user confirmation is required
# =============================================================================

human_gates:
  # Always require confirmation
  always:
    - "destructive_file_operations"
    - "external_api_calls_with_side_effects"
    - "production_deployments"

  # Conditional confirmation
  conditional:
    - condition: "changes > 100 lines"
      action: "show_plan_and_confirm"

    - condition: "security_sensitive_code"
      action: "security_review_prompt"

    - condition: "critic_score < 0.5"
      action: "show_issues_and_confirm"

# =============================================================================
# FLOW PRESETS
# Pre-configured flows for common tasks
# =============================================================================

presets:
  code_generation:
    path:
      ["router", "planner", "executor", "critic", "memory_manager", "responder"]
    max_iterations: 3

  quick_fix:
    path: ["router", "executor", "critic", "responder"]
    max_iterations: 2

  review:
    path: ["router", "critic", "memory_manager", "responder"]
    max_iterations: 1

  debug:
    path:
      [
        "router",
        "planner",
        "executor",
        "critic",
        "executor",
        "memory_manager",
        "responder",
      ]
    max_iterations: 5

# =============================================================================
# METRICS & OBSERVABILITY
# Track execution for improvement
# =============================================================================

metrics:
  track:
    - node_execution_time
    - tokens_per_node
    - retry_count
    - success_rate
    - user_satisfaction

  export:
    format: "json"
    location: ".agent/memory/metrics/"
