# =============================================================================
# SYSTEM OVERVIEW
# =============================================================================

version: "4.0.0"
codename: "Context Mesh"
architecture: "CANSH v2.0" # Context-Aware Neural-Symbolic Hierarchy

description: |
  HSA v5.0 implements a 5-layer context architecture with:
  - Attention Sink protection (StreamingLLM validated)
  - Merkle Tree incremental indexing (11x speedup)
  - HiRAG 3-level context retrieval (global+bridge+local)
  - Adaptive token budget management
  - Proactive prefetching with trajectory prediction
  - Mark-and-sweep garbage collection

# =============================================================================
# LAYER ARCHITECTURE
# =============================================================================

layers:
  layer_0:
    name: "Attention Sink"
    type: "immutable"
    description: "Protected tokens for attention stability"
    token_budget: 500
    components:
      - system_prompt # Core instructions
      - security_policies # Safety rules
      - core_rules # Constitutional rules
    refresh: "never"
    research_source: "StreamingLLM (ICLR 2024)"

  layer_1:
    name: "Project Profile"
    type: "static"
    description: "Cached project metadata with Merkle validation"
    token_budget: 300
    components:
      - stack_detection # Scoring-based tech detection
      - skill_metas # Detected skill summaries
      - graph_hash # Merkle root for validation
    refresh: "on_merkle_change"
    research_source: "Cursor IDE (2025)"

  layer_2:
    name: "HiRAG Context"
    type: "dynamic"
    description: "3-level hierarchical retrieval"
    token_budget:
      min: 1000
      max: 2000
    components:
      global_context:
        description: "Community summaries"
        algorithm: "Leiden clustering"
      bridge_context:
        description: "Entity connections via shortest path"
        algorithm: "Dijkstra + path merge"
      local_context:
        description: "Entity descriptions"
        algorithm: "Top-k entity retrieval"
    refresh: "per_query"
    research_source: "HiRAG (ACL 2025)"

  layer_3:
    name: "JIT Code"
    type: "just_in_time"
    description: "On-demand code loading with budget awareness"
    token_budget:
      min: 1500
      max: 3000
    components:
      - skill_content # Selected SKILL.md content
      - file_chunks # Hot region prioritized
      - prefetch_cache # Predicted next files
    refresh: "per_action"
    features:
      - priority_truncation
      - semantic_chunking

  layer_4:
    name: "Compressed History"
    type: "sliding"
    description: "GC-managed conversation history"
    token_budget:
      min: 500
      max: 1000
    components:
      - summarized_actions # Past action summaries
      - key_decisions # Retained important choices
      - recent_trajectory # Last 5 actions (protected)
    refresh: "mark_and_sweep"
    research_source: "AttentionRAG (OpenReview 2025)"

# =============================================================================
# TOKEN BUDGET MANAGEMENT
# =============================================================================

token_budget:
  total: 8000

  allocation:
    sink: 500 # Protected, never evict
    project: 300 # Cached profile
    hirag: 2000 # Context retrieval
    jit: 3000 # Code chunks
    history: 1000 # Compressed history
    response: 2000 # Output buffer (not in context)

  complexity_multipliers:
    simple: 0.6 # Simple queries, reduce JIT/HiRAG
    medium: 1.0 # Default
    complex: 1.5 # Expand JIT/HiRAG, compress history

  overflow_strategy:
    1: "truncate_jit" # First: reduce code chunks
    2: "compress_history" # Then: summarize history
    3: "reduce_hirag_levels" # Finally: skip bridge context

# =============================================================================
# MERKLE TREE CONFIGURATION
# =============================================================================

merkle_tree:
  enabled: true
  algorithm: "blake3"

  watch:
    debounce_ms: 500 # Debounce rapid changes
    poll_interval_ms: 300000 # Full check every 5 minutes

  ignore_patterns:
    - "node_modules/**"
    - ".git/**"
    - "__pycache__/**"
    - "*.pyc"
    - "dist/**"
    - "build/**"
    - ".agent/memory/**" # Memory is separate

  chunk_strategy:
    parser: "tree-sitter" # AST-based chunking
    max_chunk_tokens: 500
    overlap_lines: 3

# =============================================================================
# STACK DETECTION
# =============================================================================

stack_detection:
  mode: "scoring" # "scoring" | "binary"

  weights:
    file_pattern: 10 # .sln, Cargo.toml, etc.
    dependency: 8 # package.json deps
    extension_frequency: 5 # .go, .py counts (log scale)

  threshold: 0.3 # Minimum score ratio
  max_skills: 5 # Top N skills to load

  rules_file: "detection_rules.yaml"

# =============================================================================
# HIRAG CONFIGURATION
# =============================================================================

hirag:
  enabled: true

  community:
    algorithm: "leiden" # Leiden community detection
    resolution: 1.0
    min_size: 3

  retrieval:
    global_k: 3 # Top communities
    local_k: 5 # Top entities
    bridge_enabled: true # Enable shortest path

  embedding:
    model: "text-embedding-3-small"
    dimension: 1536
    batch_size: 100

# =============================================================================
# PREFETCHING
# =============================================================================

prefetching:
  enabled: true

  strategies:
    graph_based:
      enabled: true
      relations: ["imports", "calls", "tests", "types"]
      max_candidates: 3

    trajectory_based:
      enabled: true
      model: "markov" # Simple Markov chain
      history_length: 10
      max_predictions: 2

  cache:
    max_size: 50 # LRU cache size
    ttl_seconds: 300 # 5 minute TTL

  async: true # Non-blocking prefetch

# =============================================================================
# GARBAGE COLLECTION
# =============================================================================

garbage_collection:
  enabled: true
  algorithm: "mark_and_sweep"

  protected:
    - "attention_sink" # Never evict (first 4 tokens)
    - "current_query" # Current user request
    - "pinned_context" # User-marked important
    - "recent_actions" # Last 5 actions

  summarization:
    trigger_threshold: 1000 # Tokens before summarization
    target_size: 500 # Compress to this size
    preserve_decisions: true # Keep key decisions

  sweep_interval: "per_turn" # When to run GC

# =============================================================================
# ERROR RECOVERY
# =============================================================================

error_recovery:
  merkle_corruption:
    action: "rebuild_tree"
    notify_user: false

  graph_stale:
    action: "incremental_update"
    fallback: "full_rebuild"

  jit_empty:
    fallback_chain:
      - "git_history" # Try HEAD~1
      - "semantic_search" # Find similar
      - "ask_user" # Last resort

  router_low_confidence:
    threshold: 0.7
    action: "user_confirmation"

# =============================================================================
# METRICS & OBSERVABILITY
# =============================================================================

metrics:
  enabled: true

  tracked:
    cer:
      description: "Context Efficiency Ratio"
      formula: "modified_tokens / total_loaded"
      target: 0.5

    ttfa:
      description: "Time to First Action"
      components: ["intent", "validation", "retrieval", "assembly"]
      target_ms: 500

    localization:
      description: "File Localization Accuracy"
      formula: "correct_files / total_attempts"
      target: 0.6

    token_savings:
      description: "Baseline Token Reduction"
      formula: "(baseline - actual) / baseline"
      target: 0.9

  export:
    format: "prometheus"
    endpoint: "/metrics"

# =============================================================================
# MODULE PATHS
# =============================================================================

modules:
  base_path: ".agent/scripts/hsa"

  files:
    merkle_tree: "merkle_tree.py"
    file_hasher: "file_hasher.py"
    change_detector: "change_detector.py"
    project_detector: "project_detector.py"
    detection_rules: "detection_rules.yaml"
    hirag_retriever: "hirag_retriever.py"
    community_graph: "community_graph.py"
    bridge_finder: "bridge_finder.py"
    token_budget: "token_budget.py"
    context_gc: "context_gc.py"
    smart_truncation: "smart_truncation.py"
    prefetcher: "prefetcher.py"
    trajectory_model: "trajectory_model.py"
    hsa_v4_engine: "hsa_v4_engine.py"
    tests: "test_hsa_v4.py"

# =============================================================================
# FEATURE FLAGS
# =============================================================================

feature_flags:
  merkle_indexing: true
  scoring_detection: true
  hirag_3level: true
  adaptive_budget: true
  proactive_prefetch: true
  mark_sweep_gc: true
  trajectory_prediction: false # Phase 5
  bridge_context: true

