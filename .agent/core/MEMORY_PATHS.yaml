# DOMYH Awesome Code — Memory Paths
# Single Source of Truth for all memory file paths
# Eliminates 16 duplicate path definitions across config files

engine: memory_paths

# =============================================================================
# CORE MEMORY PATHS
# =============================================================================

paths:
  # Layer 1: Working Memory (always in context)
  working:
    session_cache: core/session_cache.json

  # Layer 2: Session Memory
  session:
    notes: memory/session.md
    context_snapshot: memory/CONTEXT_SNAPSHOT.md # Cold-start restore
    project_plan: memory/project_plan.md        # P0-P6 plan persistence

  # Layer 3: State Memory
  state:
    decisions: memory/decisions.md
    project_state: memory/state.json
    audit_summary: memory/audit_summary.json

  # Layer 4: Semantic Memory
  semantic:
    vectors: memory/vectors/

  # Active Memory
  active:
    memories: memory/active_memories.json
    insights: memory/insights.md
    consolidated: memory/consolidated.md
    session_rules: memory/session_rules.json

  # Extended Memory
  extended:
    core_memory: memory/core_memory/
    graph: memory/graph/
    patterns: memory/patterns/

  # Layer 5: Session Governance (v7.0) — persisted by HSA MCP tools
  governance:
    session_state: ".agent/hsa/session-state.json"  # Intent, hierarchy, anchors, metrics
    hierarchy_archive: memory/archive/hierarchies/  # Completed session hierarchies

# =============================================================================
# ARCHIVE PATHS
# =============================================================================

archive:
  base: memory/archive/
  subdirs:
    sessions: memory/archive/sessions/
    errors: memory/archive/errors/
    decisions: memory/archive/decisions/
    audits: memory/archive/audits/
    phases: memory/archive/phases/
    vectors: memory/archive/vectors/
    consolidation: memory/archive/consolidation/
    forgotten: memory/archive/forgotten/

# =============================================================================
# LOG PATHS
# =============================================================================

logs:
  cleanup: memory/cleanup_log.json
  metrics: memory/metrics.json
  consolidation: memory/consolidation_log.json

# =============================================================================
# STATE OWNERSHIP (v7.3 — clarifies who reads/writes what)
# =============================================================================

ownership:
  critical_runtime:  # Agent MUST read on session start
    - path: "memory/CONTEXT_SNAPSHOT.md"
      owner: "hsa_session(persist) OR auto-shutdown fallback"
      read_when: "Session start (cold-start recovery)"
    - path: "memory/session.md"
      owner: "hsa_session(persist)"
      read_when: "Session start (last 5 entries)"
    - path: "memory/state.json"
      owner: "hsa_detect(stack) + agent preferences"
      read_when: "Session start (project context)"

  hsa_managed:  # HSA engine owns — agent reads via tools only
    - path: ".agent/hsa/session-state.json"
      owner: "HSA engine exclusively"
      agent_access: "Read via hsa_session/hsa_report tools"
    - path: ".agent/hsa/episodic-memory.json"
      owner: "HSA engine via hsa_memory tool"
      agent_access: "Read/write via hsa_memory(store|recall|list|delete|stats)"

  deprecated:
    - path: "memory/decisions.md"
      status: "Use hsa_session anchors (category: decision) instead"
    - path: "memory/session_rules.json"
      note: "Still functional but rarely used. Managed by SESSION_001-002."

# =============================================================================
# USAGE (How other files reference this)
# =============================================================================

usage:
  reference: "core/MEMORY_PATHS.yaml"
  import_pattern: |
    # In other config files:
    paths:
      reference: core/MEMORY_PATHS.yaml
      # Use: paths.session.notes, paths.archive.sessions, etc.

  examples:
    # NOTE: These engines are archived design specs in core/archive/
    - "MEMORY_ENGINE.yaml → archive.base"
    - "CONTEXT_INJECTOR.yaml → paths.session.notes"
    - "CLEANUP_ENGINE.yaml → archive.sessions"
    - "SUMMARIZATION_ENGINE.yaml → archive.sessions"
    - "SEMANTIC_ENGINE.yaml → paths.semantic.vectors"
