# =============================================================================
# 🔧 GO
# =============================================================================

go:
  philosophy: "Simple is better than clever"

  naming:
    packages: "lowercase, short" # user, http
    public: "PascalCase" # UserService
    private: "camelCase" # userRepo
    interfaces: "verb-er" # Reader, Writer
    constants: "PascalCase" # MaxRetries

  patterns:
    error_handling: |
      if err != nil {
          return fmt.Errorf("context: %w", err)
      }

    dependency_injection: |
      func NewService(repo Repository) *Service {
          return &Service{repo: repo}
      }

    context_propagation: |
      func DoWork(ctx context.Context) error {
          select {
          case <-ctx.Done():
              return ctx.Err()
          default:
              // work
          }
      }

    interface_definition: |
      type Repository interface {
          FindByID(ctx context.Context, id string) (*Entity, error)
      }

  anti_patterns:
    - "Don't panic in libraries"
    - "Don't use naked returns"
    - "Don't ignore errors"
    - "Don't use init() excessively"

  project_structure: |
    cmd/          # Entry points
    internal/     # Private code
    pkg/          # Public libraries
    api/          # API definitions

# =============================================================================
# 🐍 PYTHON
# =============================================================================

python:
  philosophy: "Readability counts"

  naming:
    modules: "snake_case" # user_service.py
    classes: "PascalCase" # UserService
    functions: "snake_case" # get_user_by_id
    constants: "UPPER_SNAKE" # MAX_RETRIES
    private: "_prefix" # _internal_func

  patterns:
    type_hints: |
      def get_user(user_id: int) -> User | None:
          pass

    context_manager: |
      with open("file.txt") as f:
          content = f.read()

    async_await: |
      async def fetch_data(url: str) -> dict:
          async with aiohttp.ClientSession() as session:
              async with session.get(url) as response:
                  return await response.json()

    dataclass: |
      @dataclass
      class User:
          id: int
          name: str
          email: str | None = None

  anti_patterns:
    - "Don't use mutable default args"
    - "Don't catch bare exceptions"
    - "Don't use wildcard imports"
    - "Don't ignore type hints"

  project_structure: |
    src/
      domain/       # Business logic
      application/  # Use cases
      infrastructure/  # External
    tests/
    pyproject.toml

# =============================================================================
# 📘 TYPESCRIPT
# =============================================================================

typescript:
  philosophy: "Type safety enables refactoring"

  naming:
    files: "kebab-case" # user-service.ts
    classes: "PascalCase" # UserService
    interfaces: "PascalCase" # IUserRepository
    functions: "camelCase" # getUserById
    constants: "UPPER_SNAKE" # MAX_RETRIES
    types: "PascalCase" # UserResponse

  patterns:
    type_guards: |
      function isUser(value: unknown): value is User {
        return typeof value === 'object' && value !== null && 'id' in value;
      }

    result_pattern: |
      type Result<T, E = Error> = 
        | { ok: true; value: T }
        | { ok: false; error: E };

    zod_validation: |
      const UserSchema = z.object({
        id: z.string().uuid(),
        email: z.string().email(),
      });
      type User = z.infer<typeof UserSchema>;

    react_component: |
      interface Props {
        user: User;
        onUpdate: (user: User) => void;
      }

      export function UserCard({ user, onUpdate }: Props) {
        return <div>{user.name}</div>;
      }

  anti_patterns:
    - "Don't use 'any'"
    - "Don't skip null checks"
    - "Don't mutate state directly"
    - "Don't export default"

  project_structure: |
    src/
      components/   # UI
      hooks/        # Custom hooks
      lib/          # Utilities
      types/        # Type definitions
      app/          # Next.js routes

# =============================================================================
# 🦀 RUST
# =============================================================================

rust:
  philosophy: "Memory safety without GC"

  naming:
    modules: "snake_case" # user_service.rs
    structs: "PascalCase" # UserService
    functions: "snake_case" # get_user_by_id
    constants: "UPPER_SNAKE" # MAX_RETRIES
    lifetimes: "lowercase short" # 'a, 'b

  patterns:
    error_handling: |
      fn parse_config(path: &str) -> Result<Config, ConfigError> {
          let content = fs::read_to_string(path)?;
          let config: Config = serde_json::from_str(&content)?;
          Ok(config)
      }

    builder_pattern: |
      impl UserBuilder {
          pub fn name(mut self, name: String) -> Self {
              self.name = Some(name);
              self
          }
          pub fn build(self) -> Result<User, Error> { ... }
      }

    option_handling: |
      let name = user.name.as_ref().map(|n| n.to_uppercase());
      // or
      let name = user.name.unwrap_or_default();

    async_function: |
      async fn fetch_user(id: &str) -> Result<User> {
          let response = reqwest::get(url).await?;
          let user = response.json::<User>().await?;
          Ok(user)
      }

  anti_patterns:
    - "Don't use unwrap in library code"
    - "Don't clone excessively"
    - "Don't fight the borrow checker"
    - "Don't use unsafe without reason"

  project_structure: |
    src/
      lib.rs        # Library root
      main.rs       # Binary entry
      domain/       # Business logic
      api/          # HTTP handlers
    Cargo.toml

# =============================================================================
# ☕ JAVA
# =============================================================================

java:
  philosophy: "OOP with strong typing"

  naming:
    packages: "lowercase.reversed" # com.example.user
    classes: "PascalCase" # UserService
    methods: "camelCase" # getUserById
    constants: "UPPER_SNAKE" # MAX_RETRIES
    interfaces: "PascalCase" # UserRepository

  patterns:
    record: |
      public record User(Long id, String name, String email) {}

    stream_api: |
      List<String> names = users.stream()
          .filter(u -> u.getAge() > 18)
          .map(User::getName)
          .collect(Collectors.toList());

    optional: |
      Optional<User> user = repository.findById(id);
      return user.map(User::getName).orElse("Unknown");

    spring_service: |
      @Service
      public class UserService {
          private final UserRepository repository;
          
          public UserService(UserRepository repository) {
              this.repository = repository;
          }
      }

  anti_patterns:
    - "Don't use null when Optional fits"
    - "Don't ignore checked exceptions"
    - "Don't use raw types"
    - "Don't over-engineer"

  project_structure: |
    src/main/java/
      com/example/
        domain/       # Entities
        repository/   # Data access
        service/      # Business logic
        controller/   # HTTP

# =============================================================================
# 🍎 SWIFT
# =============================================================================

swift:
  philosophy: "Protocol-oriented programming"

  naming:
    types: "PascalCase" # UserService
    methods: "camelCase" # getUserById
    properties: "camelCase" # userName
    protocols: "PascalCase" # Fetchable

  patterns:
    async_await: |
      func fetchUser(id: String) async throws -> User {
          let (data, _) = try await URLSession.shared.data(from: url)
          return try JSONDecoder().decode(User.self, from: data)
      }

    result_type: |
      func parse(_ json: Data) -> Result<User, ParseError> {
          do {
              let user = try JSONDecoder().decode(User.self, from: json)
              return .success(user)
          } catch {
              return .failure(.invalidJSON)
          }
      }

    property_wrapper: |
      @State private var isLoading = false
      @Binding var user: User
      @EnvironmentObject var store: AppStore

    swiftui_view: |
      struct UserCard: View {
          let user: User
          
          var body: some View {
              VStack {
                  Text(user.name)
              }
          }
      }

  anti_patterns:
    - "Don't force unwrap in production"
    - "Don't ignore optionals"
    - "Don't use class when struct works"
    - "Don't block main thread"

