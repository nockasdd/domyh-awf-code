# =============================================================================
# FOOTER TEMPLATE
# =============================================================================

# Format: _DOMYH Awesome Code v5.5 • Plan Pro v3.2 • Deep Interview_
footer_template: "_DOMYH Awesome Code {version_short} • {component_name} v{component_version} • {component_tagline}_"

# =============================================================================
# SYNC TARGETS
# =============================================================================
# See BRANDING.yaml for full sync_targets list

sync_on_version_update:
  - ".agent/manifest.yaml → version"
  - ".agent/config.yaml → header comment"
  - ".agent/memory/state.json → system.version"
  - ".agent/i18n/vi.yaml → app.version"
  - ".agent/i18n/en.yaml → app.version"
  - "GEMINI.md → header + footer"
  - ".agent/workflows/*.md → footer"
  - ".agent/skills/*/SKILL.md → footer"
  - ".agent/templates/*.md → footer"
