# =============================================================================
# VERSION REFERENCE PATTERN (VRP) — Auto-Sync Configuration
# =============================================================================
# Run: nock awf sync-version [--dry-run] [--validate]
# =============================================================================

sync:
  enabled: true
  version: "1.0.0" # VRP version

  # ==========================================================================
  # SYNC PATTERNS
  # ==========================================================================
  patterns:
    # Pattern 1: YAML version fields
    yaml_version:
      description: "Update version: field in YAML files"
      regex: 'version: "[0-9]+\\.[0-9]+\\.[0-9]+"'
      replace: 'version: "{system.version}"'
      targets:
        - ".agent/core/*.yaml"
        - ".agent/skills/**/META.yaml"
        - ".agent/templates/tasks/*.yaml"
        - ".agent/personas/*.yaml"
      exclude:
        - ".agent/core/VERSION.yaml" # SSoT itself
        - ".agent/core/HSA.yaml" # HSA-specific version
        - ".agent/skills/_router.yaml" # Schema version
        - ".agent/skills/_categories.yaml"

    # Pattern 2: Markdown footers
    md_footer:
      description: "Update _DOMYH Awesome Code vX.X.X footers"
      regex: '_DOMYH Awesome Code v[0-9]+\\.[0-9]+(\\.[0-9]+)?'
      replace: "_DOMYH Awesome Code v{system.version}"
      targets:
        - ".agent/workflows/*.md"
        - ".agent/templates/**/*.md"
        - ".agent/skills/**/SKILL.md"
        - ".agent/rules/**/*.md"
        - "GEMINI.md"

    # Pattern 3: Markdown headers with version
    md_header:
      description: "Update # Title vX.X.X headers"
      regex: '(# .+DOMYH.+)v[0-9]+\\.[0-9]+(\\.[0-9]+)?'
      replace: '\\1v{system.version}'
      targets:
        - ".agent/templates/README.md"
        - ".agent/core/README.md"

    # Pattern 4: JSON version fields
    json_version:
      description: "Update version in JSON files"
      regex: '"version": "v?[0-9]+\\.[0-9]+\\.[0-9]+"'
      replace: '"version": "v{system.version}"'
      targets:
        - ".agent/memory/state.json"

  # ==========================================================================
  # VALIDATION
  # ==========================================================================
  validation:
    pre_check:
      - "SSoT file exists and valid YAML"
      - "Version follows semver format"

    post_check:
      - "All targets updated"
      - "No orphan version references"

    drift_detection:
      enabled: true
      schedule: "on_commit"
      action: "warn"
      threshold: 0

  # ==========================================================================
  # CLI OPTIONS
  # ==========================================================================
  cli:
    command: "nock awf sync-version"
    options:
      dry_run: "--dry-run"
      validate: "--validate"
      verbose: "--verbose"
      report: "--report"

# =============================================================================
# LEGACY SYNC TARGETS (for reference)
# =============================================================================

sync_targets_legacy:
  - ".agent/manifest.yaml → version"
  - ".agent/config.yaml → header comment"
  - ".agent/memory/state.json → system.version"
  - ".agent/i18n/vi.yaml → app.version"
  - ".agent/i18n/en.yaml → app.version"
  - "GEMINI.md → header + footer"
  - ".agent/workflows/*.md → footer"
  - ".agent/skills/*/SKILL.md → footer"
  - ".agent/templates/*.md → footer"
