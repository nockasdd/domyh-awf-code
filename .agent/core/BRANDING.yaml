# =============================================================================
# BRANDING.yaml — Single Source of Truth for Project Identity
# =============================================================================
# IMPORTANT: Tất cả thông tin về project name, developer, URLs... NÊN đọc từ đây
# Khi rebranding, CHỈ cần sửa file này
# =============================================================================

# =============================================================================
# PROJECT IDENTITY
# =============================================================================

identity:
  name: "DOMYH Awesome Code" # Tên chính thức
  name_short: "DOMYH" # Viết tắt
  tagline: "AI-powered development assistant"
  tagline_vi: "Trợ lý Phát triển Ứng dụng AI"

  developer: "NockDev"
  organization: "DOMYH"

  # Repository và docs
  repository: "https://github.com/nockasdd/domyh-awesome-code-agent"
  documentation: "https://domyh.dev/docs"

  # License
  license: "MIT"
  copyright_year: 2026

# =============================================================================
# LANGUAGE DEFAULTS
# =============================================================================

language:
  default: "vi" # vi | en
  supported: ["vi", "en"]

  # Language-specific settings
  settings:
    vi:
      name: "Tiếng Việt"
      code: "vi"
      honorific_agent: "em" # Agent tự xưng
      honorific_user: "anh/chị" # Gọi user
      use_emoji: true

    en:
      name: "English"
      code: "en"
      honorific_agent: "I"
      honorific_user: "you"
      use_emoji: true

# =============================================================================
# FORMATTING STANDARDS
# =============================================================================

formatting:
  # Footer format cho tất cả files
  footer_template: "_DOMYH Awesome Code v{version} • {component_name} • {component_tagline}_"

  # Header format cho SKILL.md
  skill_header_template: "# {skill_name} — DOMYH Awesome Code v{version}"

  # Progress bar format
  progress_bar:
    filled: "█"
    empty: "░"
    width: 10 # Số ký tự
    format: "📊 {bar} {percent}% ({current}/{total})"

  # Box characters
  box:
    top_bottom: "━"
    separator: "───"

  # Emoji standards
  emojis:
    success: "✅"
    error: "❌"
    warning: "⚠️"
    info: "ℹ️"
    stop: "⛔"
    progress: "⏳"
    complete: "🎉"

# =============================================================================
# PRIORITY SYSTEM
# =============================================================================

priority:
  levels:
    p0:
      name: "Critical"
      name_vi: "Nghiêm trọng"
      emoji: "🔴"
      action: "Sửa ngay lập tức"

    p1:
      name: "High"
      name_vi: "Cao"
      emoji: "🟠"
      action: "Phải sửa trước khi deploy"

    p2:
      name: "Medium"
      name_vi: "Trung bình"
      emoji: "🟡"
      action: "Sửa trong sprint này"

    p3:
      name: "Low"
      name_vi: "Thấp"
      emoji: "🟢"
      action: "Có thì tốt"

# =============================================================================
# QUALITY LEVELS (for Auto Test Loop)
# =============================================================================

quality_levels:
  mvp:
    name: "MVP"
    auto_test: false
    description: "Speed priority, minimal testing"

  production:
    name: "Production"
    auto_test: true
    description: "Quality standard, full test coverage"

  enterprise:
    name: "Enterprise"
    auto_test: true
    integration_tests: true
    description: "Full coverage with integration tests"

# =============================================================================
# COMPLEXITY LEVELS (for Phase Generation)
# =============================================================================

complexity:
  simple:
    tasks: "< 5"
    phases: "1-2"
    examples: ["Add a button", "Fix a bug", "Update text"]

  medium:
    tasks: "5-15"
    phases: "3-4"
    examples: ["New API endpoint", "Refactor module", "Add feature"]

  complex:
    tasks: "15+"
    phases: "5+"
    examples: ["New feature system", "Major refactor", "Architecture change"]

# =============================================================================
# SYNC TARGETS (for version updates)
# =============================================================================

sync_targets:
  # Files that need version sync
  version_files:
    - ".agent/core/VERSION.yaml" # Primary SSoT
    - ".agent/manifest.yaml"
    - ".agent/config.yaml"
    - ".agent/memory/state.json"
    - ".agent/i18n/vi.yaml"
    - ".agent/i18n/en.yaml"
    - "GEMINI.md"

  # Files that need project name sync
  identity_files:
    - ".agent/manifest.yaml"
    - ".agent/memory/state.json"
    - ".agent/i18n/vi.yaml"
    - ".agent/i18n/en.yaml"
    - "GEMINI.md"
    - "README.md"

  # Pattern-based targets
  patterns:
    workflows: ".agent/workflows/*.md"
    skills: ".agent/skills/*/SKILL.md"
    templates: ".agent/templates/*.md"
