# DOMYH Awesome Code — Semantic Memory Engine v5.5
# Optional vector-based memory with LanceDB
# Enable by setting: enabled: true

version: "4.3.0"
engine: semantic_memory
status: optional # User must opt-in

# =============================================================================
# CONFIGURATION
# =============================================================================

config:
  enabled: false # Set to true to enable semantic memory

  # LanceDB embedded database
  database:
    type: lancedb
    path: memory/vectors/
    name: domyh_memory

  # Embedding model
  embedding:
    model: "text-embedding-3-small" # OpenAI
    dimensions: 1536
    fallback: "local" # Use local embeddings if API unavailable

  # Local embedding fallback
  local_embedding:
    model: "all-MiniLM-L6-v2" # Sentence Transformers
    dimensions: 384

  # Token budget
  tokens:
    max_results: 2500
    per_result: 500
    top_k: 5

# =============================================================================
# COLLECTIONS (Tables)
# =============================================================================

collections:
  # Audit history collection
  audits:
    description: "Full audit reports and findings"
    schema:
      id: string
      date: timestamp
      type: string # full, backend, frontend, security
      score: float
      findings: text
      recommendations: text
      embedding: vector[1536]

    index_on:
      - audit_complete

    queries:
      similar_issues: "Find audits with similar issues"
      score_trend: "Track score changes over time"
      by_type: "Filter by audit type"

  # Decisions collection
  decisions:
    description: "Architectural and technical decisions"
    schema:
      id: string
      date: timestamp
      title: string
      context: text
      decision: text
      rationale: text
      category: string
      embedding: vector[1536]

    index_on:
      - decision_made

    queries:
      similar_decisions: "Find similar past decisions"
      by_category: "Filter by decision category"
      search: "Free-text semantic search"

  # Code reviews collection
  code_reviews:
    description: "Code review findings and suggestions"
    schema:
      id: string
      date: timestamp
      files: list[string]
      findings: text
      suggestions: text
      severity: string
      embedding: vector[1536]

    index_on:
      - review_complete

    queries:
      similar_issues: "Find similar code issues"
      by_file: "Filter by file path"

  # Error patterns collection
  error_patterns:
    description: "Resolved errors and solutions"
    schema:
      id: string
      date: timestamp
      error_type: string
      error_message: text
      file: string
      solution: text
      embedding: vector[1536]

    index_on:
      - error_resolved

    queries:
      find_solution: "Find similar error solutions"
      by_type: "Filter by error type"

# =============================================================================
# INDEXING OPERATIONS
# =============================================================================

indexing:
  # When to index new content
  triggers:
    - audit_complete
    - decision_made
    - review_complete
    - error_resolved

  # Batch indexing settings
  batch:
    size: 10
    async: true
    retry_on_failure: 3

  # Content preprocessing
  preprocessing:
    - remove_code_blocks: false # Keep code for context
    - truncate_long_text: 2000 # Max chars per field
    - normalize_whitespace: true

  # Embedding generation
  embedding_generation:
    combine_fields: true # Combine all text fields
    separator: "\n\n"
    max_tokens: 8000 # Model limit

# =============================================================================
# QUERY OPERATIONS
# =============================================================================

queries:
  # Default search settings
  defaults:
    top_k: 5
    min_score: 0.7
    include_metadata: true

  # Query types
  types:
    # Semantic similarity search
    semantic:
      description: "Find semantically similar content"
      method: vector_similarity
      distance: cosine

    # Hybrid search (semantic + keyword)
    hybrid:
      description: "Combine semantic and keyword search"
      method: hybrid
      semantic_weight: 0.7
      keyword_weight: 0.3

    # Filtered search
    filtered:
      description: "Semantic search with filters"
      method: vector_similarity
      filters: [date_range, type, category]

  # Query commands
  commands:
    "/search":
      collection: all
      type: semantic
      example: "/search authentication patterns"

    "/find-similar":
      collection: auto # Detect from context
      type: semantic
      example: "/find-similar this error"

    "/recall":
      collection: decisions
      type: semantic
      example: "/recall database choice"

# =============================================================================
# SEARCH TEMPLATES
# =============================================================================

search_templates:
  # Find similar audit issues
  similar_audit_issues: |
    Query: {query}
    Collection: audits
    Fields: findings, recommendations
    Return: date, score, findings_summary

  # Find relevant decisions
  relevant_decisions: |
    Query: {query}
    Collection: decisions
    Fields: title, context, decision, rationale
    Return: date, title, decision

  # Find error solutions
  error_solution: |
    Query: {error_message}
    Collection: error_patterns
    Fields: error_message, solution
    Return: error_type, solution, file

# =============================================================================
# RESULT FORMATTING
# =============================================================================

formatting:
  # Result template
  result_template: |
    ### {title}
    **Date**: {date}
    **Relevance**: {score}%

    {summary}

    ---

  # Summary generation
  summary:
    max_length: 200
    include_highlights: true

  # Token optimization
  optimization:
    truncate_long_results: true
    max_tokens_per_result: 500
    combine_similar: true
    similarity_threshold: 0.95

# =============================================================================
# MAINTENANCE
# =============================================================================

maintenance:
  # Index optimization
  optimize:
    schedule: weekly
    actions:
      - rebuild_index
      - remove_duplicates
      - compact_storage

  # Cleanup old data
  cleanup:
    audits:
      max_age_days: 365
      keep_min: 10

    decisions:
      max_age_days: 730 # 2 years
      keep_min: 50

    error_patterns:
      max_age_days: 180
      keep_min: 20

  # Backup
  backup:
    enabled: true
    path: memory/archive/vectors/
    schedule: monthly
    keep_count: 3

# =============================================================================
# INTEGRATION
# =============================================================================

integration:
  # Memory engine integration
  memory_engine:
    layer: 4 # Semantic layer
    max_tokens: 2500
    load_on: semantic_query

  # Workflow integration
  workflows:
    /ap:
      on_complete:
        - index: audits
        - fields: [score, findings, recommendations]

    /code:
      on_review:
        - index: code_reviews
        - fields: [findings, suggestions]

    /debug:
      on_resolved:
        - index: error_patterns
        - fields: [error_message, solution]

  # Recap integration
  recap:
    include_in_summary: false # Don't auto-include
    available_via: "/recap semantic"

# =============================================================================
# FALLBACK BEHAVIOR
# =============================================================================

fallback:
  # When semantic search is disabled or unavailable
  on_disabled:
    - use: keyword_search
    - source: file_based_memory
    - warn: false

  # When embedding API fails
  on_api_failure:
    - retry: 3
    - fallback: local_embedding
    - cache_locally: true

  # When no results found
  on_no_results:
    - expand_query: true
    - lower_threshold: 0.5
    - suggest_alternatives: true
