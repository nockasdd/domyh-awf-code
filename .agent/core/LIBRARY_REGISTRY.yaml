# 🎸 OTHER LANGUAGES
# =============================================================================

kotlin:
  android:
    - jetpack-compose # Modern UI
    - retrofit # HTTP
    - room # Database
    - dagger-hilt # DI
    - coroutines # Async

php:
  frameworks:
    - laravel # Full-stack
