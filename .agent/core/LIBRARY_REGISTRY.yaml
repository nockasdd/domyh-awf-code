  ui:
    - maui # Cross-platform
    - wpf # Windows

# =============================================================================
# 🎯 SELECTION LOGIC
# =============================================================================

selection_rules:
  by_use_case:
    web_api:
      go: [gin, echo, fiber]
      python: [fastapi, flask]
      typescript: [express, fastify, nestjs]
      rust: [actix-web, axum]
      java: [spring-boot, quarkus]

    full_stack:
      python: [django]
      typescript: [nextjs, nuxt, remix]
      java: [spring-boot]
      php: [laravel]

    microservices:
      go: [gin, go-kit]
      java: [quarkus, micronaut]
      rust: [axum]
      typescript: [nestjs]

    mobile_ios:
      swift: [swiftui, alamofire, kingfisher]

    mobile_android:
      kotlin: [jetpack-compose, retrofit, room]

    data_science:
      python: [pandas, numpy, scikit-learn]

    machine_learning:
      python: [pytorch, tensorflow, transformers]

    cli_tools:
      go: [cobra]
      rust: [clap]
      python: [click, typer]

    game_dev:
      cpp: [sdl, sfml]
      lua: [love2d]
      csharp: [unity]

  by_priority:
    performance: [rust, go, cpp]
    productivity: [python, typescript]
    enterprise: [java, csharp]
    mobile: [swift, kotlin]
