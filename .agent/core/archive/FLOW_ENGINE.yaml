# Flow Engine Configuration
# DOMYH Awesome Code
# Connects workflows into intelligent chains

version: "6.3.2"

# =============================================================================
# FLOW DEFINITIONS
# Pre-configured workflow chains for common patterns
# =============================================================================

flows:
  # -------------------------------------------------------------------------
  # NEW PROJECT FLOW
  # Complete project creation from idea to deployment
  # -------------------------------------------------------------------------
  new_project:
    name: "New Project Flow"
    description: "Create complete project from scratch"
    trigger: ["create project", "new app", "khởi tạo dự án"]

    steps:
      - id: init
        workflow: init
        output: project_state
        required: true

      - id: scaffold
        workflow: code
        input: "project_state.phases.P1"
        description: "Create foundation files"
        loop:
          until: "phase_P1_complete"
          max_iterations: 10

      - id: implement
        workflow: code
        input: "project_state.phases.P2"
        description: "Implement core logic"
        loop:
          until: "phase_P2_complete"

      - id: test
        workflow: test
        condition: "code_complete"
        retry:
          on_fail: 2

      - id: deploy
        workflow: deploy
        condition: "all_tests_pass"
        optional: true

  # -------------------------------------------------------------------------
  # FIX PROJECT FLOW
  # Comprehensive project repair workflow
  # -------------------------------------------------------------------------
  fix_project:
    name: "Fix Existing Project"
    description: "Audit and fix issues in existing project"
    trigger: ["fix project", "sửa project", "repair"]

    steps:
      - id: detect
        workflow: modify
        phase: detect
        output: project_analysis

      - id: plan_fixes
        workflow: modify
        phase: plan
        input: project_analysis

      - id: apply_fixes
        workflow: modify
        phase: execute
        loop:
          for_each: "fixes"
          batch_size: 5

      - id: debug_remaining
        workflow: debug
        condition: "errors_found"
        optional: true

      - id: verify
        workflow: test
        required: true

      - id: review
        workflow: review
        condition: "tests_pass"

  # -------------------------------------------------------------------------
  # FEATURE DEVELOPMENT FLOW
  # Standard feature implementation pattern
  # -------------------------------------------------------------------------
  feature_development:
    name: "Feature Development"
    description: "Plan and implement a new feature"
    trigger: ["add feature", "implement", "thêm tính năng"]

    steps:
      - id: understand
        workflow: plan
        phase: understand
        output: feature_spec

      - id: design
        workflow: plan
        phase: design
        input: feature_spec

      - id: implement
        workflow: code
        input: feature_spec
        loop:
          until: "spec_complete"
          checkpoint: true

      - id: test
        workflow: test
        scope: "new_code"

      - id: review
        workflow: review
        required: true

  # -------------------------------------------------------------------------
  # BUG FIX FLOW
  # Systematic debugging pattern
  # -------------------------------------------------------------------------
  bug_fix:
    name: "Bug Fix Flow"
    description: "Debug and fix a specific issue"
    trigger: ["fix bug", "debug", "sửa lỗi"]

    steps:
      - id: reproduce
        workflow: debug
        phase: reproduce
        required: true

      - id: isolate
        workflow: debug
        phase: isolate

      - id: fix
        workflow: code
        mode: "fix"

      - id: verify
        workflow: test
        scope: "regression"

      - id: document
        workflow: doc
        optional: true

  # -------------------------------------------------------------------------
  # CODE REVIEW FLOW
  # Comprehensive review before merge
  # -------------------------------------------------------------------------
  code_review:
    name: "Code Review Flow"
    description: "Full review before merging"
    trigger: ["review code", "pre-merge", "kiểm tra code"]

    steps:
      - id: static_analysis
        workflow: ap
        scope: "changed_files"

      - id: test
        workflow: test
        scope: "affected"

      - id: review
        workflow: review
        checklist: true

      - id: approve
        action: "wait_for_approval"
        timeout: 86400 # 24 hours

  # -------------------------------------------------------------------------
  # DEPLOYMENT FLOW
  # Safe deployment with verification
  # -------------------------------------------------------------------------
  deployment:
    name: "Deployment Flow"
    description: "Deploy with safety checks"
    trigger: ["deploy", "release", "phát hành"]

    steps:
      - id: pre_check
        workflow: test
        scope: "full"
        required: true

      - id: build
        workflow: deploy
        phase: build

      - id: deploy_staging
        workflow: deploy
        phase: staging
        optional: true

      - id: deploy_prod
        workflow: deploy
        phase: production
        confirm: true

      - id: verify
        workflow: monitor
        duration: 300 # 5 minutes
        rollback_on_fail: true

# =============================================================================
# FLOW EXECUTION SETTINGS
# =============================================================================

execution:
  # Default behavior
  default_mode: guided # guided | auto | manual

  # Checkpoints
  checkpoint_enabled: true
  checkpoint_dir: .domyh/checkpoints/

  # Resume behavior
  resume_on_failure: true
  max_retries: 3

  # Notifications
  notify_on_complete: true
  notify_on_error: true

# =============================================================================
# FLOW ROUTING
# Auto-detect which flow to use based on context
# =============================================================================

routing:
  enabled: true

  # Keywords → Flow mapping
  keywords:
    # New project keywords
    new: new_project
    create: new_project
    init: new_project
    khởi tạo: new_project

    # Fix keywords
    fix: fix_project
    repair: fix_project
    sửa: fix_project
    update: fix_project

    # Feature keywords
    feature: feature_development
    implement: feature_development
    add: feature_development

    # Debug keywords
    bug: bug_fix
    error: bug_fix
    debug: bug_fix
    lỗi: bug_fix

    # Deploy keywords
    deploy: deployment
    release: deployment
    ship: deployment

# =============================================================================
# HOOKS
# Custom actions at flow lifecycle points
# =============================================================================

hooks:
  on_flow_start:
    - action: save_state
    - action: notify_start

  on_step_complete:
    - action: update_progress
    - action: checkpoint

  on_flow_complete:
    - action: generate_summary
    - action: cleanup

  on_flow_error:
    - action: save_error_state
    - action: suggest_recovery

# _DOMYH Awesome Code
