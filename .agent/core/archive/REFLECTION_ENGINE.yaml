# =============================================================================
# DOMYH Awesome Code
# Reflection Engine - Critic Pattern & Reflexion
# =============================================================================

version: "6.4.3"

# =============================================================================
# OVERVIEW
# Self-critique and continuous improvement mechanisms
# =============================================================================

description: |
  The Reflection Engine enables the agent to:
  1. Evaluate its own outputs (Critic Pattern)
  2. Learn from failures (Reflexion)
  3. Store insights for future use
  4. Continuously improve performance

# =============================================================================
# CRITIC PATTERN
# Evaluate outputs before presenting to user
# =============================================================================

critic:
  enabled: true

  # When to activate critic
  triggers:
    - "code_generation"
    - "file_modification"
    - "complex_decisions"
    - "user_facing_outputs"

  # Evaluation dimensions
  dimensions:
    correctness:
      weight: 0.35
      description: "Is the output logically and syntactically correct?"
      checks:
        syntax:
          method: "language_parser"
          fail_action: "auto_fix"

        logic:
          method: "static_analysis"
          fail_action: "flag"

        types:
          method: "type_checker"
          fail_action: "auto_fix"

    completeness:
      weight: 0.25
      description: "Does it satisfy all requirements?"
      checks:
        requirements_met:
          method: "requirement_mapping"
          fail_action: "extend"

        edge_cases:
          method: "heuristic_check"
          fail_action: "flag"

    quality:
      weight: 0.25
      description: "Does it follow best practices?"
      checks:
        naming:
          method: "naming_convention"
          fail_action: "rename"

        structure:
          method: "complexity_analysis"
          fail_action: "refactor"

        documentation:
          method: "docstring_check"
          fail_action: "add_docs"

    security:
      weight: 0.15
      description: "Is it secure?"
      checks:
        secrets:
          method: "secret_scan"
          fail_action: "remove_and_warn"

        vulnerabilities:
          method: "owasp_check"
          fail_action: "flag"

  # Scoring and decisions
  scoring:
    method: "weighted_average"

    thresholds:
      excellent: 0.9
      good: 0.8
      acceptable: 0.7
      needs_work: 0.5
      reject: 0.0

    decisions:
      ">= 0.8": "accept"
      "0.5 - 0.8": "auto_improve"
      "< 0.5": "reject_or_escalate"

  # Feedback generation
  feedback:
    format: |
      ## Critic Evaluation

      **Score**: {score}/10
      **Decision**: {decision}

      ### Issues Found:
      {issues_list}

      ### Suggestions:
      {suggestions_list}

      ### Auto-fixes Applied:
      {auto_fixes_list}

# =============================================================================
# REFLEXION PATTERN
# Learn from failures and improve
# =============================================================================

reflexion:
  enabled: true

  # Trigger conditions
  triggers:
    explicit:
      - "user_correction"
      - "test_failure"
      - "critic_rejection"

    implicit:
      - "multiple_retries"
      - "unexpected_error"
      - "timeout"

  # Reflection process
  process:
    steps:
      1_capture:
        description: "Capture failure context"
        data:
          - original_request
          - attempted_solution
          - error_or_feedback
          - environment_state

      2_analyze:
        description: "Identify root cause"
        methods:
          - "error_pattern_matching"
          - "diff_analysis"
          - "context_review"

      3_generate_insight:
        description: "Create actionable insight"
        format:
          what_happened: "Description of the failure"
          why_it_failed: "Root cause analysis"
          how_to_prevent: "Prevention strategy"
          related_patterns: "Similar known issues"

      4_store:
        description: "Save to memory"
        targets:
          - "reflections memory"
          - "error_patterns.json"

      5_apply:
        description: "Use insight in retry"
        method: "context_injection"

  # Reflection templates by error type
  templates:
    syntax_error:
      pattern: "SyntaxError|TypeError|ParseError"
      insight: |
        Syntax error in {language}: {error_message}
        Location: {file}:{line}
        Fix pattern: {fix_description}
        Prevention: Check syntax before output

    logic_error:
      pattern: "AssertionError|LogicError|unexpected behavior"
      insight: |
        Logic error: {description}
        Expected: {expected}
        Actual: {actual}
        Root cause: {analysis}
        Fix: {solution}

    integration_error:
      pattern: "ImportError|ModuleNotFoundError|dependency"
      insight: |
        Integration issue: {description}
        Missing: {missing_component}
        Solution: {solution}
        Dependencies: {dependency_list}

    user_correction:
      pattern: "Actually|No,|That's wrong|Not quite"
      insight: |
        User corrected my understanding
        My assumption: {my_assumption}
        Correct interpretation: {correct_interpretation}
        Learning: {what_to_remember}

# =============================================================================
# SELF-IMPROVEMENT LOOP
# Continuous learning from execution
# =============================================================================

self_improvement:
  enabled: true

  # Learning signals
  signals:
    positive:
      - "user_approval"
      - "test_pass"
      - "critic_score >= 0.9"
      - "task_completed_first_try"

    negative:
      - "user_rejection"
      - "test_failure"
      - "critic_score < 0.5"
      - "multiple_retries_needed"

  # Knowledge extraction
  extraction:
    on_success:
      - "Extract successful patterns"
      - "Note effective approaches"
      - "Update skill confidence"

    on_failure:
      - "Extract failure patterns"
      - "Generate prevention rules"
      - "Lower skill confidence"

  # Pattern storage
  patterns:
    success_patterns:
      location: ".agent/memory/patterns/successes.json"
      schema:
        pattern_id: "string"
        context: "string"
        action: "string"
        outcome: "string"
        frequency: "int"
        last_used: "datetime"

    error_patterns:
      location: ".agent/memory/patterns/errors.json"
      schema:
        pattern_id: "string"
        error_type: "string"
        context: "string"
        root_cause: "string"
        prevention: "string"
        occurrences: "int"
        last_seen: "datetime"

# =============================================================================
# META-COGNITIVE CHECKS
# Higher-order reasoning about reasoning
# =============================================================================

meta_cognition:
  enabled: true

  checks:
    # Am I understanding the request correctly?
    understanding_check:
      trigger: "before_planning"
      questions:
        - "What is the user actually asking for?"
        - "Am I making any assumptions?"
        - "Should I clarify anything?"

    # Am I on the right track?
    progress_check:
      trigger: "every_n_steps"
      n: 3
      questions:
        - "Is this approach working?"
        - "Should I try a different strategy?"
        - "Am I getting closer to the goal?"

    # Did I miss anything?
    completion_check:
      trigger: "before_responding"
      questions:
        - "Did I address all requirements?"
        - "Are there any edge cases I missed?"
        - "Is my solution complete?"

    # Can I do better?
    quality_check:
      trigger: "after_critic"
      questions:
        - "Is this the best approach?"
        - "Could this be simpler?"
        - "Would an expert do it differently?"

# =============================================================================
# INTEGRATION WITH MEMORY
# How reflections connect to memory system
# =============================================================================

memory_integration:
  # Where to store reflections
  storage:
    short_term:
      location: "working_memory.reflections"
      ttl: "session"

    long_term:
      location: ".agent/memory/reflections/"
      format: "json"
      retention: "permanent"

  # How to use past reflections
  retrieval:
    on_similar_task:
      action: "Load related reflections"
      method: "semantic_similarity"
      threshold: 0.75

    on_same_error:
      action: "Load error-specific reflections"
      method: "error_pattern_match"

  # Consolidation
  consolidation:
    trigger: "weekly"
    action: "Summarize and archive old reflections"
    keep_top_n: 50
