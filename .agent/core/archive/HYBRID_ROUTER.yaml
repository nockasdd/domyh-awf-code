# =============================================================================
# DOMYH Awesome Code
# Hybrid Router - Multi-Strategy Semantic Routing
# =============================================================================

version: "6.3.9"

# =============================================================================
# OVERVIEW
# Combines TF-IDF, embeddings, and intent classification for optimal routing
# =============================================================================

description: |
  The Hybrid Router uses multiple strategies to route queries to skills:
  1. TF-IDF (keyword matching) - Fast, good for exact terms
  2. Embeddings (semantic similarity) - Deep meaning understanding
  3. Intent Classifier - High-level intent routing
  4. Pattern Matching - Fallback for explicit patterns

# =============================================================================
# STRATEGY CONFIGURATION
# =============================================================================

strategies:
  # ---------------------------------------------------------------------------
  # TF-IDF Strategy (existing, enhanced)
  # ---------------------------------------------------------------------------
  tfidf:
    enabled: true
    weight: 0.25

    description: "Keyword-based matching using TF-IDF vectors"

    config:
      tokenizer: "word"
      lowercase: true
      remove_stopwords: true
      min_term_frequency: 1
      max_document_frequency: 0.9

    use_for:
      - "Exact term matching"
      - "Technical keywords"
      - "Command detection"

    scoring:
      source_weights:
        name: 0.3
        description: 0.25
        keywords: 0.25
        detect_patterns: 0.2

  # ---------------------------------------------------------------------------
  # Embedding Strategy (NEW)
  # ---------------------------------------------------------------------------
  embedding:
    enabled: true
    weight: 0.40

    description: "Semantic similarity using vector embeddings"

    config:
      model: "all-MiniLM-L6-v2" # Local model
      dimensions: 384
      normalize: true
      cache_enabled: true
      cache_path: ".agent/cache/embeddings/"

    use_for:
      - "Semantic meaning"
      - "Synonyms and related concepts"
      - "Natural language queries"

    fallback_model: "tfidf" # If embedding fails

    precompute:
      on_startup: true
      skills_to_embed:
        - "name"
        - "description"
        - "keywords"
        - "examples"

  # ---------------------------------------------------------------------------
  # Intent Classifier (NEW)
  # ---------------------------------------------------------------------------
  intent:
    enabled: true
    weight: 0.25

    description: "High-level intent classification"

    config:
      method: "rule_based" # Options: rule_based, ml_classifier

    intents:
      code:
        patterns:
          - "create"
          - "implement"
          - "write"
          - "add"
          - "build"
        skills_boost: ["typescript", "python", "go", "react", "vue"]

      debug:
        patterns:
          - "fix"
          - "debug"
          - "error"
          - "bug"
          - "issue"
        skills_boost: ["testing", "security"]

      refactor:
        patterns:
          - "refactor"
          - "improve"
          - "optimize"
          - "clean"
        skills_boost: ["coding-rules"]

      deploy:
        patterns:
          - "deploy"
          - "release"
          - "production"
          - "ci/cd"
        skills_boost: ["docker", "kubernetes", "ci-cd"]

      review:
        patterns:
          - "review"
          - "check"
          - "audit"
          - "analyze"
        skills_boost: ["security", "testing", "coding-rules"]

      learn:
        patterns:
          - "how to"
          - "what is"
          - "explain"
          - "tutorial"
        skills_boost: [] # No specific boost

  # ---------------------------------------------------------------------------
  # Pattern Matching (fallback)
  # ---------------------------------------------------------------------------
  pattern:
    enabled: true
    weight: 0.10

    description: "Explicit pattern matching fallback"

    patterns:
      # Direct skill mentions
      skill_mention:
        regex: "@(\\w+)"
        action: "load_skill_by_name"

      # Command patterns
      commands:
        regex: "^/(\\w+)"
        action: "route_to_workflow"

      # File type detection
      file_types:
        regex: "\\.(ts|js|py|go|rs|java|cpp|c|rb|php)\\b"
        action: "boost_language_skill"

# =============================================================================
# SELECTION ALGORITHM
# =============================================================================

selection:
  # How to combine scores from different strategies
  combination:
    method: "weighted_sum"
    normalize: true

  # Selection parameters
  top_k: 5
  min_score: 0.30

  # Context-aware boosting
  boosts:
    # Boost recently used skills
    recent_usage:
      enabled: true
      weight: 0.10
      decay: "exponential"
      half_life: "5 queries"

    # Boost skills matching current project type
    project_context:
      enabled: true
      weight: 0.15

    # Boost core skills
    core_skills:
      enabled: true
      weight: 0.05
      skills: ["coding-rules", "security", "testing"]

  # Diversity in results
  diversity:
    enabled: true
    method: "maximal_marginal_relevance"
    lambda: 0.7 # Balance relevance vs diversity

# =============================================================================
# QUERY PREPROCESSING
# =============================================================================

preprocessing:
  steps:
    1_normalize:
      - "lowercase"
      - "remove_extra_whitespace"
      - "expand_abbreviations"

    2_extract:
      - "named_entities"
      - "programming_languages"
      - "file_paths"
      - "error_types"

    3_enrich:
      - "add_synonyms"
      - "expand_acronyms"

  abbreviations:
    ts: "typescript"
    js: "javascript"
    py: "python"
    rb: "ruby"
    rs: "rust"
    k8s: "kubernetes"

  synonyms:
    test:
      - "testing"
      - "unit test"
      - "spec"
    deploy:
      - "deployment"
      - "release"
      - "ship"
    fix:
      - "debug"
      - "repair"
      - "resolve"

# =============================================================================
# QUERY ROUTING
# =============================================================================

routing:
  # Route to different handlers based on query type
  routes:
    simple_query:
      condition: "len(query) < 50 AND no_code_request"
      handler: "single_skill"

    complex_query:
      condition: "len(query) >= 50 OR multiple_topics"
      handler: "multi_skill_ensemble"

    code_request:
      condition: "contains_code_intent"
      handler: "code_focused"

    ambiguous:
      condition: "max_score < 0.4"
      handler: "clarification"

  handlers:
    single_skill:
      description: "Route to single best skill"
      action: "return top_1"

    multi_skill_ensemble:
      description: "Combine multiple skills"
      action: "return top_k weighted ensemble"

    code_focused:
      description: "Prioritize language-specific skills"
      action: "filter to code skills, return top_3"

    clarification:
      description: "Ask user for clarification"
      action: "show options to user"

# =============================================================================
# CACHING
# =============================================================================

caching:
  enabled: true

  query_cache:
    max_size: 1000
    ttl: "1 hour"
    key: "query_hash"

  embedding_cache:
    max_size: 500
    ttl: "1 day"
    preload: true

  result_cache:
    max_size: 200
    ttl: "5 minutes"

# =============================================================================
# METRICS & LOGGING
# =============================================================================

metrics:
  track:
    - "query_latency_ms"
    - "strategy_scores"
    - "selected_skills"
    - "user_acceptance_rate"

  log_level: "info"

  export:
    format: "json"
    location: ".agent/memory/metrics/router/"

# =============================================================================
# A/B TESTING
# =============================================================================

ab_testing:
  enabled: false

  experiments:
    embedding_weight:
      variants:
        control: 0.40
        variant_a: 0.50
        variant_b: 0.60
      metric: "user_acceptance_rate"
