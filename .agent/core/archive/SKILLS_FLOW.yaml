# DOMYH Awesome Code — Skills & Flow Architecture v6.2.5
# Complete documentation of how IDE Agent uses skills

# =============================================================================
# 📊 SYSTEM OVERVIEW
# =============================================================================

overview:
  total_skills: 51
  total_workflows: 30
  flow_engine_flows: 6
  supported_ides: 7

architecture:
  # Three-layer architecture
  layers:
    - name: IDE Integration
      components: [CLAUDE.md, GEMINI.md, .cursorrules, AGENTS.md]

    - name: Core Engine
      components: [manifest.yaml, ROUTER.yaml, FLOW_ENGINE.yaml, RULES.md]

    - name: Skills & Workflows
      components: [skills/, workflows/, personas/]

# =============================================================================
# 🔄 USER REQUEST FLOW
# =============================================================================

request_flow:
  description: "How a user request is processed"

  steps:
    1_input:
      action: "User types command or question"
      examples:
        - "/code implement login API"
        - "Fix the authentication bug"
        - "Help me with Go error handling"

    2_routing:
      action: "ROUTER.yaml processes request"
      sub_steps:
        - "Preprocess: lowercase, remove stopwords"
        - "Calculate TF-IDF embeddings"
        - "Match against skill keywords (top-5)"
        - "Match against workflow triggers"
        - "Apply context signals (open files, git history)"
      output:
        workflow: "selected workflow or null"
        skills: "list of relevant skills (max 3)"

    3_skill_loading:
      action: "Load skills progressively"
      tiers:
        T1: "META.yaml always available (~100 tokens)"
        T2: "SKILL.md loaded on-demand (~1,500 tokens)"
        T3: "ADVANCED.md referenced only when needed (~4,000 tokens)"

    4_workflow_execution:
      action: "Execute selected workflow"
      phases: "Follows workflow-defined phases (3-6 phases)"
      skill_integration: "Skills provide language/tech-specific patterns"

    5_response:
      action: "Generate response following persona"
      personas: [developer, auditor, architect, debugger, designer]

# =============================================================================
# 📚 SKILL LOADING MECHANISM
# =============================================================================

skill_loading:
  # Detection methods
  detection:
    file_based:
      description: "Match file extensions in project"
      examples:
        "*.go, go.mod": "→ loads Go skill"
        "*.ts, *.tsx": "→ loads TypeScript skill"
        "Dockerfile": "→ loads Docker skill"

    keyword_based:
      description: "Match keywords in user query"
      examples:
        "goroutine, channel": "→ loads Go skill"
        "useState, useEffect": "→ loads React skill"
        "kubectl, pod": "→ loads Kubernetes skill"

    context_based:
      description: "Analyze project structure"
      signals:
        - open_files: 40%
        - git_history: 25%
        - error_context: 20%
        - project_structure: 15%

  # Progressive disclosure tiers
  tiers:
    T1_META:
      file: META.yaml
      size: "~100 tokens"
      when: "Always loaded for all skills"
      contains: [name, keywords, detect patterns, capabilities]

    T2_SKILL:
      file: SKILL.md
      size: "~1,500 tokens"
      when: "Skill is activated (detected as relevant)"
      contains: [patterns, examples, checklists]

    T3_ADVANCED:
      file: ADVANCED.md
      size: "~4,000 tokens"
      when: "User requests deep details"
      contains: [edge cases, advanced patterns, full references]

  # Loading constraints
  constraints:
    max_active_skills: 3
    unload_after_idle: "5 minutes"
    unload_on_workflow_switch: true

# =============================================================================
# 🔧 FLOW ENGINE ARCHITECTURE
# =============================================================================

flow_engine:
  description: "Chains workflows into intelligent sequences"

  # Pre-configured flows
  flows:
    new_project:
      trigger: ["create project", "new app"]
      steps: [init, code (P1), code (P2), test, deploy]

    fix_project:
      trigger: ["fix project", "sửa project"]
      steps: [modify.detect, modify.plan, modify.execute, debug, test, review]

    feature_development:
      trigger: ["add feature", "implement"]
      steps: [plan.understand, plan.design, code, test, review]

    bug_fix:
      trigger: ["fix bug", "debug"]
      steps: [debug.reproduce, debug.isolate, code.fix, test]

    code_review:
      trigger: ["review code", "pre-merge"]
      steps: [ap, test, review, approve]

    deployment:
      trigger: ["deploy", "release"]
      steps: [test.full, deploy.build, deploy.staging, deploy.prod, monitor]

  # Execution settings
  execution:
    mode: guided # guided | auto | manual
    checkpoint_enabled: true
    resume_on_failure: true
    max_retries: 3

# =============================================================================
# 🧠 SEMANTIC ROUTER DETAILS
# =============================================================================

router:
  strategy: semantic # semantic | pattern | hybrid
  fallback: pattern

  # Embedding config
  embedding:
    model: "local (TF-IDF)"
    dimensions: 384
    cache_enabled: true

  # Selection
  selection:
    top_k: 5
    min_score: 0.30
    boost_active: 0.15 # Boost recently used

  # Scoring weights
  weights:
    description: 0.50
    keywords: 0.25
    examples: 0.15
    detect_patterns: 0.10

  # Priority boost by category
  priority_boost:
    core: 0.20 # security
    language: 0.10 # go, python, etc.
    framework: 0.05 # react, vue
    devops: 0.00 # docker, k8s

# =============================================================================
# 📁 DIRECTORY STRUCTURE
# =============================================================================

structure:
  skills:
    format: |
      skills/
      ├── index.json         # Registry of all skills
      ├── README.md          # Documentation
      └── {skill-name}/      # Each skill folder
          ├── META.yaml      # T1: Always loaded
          ├── SKILL.md       # T2: On-demand
          └── ADVANCED.md    # T3: Referenced only

  core:
    format: |
      core/
      ├── ROUTER.yaml        # Semantic routing config
      ├── FLOW_ENGINE.yaml   # Workflow chaining
      ├── PATTERNS.yaml      # Shared patterns
      ├── TEMPLATES.yaml     # External templates
      ├── TOKEN_LOADING.yaml # Lazy loading config
      ├── RULES.md           # Universal rules
      └── STOP.md            # Stop conditions

# =============================================================================
# 📊 SKILL CATEGORIES
# =============================================================================

categories:
  core:
    priority: 0 # Always active
    skills: [security]
    behavior: "META always loaded, SKILL pre-cached"

  language:
    priority: 1
    skills:
      [
        go,
        python,
        typescript,
        javascript,
        rust,
        cpp,
        c,
        csharp,
        java,
        php,
        kotlin,
        swift,
        lua,
        asm,
      ]
    behavior: "Auto-detect from file extensions"

  framework:
    priority: 2
    skills: [react, vue, nextjs, flutter, angular, nuxt, svelte, tailwind]
    behavior: "Detected from package.json or imports"

  devops:
    priority: 3
    skills: [docker, kubernetes, aws, ci-cd]
    behavior: "Detected from config files"

  support:
    priority: 2
    skills:
      [database, testing, coding-rules, domyh-design, electron, react-native]
    behavior: "Cross-cutting, activated by context"

# =============================================================================
# 🔒 INTEGRATION WITH IDE CONFIGS
# =============================================================================

ide_integration:
  claude_code:
    config: CLAUDE.md
    loads: [manifest.yaml, RULES.md]
    skill_activation: "Via context window mentions"

  gemini_cli:
    config: GEMINI.md
    loads: [manifest.yaml, RULES.md]
    skill_activation: "Via prompt context"

  cursor:
    config: .cursorrules
    loads: [rules, skills metadata]
    skill_activation: "Via file context"

  windsurf:
    config: AGENTS.md
    loads: [full manifest]
    skill_activation: "Automatic from workspace"

