# DOMYH Awesome Code — Intent Detection System v6.3.9
# status: archived — Design spec, not runtime config
# Map user requests to appropriate libraries and patterns
# Token-optimized: Load only relevant language section

# =============================================================================
# 🎯 USER INTENT CATEGORIES
# =============================================================================

intents:
  # -------------------------------------------------------------------------
  # WEB DEVELOPMENT
  # -------------------------------------------------------------------------
  web_api:
    signals:
      - ["api", "endpoint", "rest", "graphql"]
      - ["backend", "server", "route"]
      - ["request", "response", "json"]
    questions:
      - "Bạn muốn API đơn giản hay full-featured?"
      - "Cần authentication không?"
      - "Dự kiến traffic cao không?"
    recommendations:
      go:
        simple: gin
        full: echo
        high_perf: fiber
      python:
        simple: flask
        full: django
        async: fastapi
      typescript:
        simple: express
        full: nestjs
        perf: fastify

  web_fullstack:
    signals:
      - ["website", "web app", "full-stack"]
      - ["ssr", "ssg", "static"]
      - ["admin", "dashboard", "cms"]
    questions:
      - "SPA hay SSR?"
      - "Cần SEO không?"
      - "Admin dashboard có không?"
    recommendations:
      typescript:
        react_ssr: nextjs
        vue_ssr: nuxt
        spa: react + vite
      python:
        admin: django
        api_first: fastapi
      php:
        full: laravel

  # -------------------------------------------------------------------------
  # DATABASE
  # -------------------------------------------------------------------------
  database_orm:
    signals:
      - ["database", "db", "sql", "postgres", "mysql"]
      - ["orm", "model", "entity", "migration"]
      - ["query", "crud"]
    questions:
      - "Postgres, MySQL, hay SQLite?"
      - "Cần type-safe queries không?"
      - "ORM full-featured hay lightweight?"
    recommendations:
      go:
        full_orm: gorm
        lightweight: sqlx
        type_safe: sqlc
      python:
        full: sqlalchemy
        async: asyncpg
      typescript:
        type_safe: prisma
        flexible: typeorm
      rust:
        compile_safe: sqlx
        full_orm: diesel
      java:
        standard: hibernate
        type_safe: jooq

  # -------------------------------------------------------------------------
  # AUTHENTICATION
  # -------------------------------------------------------------------------
  auth:
    signals:
      - ["login", "auth", "authentication"]
      - ["jwt", "session", "oauth"]
      - ["user", "password", "security"]
    questions:
      - "JWT hay session-based?"
      - "Cần OAuth/social login?"
      - "Self-hosted hay third-party?"
    recommendations:
      go:
        jwt: "golang-jwt/jwt"
        oauth: "oauth2"
      typescript:
        nextjs: "next-auth"
        standalone: "passport"
        saas: "clerk, auth0"
      python:
        jwt: "pyjwt"
        full: "python-social-auth"

  # -------------------------------------------------------------------------
  # MOBILE
  # -------------------------------------------------------------------------
  mobile_ios:
    signals:
      - ["ios", "iphone", "ipad", "apple"]
      - ["swiftui", "uikit"]
      - ["app store"]
    questions:
      - "Target iOS version?"
      - "SwiftUI hay UIKit?"
      - "Cần offline support?"
    recommendations:
      swift:
        ui: swiftui
        networking: alamofire
        image: kingfisher
        persistence: swiftdata
        analytics: firebase

  mobile_android:
    signals:
      - ["android", "google play", "kotlin"]
      - ["jetpack", "compose"]
    questions:
      - "Jetpack Compose hay XML layouts?"
      - "Target Android version?"
    recommendations:
      kotlin:
        ui: jetpack-compose
        networking: retrofit
        db: room
        di: dagger-hilt

  mobile_cross:
    signals:
      - ["cross-platform", "ios and android", "flutter"]
      - ["react native", "expo"]
    recommendations:
      dart: flutter
      typescript: "react-native, expo"

  # -------------------------------------------------------------------------
  # DATA & ML
  # -------------------------------------------------------------------------
  data_analysis:
    signals:
      - ["data analysis", "dataframe", "csv"]
      - ["pandas", "numpy"]
      - ["visualization", "chart"]
    recommendations:
      python:
        core: [pandas, numpy]
        fast: polars
        viz: [matplotlib, seaborn, plotly]

  machine_learning:
    signals:
      - ["ml", "machine learning", "model"]
      - ["train", "predict", "classification"]
    questions:
      - "Classical ML hay deep learning?"
      - "Training hay inference?"
    recommendations:
      python:
        classical: scikit-learn
        deep: [pytorch, tensorflow]
        nlp: transformers
        production: mlflow

  # -------------------------------------------------------------------------
  # CLI / TOOLS
  # -------------------------------------------------------------------------
  cli:
    signals:
      - ["cli", "command line", "terminal"]
      - ["tool", "script"]
    recommendations:
      go: cobra
      python: [click, typer]
      rust: clap
      typescript: commander

  # -------------------------------------------------------------------------
  # TESTING
  # -------------------------------------------------------------------------
  testing:
    signals:
      - ["test", "testing", "unit test"]
      - ["mock", "coverage"]
    recommendations:
      go: [testify, gomock]
      python: [pytest, unittest]
      typescript: [jest, vitest]
      rust: [built-in, mockall]
      java: [junit5, mockito]

# =============================================================================
# 🔍 LANGUAGE STYLE DETECTION
# =============================================================================

coding_styles:
  go:
    principles:
      - "Simplicity over abstraction"
      - "Explicit error handling (if err != nil)"
      - "Small interfaces"
      - "Composition over inheritance"
    patterns:
      - "Repository pattern"
      - "Dependency injection via constructor"
      - "Context for cancellation"

  python:
    principles:
      - "Readability counts"
      - "Duck typing"
      - "List comprehensions"
      - "Type hints (modern)"
    patterns:
      - "Context managers (with statement)"
      - "Decorators"
      - "async/await for I/O"

  typescript:
    principles:
      - "Type safety first"
      - "Interfaces over types (for public API)"
      - "Functional patterns"
      - "Immutability"
    patterns:
      - "React hooks"
      - "Server Components"
      - "Zod validation"

  rust:
    principles:
      - "Memory safety without GC"
      - "Ownership and borrowing"
      - "Result/Option for errors"
      - "Zero-cost abstractions"
    patterns:
      - "Builder pattern"
      - "Error propagation with ?"
      - "Derive macros"

  java:
    principles:
      - "OOP first"
      - "Interfaces for abstraction"
      - "Dependency injection"
      - "Records for data"
    patterns:
      - "Spring annotations"
      - "Stream API"
      - "Optional for nulls"

  swift:
    principles:
      - "Protocol-oriented"
      - "Value types preferred"
      - "Optional safety"
      - "Modern concurrency"
    patterns:
      - "Combine publishers"
      - "SwiftUI property wrappers"
      - "async/await"

# =============================================================================
# 🎯 INTENT DETECTION FLOW
# =============================================================================

detection_flow:
  steps:
    1_detect_language:
      method: "File patterns + explicit mention"
      fallback: "Ask user"

    2_detect_intent:
      method: "Match signals in user request"
      confidence: 0.7
      fallback: "Ask clarifying questions"

    3_detect_use_case:
      method: "Combine intent + language"
      output: "Recommended libraries"

    4_apply_style:
      method: "Load language coding_style"
      output: "Code following idioms"

  clarifying_questions:
    when: "confidence < 0.7 OR multiple intents"
    format: |
      Tôi hiểu bạn muốn [intent]. Một vài câu hỏi:
      1. [question_1]
      2. [question_2]

      Điều này giúp tôi chọn đúng library và pattern cho bạn.

# =============================================================================
# 🎨 PROJECT TYPE DETECTION
# =============================================================================

project_types:
  api:
    detect: ["routes/", "handlers/", "controllers/"]
    confirm: ["api", "endpoint", "rest"]

  web_app:
    detect: ["pages/", "components/", "app/"]
    confirm: ["react", "vue", "next"]

  mobile:
    detect: ["ios/", "android/", ".xcodeproj"]
    confirm: ["app", "mobile"]

  cli:
    detect: ["cmd/", "cli/"]
    confirm: ["command", "tool"]

  library:
    detect: ["lib/", "pkg/"]
    confirm: ["package", "module"]

  microservice:
    detect: ["docker-compose", "k8s/", "helm/"]
    confirm: ["service", "microservice"]

# =============================================================================
# 💡 SMART SUGGESTIONS
# =============================================================================

suggestions:
  on_new_project:
    format: |
      Dựa trên [language] và [project_type], tôi gợi ý:

      📦 **Framework**: {framework}
      🗄️ **Database**: {orm}
      🔐 **Auth**: {auth}
      ✅ **Testing**: {testing}
      📋 **Linting**: {linter}

      Bạn muốn tiến hành không?

  on_feature_request:
    format: |
      Để implement [feature], bạn có thể dùng:

      **Option 1**: {lib_1} — {pros_1}
      **Option 2**: {lib_2} — {pros_2}

      Tôi recommend **{recommended}** vì [reason].

  on_problem:
    format: |
      Vấn đề [problem] thường giải quyết bằng:

      1. **{solution_1}** — {when_to_use}
      2. **{solution_2}** — {when_to_use}

# =============================================================================
# 📊 TOKEN OPTIMIZATION
# =============================================================================

token_optimization:
  lazy_load: true
  load_only:
    - "Detected language section"
    - "Matched intent section"
  exclude:
    - "Unrelated languages"
    - "Unmatched intents"
  max_suggestions: 3
