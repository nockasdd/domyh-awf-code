# =============================================================================
# DOMYH Awesome Code
# Context Optimization Engine - Caching, Compaction, JIT Loading
# =============================================================================

version: "6.2.7"

# =============================================================================
# OVERVIEW
# Intelligent context management for token efficiency
# =============================================================================

description: |
  Context Optimization Engine manages the agent's context window through:
  1. Prompt Caching - Cache repeated prompts for cost savings
  2. Context Compaction - Compress history to fit more information
  3. JIT Loading - Load information only when needed
  4. Priority Ranking - Keep the most relevant information

# =============================================================================
# PROMPT CACHING
# Cache repeated prompts for efficiency
# =============================================================================

prompt_caching:
  enabled: true

  levels:
    # System prompt (permanent cache)
    system:
      cache: true
      ttl: "permanent"
      priority: 1
      description: "Core system prompt and instructions"

    # Skill definitions (session cache)
    skills:
      cache: true
      ttl: "session"
      priority: 2
      description: "Loaded skill definitions"
      max_cached: 10

    # Memory context (short-term cache)
    memory:
      cache: true
      ttl: "5 minutes"
      priority: 3
      description: "Memory state and context"

    # Tool results (ephemeral)
    tool_results:
      cache: true
      ttl: "current_turn"
      priority: 4
      description: "Results from tool executions"

  storage:
    type: "in-memory"
    max_size_mb: 50
    eviction: "LRU"

  statistics:
    track: true
    metrics:
      - "cache_hit_rate"
      - "tokens_saved"
      - "cost_savings"

# =============================================================================
# CONTEXT COMPACTION
# Compress context to maximize useful information
# =============================================================================

compaction:
  enabled: true

  strategies:
    # Conversation summarization
    conversation_summary:
      trigger: "message_count > 10"
      action: "summarize_old_messages"
      keep_recent: 3
      summary_max_tokens: 500

      template: |
        ## Conversation Summary
        - Messages: {message_count}
        - Key topics: {topics}
        - Decisions made: {decisions}
        - Current task: {current_task}

    # Tool result pruning
    tool_result_pruning:
      trigger: "after_tool_execution"
      actions:
        - "Remove verbose success messages"
        - "Keep only error details on failure"
        - "Truncate large outputs to relevant sections"
      max_result_tokens: 1000

    # Redundancy removal
    redundancy_removal:
      trigger: "before_each_request"
      actions:
        - "Deduplicate repeated information"
        - "Merge similar context blocks"
        - "Remove superseded data"

    # Importance-based filtering
    importance_ranking:
      trigger: "context_approaching_limit"
      method: "score_and_filter"
      keep_percentage: 0.7

      scoring:
        recency: 0.3
        relevance: 0.4
        user_reference: 0.2
        error_context: 0.1

  limits:
    max_context_tokens: 100000
    trigger_compaction_at: 0.8 # 80% of limit
    target_after_compaction: 0.5 # Aim for 50%

# =============================================================================
# JUST-IN-TIME (JIT) LOADING
# Load information only when needed
# =============================================================================

jit_loading:
  enabled: true

  # What to keep as lightweight pointers
  pointers:
    files:
      keep: "path only"
      load_on: "user_references OR need_content"
      max_preview: 50 # tokens for preview

    skills:
      keep: "name + 1-line description"
      load_on: "query_matches"
      tier_progression: "T1 → T2 → T3"

    memories:
      keep: "summary only"
      load_on: "relevance_score > 0.7"
      max_loaded: 5

    decisions:
      keep: "list of recent decisions"
      load_on: "user_asks_why"

  # Load triggers
  triggers:
    explicit:
      - pattern: "@file:{path}"
        action: "load_file"

      - pattern: "@skill:{name}"
        action: "load_skill"

      - pattern: "@memory:{query}"
        action: "search_memory"

    implicit:
      - context: "Discussing specific file"
        action: "load_file_content"

      - context: "Working with specific language"
        action: "load_language_skill"

      - context: "Debugging error"
        action: "load_related_errors"

  # Unload rules
  unloading:
    trigger: "context_limit_approaching"
    strategy: "LRU_with_importance"
    protected:
      - "system_prompt"
      - "current_task_context"
      - "active_file_content"

# =============================================================================
# CONTEXT WINDOW MANAGEMENT
# =============================================================================

context_management:
  # Token budgets by section
  budgets:
    system_prompt:
      max_tokens: 5000
      priority: 1

    core_memory:
      max_tokens: 2000
      priority: 2

    conversation_history:
      max_tokens: 10000
      priority: 3

    working_memory:
      max_tokens: 5000
      priority: 4

    skill_context:
      max_tokens: 3000
      priority: 5

    tool_results:
      max_tokens: 5000
      priority: 6

  # Dynamic allocation
  dynamic_allocation:
    enabled: true
    rebalance_on: "context_change"

    rules:
      - context: "code_generation"
        boost: ["skill_context", "working_memory"]
        reduce: ["conversation_history"]

      - context: "debugging"
        boost: ["tool_results", "working_memory"]
        reduce: ["skill_context"]

      - context: "conversation"
        boost: ["conversation_history"]
        reduce: ["skill_context", "tool_results"]

# =============================================================================
# MEMORY HIERARCHY INTEGRATION
# =============================================================================

memory_integration:
  # 5-tier memory loading
  tiers:
    working:
      load: "always"
      max_tokens: 500

    session:
      load: "always"
      max_tokens: 2000
      compaction: "summarize_old"

    core:
      load: "always"
      max_tokens: 500
      source: "core_memory/*.json"

    state:
      load: "on_demand"
      max_tokens: 500

    semantic:
      load: "on_query_match"
      retrieval: "top_k"
      k: 5

    graph:
      load: "on_relationship_query"
      max_hops: 3
      max_entities: 20

# =============================================================================
# ANALYTICS
# =============================================================================

analytics:
  enabled: true

  track:
    - "tokens_used_by_section"
    - "cache_hit_rate"
    - "compaction_frequency"
    - "jit_load_count"

  reports:
    frequency: "session_end"
    location: ".agent/memory/metrics/"
