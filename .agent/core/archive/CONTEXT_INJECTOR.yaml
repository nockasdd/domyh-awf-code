# DOMYH Awesome Code — Smart Context Injector v6.3.9
# status: archived — Design spec, not runtime config
# Intelligent context injection with relevance scoring

version: "6.3.9"
engine: smart_context_injector

# =============================================================================
# CORE CONCEPT
# =============================================================================

# "Intelligent and dynamic insertion of relevant information into the LLM's 
# context precisely when required" — Context Engineering 2025

concept:
  goal: "Right information, right time, right amount"
  method: "Relevance scoring before injection"
  benefit: "90%+ context relevance vs 70% baseline"

# =============================================================================
# RELEVANCE SCORING
# =============================================================================

scoring:
  enabled: true
  
  # Multi-factor scoring formula
  factors:
    recency:
      weight: 0.25
      description: "Newer content scores higher"
      calculation: |
        age_hours = now - content.timestamp
        score = max(0, 1 - (age_hours / 168))  # Decays over 1 week
      
    relevance:
      weight: 0.40
      description: "Semantic match to current task"
      calculation: |
        # Keyword matching (fast)
        keyword_score = overlap(content.keywords, task.keywords)
        # Semantic matching (if enabled)
        semantic_score = cosine_similarity(content.embedding, task.embedding)
        score = max(keyword_score, semantic_score)
      
    importance:
      weight: 0.25
      description: "Critical vs optional content"
      levels:
        critical: 1.0    # Errors, blockers
        high: 0.8        # Decisions, active tasks
        medium: 0.5      # Context, history
        low: 0.2         # Archives, old notes
      
    frequency:
      weight: 0.10
      description: "How often content is accessed"
      # Full calculation in SCORING_FORMULA.yaml

  # Scoring formula centralized - Single Source of Truth
  formula_reference: core/SCORING_FORMULA.yaml
  # formula: final_score = (recency * 0.25) + (relevance * 0.40) + 
  #                       (importance * 0.25) + (frequency * 0.10)

  # Thresholds reference
  thresholds_reference: core/SCORING_FORMULA.yaml
  thresholds:
    always_inject: 0.85    # Score > 0.85: always include
    inject_on_demand: 0.60  # 0.60-0.85: include if budget allows
    summarize: 0.40         # 0.40-0.60: include summary only
    skip: 0.40              # < 0.40: don't include

# =============================================================================
# INJECTION PRIORITY
# =============================================================================

priority:
  # Ordered from highest to lowest priority
  order:
    1:
      name: current_task_context
      description: "Active task information"
      max_tokens: 300
      always_inject: true
      
    2:
      name: active_errors
      description: "Unresolved errors and blockers"
      max_tokens: 200
      always_inject: true
      condition: has_active_errors
      
    3:
      name: recent_decisions
      description: "Last 5 architectural decisions"
      max_tokens: 300
      always_inject: false
      condition: relevance_score > 0.6
      
    4:
      name: similar_past_issues
      description: "Semantically similar past issues"
      max_tokens: 400
      always_inject: false
      condition: semantic_match_score > 0.7
      
    5:
      name: project_context
      description: "Project state and preferences"
      max_tokens: 150
      always_inject: false
      condition: new_session or context_switch
      
    6:
      name: audit_insights
      description: "Recent audit findings"
      max_tokens: 200
      always_inject: false
      condition: "audit" in task_keywords

# =============================================================================
# CONTEXT SOURCES
# =============================================================================

sources:
  # Memory layers
  memory:
    session:
      path: memory/session.md
      sections:
        - key_context  # Priority: high
        - active_errors  # Priority: critical
        - recent_workflows  # Priority: medium
        
    decisions:
      path: memory/decisions.md
      extract: last_10
      priority: high
      
    state:
      path: memory/state.json
      fields:
        - project.name
        - context.current_phase
        - context.pending_tasks
        - flags.has_critical_issues
      priority: high
      
    audits:
      path: memory/audit_summary.json
      fields:
        - latest_audit.score
        - top_recurring_issues
        - recommendations
      priority: medium

  # Semantic memory
  semantic:
    enabled: true
    path: memory/vectors/
    collections:
      - decisions
      - error_patterns
      - audits
    top_k: 3
    min_score: 0.7

# =============================================================================
# INJECTION TEMPLATES
# =============================================================================

templates:
  # How to format injected context
  
  task_context:
    format: |
      ## Current Context
      **Task**: {task_name}
      **Phase**: {phase}
      **Files**: {relevant_files}
    max_tokens: 150
    
  error_context:
    format: |
      ## ⚠️ Active Errors
      {error_list}
    max_tokens: 200
    
  decision_context:
    format: |
      ## Recent Decisions
      {decision_summaries}
    max_tokens: 250
    
  similar_issues:
    format: |
      ## Similar Past Issues
      {similar_items}
    max_tokens: 300
    
  audit_context:
    format: |
      ## Audit Insights (Score: {score}/10)
      **Top Issues**: {issues}
      **Recommendations**: {recommendations}
    max_tokens: 150

# =============================================================================
# INJECTION RULES
# =============================================================================

rules:
  # Budget management
  budget:
    total_max: 2000  # Max tokens for injected context
    per_source_max: 500
    reserve_for_task: 500  # Always leave room for task
    
  # Deduplication
  deduplication:
    enabled: true
    method: semantic_hash
    threshold: 0.95  # Skip if 95% similar
    
  # Freshness
  freshness:
    prefer_recent: true
    stale_threshold_hours: 24
    action_on_stale: summarize
    
  # Conflict resolution
  conflicts:
    on_budget_exceeded: prioritize_by_score
    on_duplicate: keep_higher_scored
    on_contradiction: flag_for_review

# =============================================================================
# WORKFLOW INTEGRATION
# =============================================================================

workflow_profiles:
  /code:
    inject:
      - current_task: always
      - errors: if_active
      - decisions: if_relevant
      - state: project_only
    total_budget: 800
    
  /debug:
    inject:
      - errors: always
      - similar_errors: always
      - decisions: if_relevant
    total_budget: 1000
    
  /ap:
    inject:
      - previous_audits: always
      - state: full
      - decisions: security_only
    total_budget: 800
    
  /recap:
    inject:
      - state: full
      - decisions: last_10
      - session: key_context
      - audits: summary
    total_budget: 1500
    
  /plan:
    inject:
      - state: full
      - decisions: architecture_only
      - constraints: all
    total_budget: 1000

# =============================================================================
# MONITORING
# =============================================================================

monitoring:
  metrics:
    - injection_count
    - average_relevance_score
    - tokens_injected
    - tokens_saved
    - cache_hit_rate
    
  logging:
    level: info
    include:
      - injection_decisions
      - score_details
      - budget_usage
      
  alerts:
    low_relevance:
      threshold: 0.5
      action: log_warning
    budget_exceeded:
      threshold: 2000
      action: force_summarize

# =============================================================================
# PERFORMANCE OPTIMIZATION
# =============================================================================

optimization:
  # Caching
  cache:
    scores: 60  # Cache scores for 60 seconds
    summaries: 300  # Cache summaries for 5 minutes
    embeddings: 3600  # Cache embeddings for 1 hour
    
  # Lazy evaluation
  lazy:
    semantic_search: true  # Only if score check passes
    full_load: true  # Only if preview suggests relevance
    
  # Batching
  batch:
    multiple_sources: true
    max_concurrent: 3
