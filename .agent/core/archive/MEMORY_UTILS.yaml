# DOMYH Awesome Code — Memory Utilities v6.4.3
# status: archived — Design spec, not runtime config
# Helper commands for memory management

# =============================================================================
# MEMORY COMMANDS
# =============================================================================

commands:
  # View current memory state
  memory_status:
    trigger: ["/memory", "/mem status"]
    description: "View current memory usage and state"
    action:
      - read: core/session_cache.json
      - calculate: tokens_estimate
      - display:
          format: table
          fields:
            - layer
            - tokens
            - status
            - last_updated

  # Force save all memory
  memory_save:
    trigger: ["/mem save", "/save memory"]
    description: "Force save all memory layers"
    action:
      - save: [session.md, state.json, decisions.md, audit_summary.json]
      - update: session_cache.json
      - notify: "Memory saved to all layers"

  # Clear session memory
  memory_clear:
    trigger: ["/mem clear", "/clear session"]
    description: "Clear current session memory (archive first)"
    action:
      - archive: session.md → archive/sessions/
      - reset: session.md
      - update: session_cache.json
      - notify: "Session memory cleared and archived"

  # View decision history
  memory_decisions:
    trigger: ["/mem decisions", "/decisions"]
    description: "View recent decisions"
    action:
      - read: memory/decisions.md
      - display: last 10 entries

  # View audit history
  memory_audits:
    trigger: ["/mem audits", "/audit history"]
    description: "View audit history summary"
    action:
      - read: memory/audit_summary.json
      - display: formatted summary

  # Compact memory
  memory_compact:
    trigger: ["/mem compact", "/compact"]
    description: "Trigger manual memory compaction"
    action:
      - trigger: summarization.medium
      - notify: "Memory compacted"

  # Export memory
  memory_export:
    trigger: ["/mem export"]
    description: "Export all memory to single file"
    action:
      - merge: [session.md, decisions.md, state.json]
      - export: memory/export_{timestamp}.md
      - notify: "Memory exported"

# =============================================================================
# MEMORY STATUS DISPLAY TEMPLATE
# =============================================================================

status_template: |
  ## 🧠 Memory Status

  | Layer | Status | Tokens | Last Updated |
  |-------|--------|--------|--------------|
  | Working | {working_status} | ~{working_tokens} | Always |
  | Session | {session_status} | ~{session_tokens} | {session_updated} |
  | State | {state_status} | ~{state_tokens} | {state_updated} |
  | Semantic | {semantic_status} | ~{semantic_tokens} | {semantic_updated} |

  **Total Estimate**: ~{total_tokens} tokens ({percentage}% of limit)

  ### Session Info
  - **Started**: {session_start}
  - **Interactions**: {interaction_count}
  - **Workflows Run**: {workflow_count}
  - **Decisions Made**: {decision_count}

  ### Cleanup Status
  - **Last Cleanup**: {last_cleanup}
  - **Next Trigger**: {next_trigger}
  - **Token Threshold**: {threshold_status}

# =============================================================================
# HANDOFF GENERATION
# =============================================================================

handoff:
  # Generate handoff document for session continuity
  template: |
    # Session Handoff

    **Date**: {date}
    **Session ID**: {session_id}
    **Project**: {project_path}

    ## Current Task
    {current_task}

    ## Context Summary
    {context_summary}

    ## Pending Actions
    {pending_actions}

    ## Key Decisions Made
    {recent_decisions}

    ## Files Changed
    {files_changed}

    ## Errors/Blockers
    {errors_blockers}

    ## Resume Instructions
    1. Run `/recap` to load context
    2. Review pending actions above
    3. Continue with: `{suggested_next_command}`

    ---
    _Generated by DOMYH Awesome Code Memory System_

  generate_on:
    - session_end
    - emergency_cleanup
    - agent_switch

  save_to: memory/handoff_{timestamp}.md

# =============================================================================
# MEMORY METRICS
# =============================================================================

metrics:
  # Track memory usage over time
  track:
    - tokens_by_layer
    - compression_ratio
    - cleanup_frequency
    - decision_count
    - audit_count
    - session_duration

  # Store metrics
  storage:
    file: memory/metrics.json
    max_entries: 100
    roll_after: 7 days

  # Calculate trends
  trends:
    - average_session_tokens
    - cleanup_trigger_rate
    - memory_efficiency_score

# =============================================================================
# INTEGRATION WITH WORKFLOWS
# =============================================================================

workflow_hooks:
  # Before any workflow starts
  pre_workflow:
    - load_relevant_memory
    - check_pending_from_state
    - restore_error_context

  # After any workflow completes
  post_workflow:
    - save_workflow_outcome
    - update_session_notes
    - check_cleanup_triggers

  # Workflow-specific hooks
  specific:
    /recap:
      pre: [load_all_memory_layers]
      post: [update_session_timestamp]

    /ap:
      pre: [load_previous_audit]
      post: [save_audit_summary, log_audit_decision]

    /code:
      pre: [load_recent_decisions]
      post: [save_code_decisions, update_files_changed]

    /debug:
      pre: [load_error_patterns]
      post: [archive_resolved_error, log_resolution]

    /deploy:
      pre: [load_deployment_state]
      post: [save_deployment_log, update_version]
