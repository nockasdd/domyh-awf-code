# =============================================================================
# SEMANTIC_ENGINE.yaml — HSA Semantic Memory Configuration
# =============================================================================
# DOMYH Awesome Code Agent — Vector-based Semantic Search
# version: 6.2.3
# =============================================================================

# Enable/Disable semantic memory
config:
  enabled: true # Enable semantic memory
  auto_save: true # Auto-save on workflow completion
  auto_cleanup: true # Auto-cleanup expired items

# =============================================================================
# LanceDB Configuration
# =============================================================================

database:
  path: ".agent/memory/vectors/domyh_memory.lance"
  max_size_mb: 500 # Maximum database size

# =============================================================================
# Embedding Configuration
# =============================================================================

embedding:
  # Provider: "openai" | "local" | "auto"
  # - openai: Uses OpenAI API (requires OPENAI_API_KEY)
  # - local: Uses sentence-transformers (offline, slower)
  # - auto: Tries openai first, falls back to local
  provider: "auto"

  # Model configurations
  openai:
    model: "text-embedding-3-small"
    dimension: 1536
    batch_size: 100

  local:
    model: "all-MiniLM-L6-v2" # Small, fast model
    # Alternatives:
    # - all-mpnet-base-v2 (better quality, slower)
    # - paraphrase-multilingual-MiniLM-L12-v2 (multilingual)
    dimension: 384

# =============================================================================
# Collection Configuration
# =============================================================================

collections:
  audits:
    description: "Full audit reports from /ap workflow"
    retention_days: 365
    min_keep: 10
    auto_index_on:
      - "/ap complete"
      - "audit saved"

  decisions:
    description: "Architectural decisions log"
    retention_days: 730 # 2 years
    min_keep: 50
    auto_index_on:
      - "decision made"
      - "architecture update"

  errors:
    description: "Error patterns and solutions"
    retention_days: 180 # 6 months
    min_keep: 20
    auto_index_on:
      - "error resolved"
      - "bug fixed"

  code_reviews:
    description: "Code review findings"
    retention_days: 365
    min_keep: 15
    auto_index_on:
      - "/review complete"
      - "PR reviewed"

# =============================================================================
# Search Configuration
# =============================================================================

search:
  default_k: 5 # Default number of results
  max_k: 20 # Maximum results allowed
  min_score: 0.3 # Minimum relevance score (0-1)

  # Token budget for search results
  token_budget:
    per_result: 500
    total: 2500

# =============================================================================
# Caching
# =============================================================================

cache:
  enabled: true
  ttl_seconds: 300 # 5 minutes
  max_entries: 100

# =============================================================================
# Fallback Behavior
# =============================================================================

fallback:
  # When semantic search unavailable
  strategy: "keyword" # "keyword" | "file_based" | "none"

  # Silent fallback (no user warning)
  silent: true

# =============================================================================
# Integration Triggers
# =============================================================================

triggers:
  # Commands that trigger memory operations
  save_triggers:
    - workflow: "/ap"
      collection: "audits"
      content: "audit_summary"

    - workflow: "/review"
      collection: "code_reviews"
      content: "review_findings"

    - workflow: "/debug"
      collection: "errors"
      content: "error_resolution"

  # Search triggers
  search_triggers:
    - command: "/search"
      collection: "all"

    - command: "/find-similar"
      collection: "all"

    - command: "/recall"
      collection: "decisions"

# =============================================================================
# Metrics
# =============================================================================

metrics:
  enabled: true
  track:
    - search_latency
    - hit_rate
    - index_size
    - embedding_time

# =============================================================================
# Footer
# =============================================================================
