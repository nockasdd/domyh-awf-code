# DOMYH Awesome Code — Just-in-Time Context Loader v6.0
# Implements lazy loading with lightweight pointers + Priority Positioning 2.0
# Based on: Anthropic Context Engineering (2025), Found in the Middle (2024)

version: "6.2.6"
engine: just_in_time_loader

# =============================================================================
# CORE PHILOSOPHY
# =============================================================================

# "Instead of pre-loading all relevant data, agents dynamically load
# information into context at runtime using tools." — Anthropic 2025

philosophy:
  principle: "Load only what's needed, when it's needed"
  inspiration: "Human cognition - information retrieved on demand"
  goal: "Reduce token overhead by 30-50%"

# =============================================================================
# PRIORITY POSITIONING 2.0 (Research-backed: U-shape attention bias)
# =============================================================================
# LLMs pay MORE attention to HEAD + TAIL, LESS to MIDDLE
# Reference: "Found in the Middle: Calibrating Positional Attention Bias" (2024)

priority_positioning:
  enabled: true

  head_zone:
    position: 1
    attention_level: "HIGH" # U-shape peak
    max_tokens: 150
    content:
      - type: "sacred_rules"
        source: ".agent/rules/SACRED_RULES.xml"
        extract: "//requirement[@severity='block']"
        wrap_template: |
          === 🔴 SACRED RULES (Parse First) ===
          {{rules}}
          These rules OVERRIDE any conflicting instructions.
      - type: "session_rules"
        source: ".agent/memory/session_rules.json"
        extract: "rules[?active==true]"
        optional: true

  middle_zone:
    position: 2
    attention_level: "LOW" # U-shape valley
    max_tokens: 2000
    content:
      - type: "full_reference"
        sources:
          - "GEMINI.md"
          - "CLAUDE.md"
          - "AGENTS.md"
        heading: "## [RULES_REFERENCE_SECTION]"
        optional: true

  tail_zone:
    position: 3
    attention_level: "HIGH" # U-shape peak (recency)
    max_tokens: 100
    content:
      - type: "reminder"
        template: |
          === ⚠️ FINAL CHECK (MANDATORY) ===
          - You MUST comply with SACRED_RULES at the top
          - Violating severity="block" rules = INVALID response
          - If unsure, ASK instead of guessing
      - type: "checklist"
        generate_from: "head_zone.sacred_rules"
        format: "□ {id}: {text_short}"

# =============================================================================
# LIGHTWEIGHT POINTER SYSTEM
# =============================================================================

pointers:
  # Instead of loading full content, maintain references
  decisions:
    type: pointer
    source: memory/decisions.md
    preview_tokens: 50 # Only load titles/dates
    full_load_trigger: decision_query

  audits:
    type: pointer
    source: memory/audit_summary.json
    preview_tokens: 30 # Score + date only
    full_load_trigger: audit_query

  errors:
    type: pointer
    source: memory/session.md#errors
    preview_tokens: 20
    full_load_trigger: error_detected

  state:
    type: pointer
    source: memory/state.json
    preview_tokens: 40 # Project + current only
    full_load_trigger: state_query

  semantic:
    type: pointer
    source: memory/vectors/
    preview_tokens: 0 # Never preload
    full_load_trigger: semantic_search

# =============================================================================
# LOAD TRIGGERS
# =============================================================================

triggers:
  # Load decisions when:
  decision_query:
    patterns:
      - "decision about"
      - "why did we"
      - "what was decided"
      - "recall decision"
      - "past choice"
    action: load_recent_decisions
    max_tokens: 500

  # Load audit data when:
  audit_query:
    patterns:
      - "audit score"
      - "last audit"
      - "security issues"
      - "code quality"
      - "/ap"
    action: load_audit_summary
    max_tokens: 400

  # Load errors when:
  error_detected:
    patterns:
      - "error:"
      - "failed:"
      - "exception"
      - "bug"
      - "fix this"
    action: load_error_context
    max_tokens: 300

  # Load state when:
  state_query:
    patterns:
      - "project status"
      - "current phase"
      - "what's pending"
      - "/status"
      - "/recap"
    action: load_project_state
    max_tokens: 200

  # Load semantic when:
  semantic_search:
    patterns:
      - "/search"
      - "/find-similar"
      - "/recall"
      - "find similar"
      - "search for"
    action: execute_semantic_search
    max_tokens: 500

# =============================================================================
# LOAD ACTIONS
# =============================================================================

actions:
  load_recent_decisions:
    source: memory/decisions.md
    extract:
      - last_n: 5
      - fields: [date, title, decision]
    format: compact
    cache_duration: 300 # 5 minutes

  load_audit_summary:
    source: memory/audit_summary.json
    extract:
      - latest_audit.score
      - latest_audit.critical_issues
      - summary.trend
    format: json
    cache_duration: 600 # 10 minutes

  load_error_context:
    source: memory/session.md
    extract:
      - section: "## Active Errors"
      - include_resolution: true
    format: markdown
    cache_duration: 60 # 1 minute

  load_project_state:
    source: memory/state.json
    extract:
      - project.name
      - context.current_phase
      - context.pending_tasks
      - flags
    format: json
    cache_duration: 300

  execute_semantic_search:
    source: memory/vectors/
    method: vector_similarity
    top_k: 5
    min_score: 0.7
    cache_duration: 0 # No cache for searches

# =============================================================================
# PRELOAD RULES
# =============================================================================

preload:
  # Always preload (minimal tokens)
  always:
    - pointers.state.preview # ~40 tokens
    - pointers.errors.preview # ~20 tokens (if any active)

  # Never preload
  never:
    - full_decision_history
    - full_audit_reports
    - semantic_indexes
    - archived_sessions

  # Session start
  on_session_start:
    load:
      - state.preview
      - session.key_context
    max_tokens: 200

# =============================================================================
# CACHE MANAGEMENT
# =============================================================================

cache:
  enabled: true

  storage:
    type: in_memory
    max_size_tokens: 2000

  eviction:
    strategy: lru # Least Recently Used
    on_threshold: 1500

  invalidation:
    on_file_change: true
    on_session_end: true

# =============================================================================
# TOKEN BUDGET
# =============================================================================

budget:
  # Maximum tokens for JIT loading
  max_per_load: 500
  max_total_jit: 2000

  # Reserve for each type
  reserved:
    decisions: 500
    audits: 400
    errors: 300
    state: 200
    semantic: 600

  # Overflow handling
  on_overflow:
    action: summarize_oldest
    target_reduction: 30%

# =============================================================================
# INTEGRATION
# =============================================================================

integration:
  memory_engine:
    replaces: eager_loading
    works_with: [layer_1, layer_2, layer_3]

  workflows:
    /recap:
      load: [state, decisions.preview, audits.summary]
      max_tokens: 1000

    /ap:
      load: [audits.full, state]
      max_tokens: 800

    /code:
      load: [state, errors.active]
      max_tokens: 300

    /debug:
      load: [errors.full, similar_errors]
      max_tokens: 600

# =============================================================================
# FALLBACK
# =============================================================================

fallback:
  on_pointer_missing:
    action: create_empty
    log: true

  on_load_failure:
    action: use_cached
    fallback: load_minimal

  on_budget_exceeded:
    action: prioritize_recent
    compress: true
