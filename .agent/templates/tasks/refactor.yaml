## Workflow Integration

This task type triggers:
- **Persona:** Developer (with Architect consultation for pattern validation)
- **Workflow:** 
  1. Architect validates pattern choice
  2. Developer implements incrementally
  3. Tester verifies no regressions
- **Reflection:** Pre-output critic check for pattern adherence

---

## Common Refactoring Patterns

### Extract Class
Split large class into focused classes.

### Extract Method
Break up long methods.

### Move to Layer
Move code to appropriate architecture layer.

### Replace Conditional with Polymorphism
Use inheritance instead of if/switch.

### Introduce Design Pattern
Apply Factory, Strategy, Repository, etc.

---

## Safety Checklist

Before refactoring:
- [ ] Tests exist and pass
- [ ] Understand current behavior
- [ ] Identify all callers

During refactoring:
- [ ] Small incremental changes
- [ ] Run tests after each change
- [ ] Keep behavior identical

After refactoring:
- [ ] All tests still pass
- [ ] Coverage maintained
- [ ] No new warnings

