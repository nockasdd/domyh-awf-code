# Refactor Task Template

> Structured template for refactoring tasks

---

## Schema

```yaml
task_type: refactor
version: "6.2.5"

# Required fields
target: string            # What to refactor
pattern: string           # Refactoring pattern/goal

# Optional fields
constraints: list         # What must be preserved
scope: string             # Scope of refactoring
test_requirements: list   # Testing requirements
breaking_changes: boolean # Are breaking changes allowed
```

---

## Example Task

```yaml
task:
  type: refactor
  
  target: |
    User authentication module in `src/auth/`.
    Currently a 500-line monolithic service.
  
  pattern: |
    Extract into Clean Architecture layers:
    - Domain: User entity, AuthToken value object
    - Application: AuthService, TokenService
    - Infrastructure: BCryptHasher, JWTProvider
  
  constraints:
    - All existing tests must pass
    - Public API must remain unchanged
    - Password hashing algorithm unchanged
    - No data migration required
  
  scope: |
    Files to refactor:
    - src/auth/auth.service.ts → Split into multiple
    - src/auth/user.model.ts → Move to domain
    
    Files to create:
    - src/domain/user/user.entity.ts
    - src/domain/auth/auth-token.ts
    - src/application/services/auth.service.ts
    - src/infrastructure/hashers/bcrypt.hasher.ts
  
  test_requirements:
    - Existing integration tests must pass
    - Add unit tests for new services
    - Maintain 85%+ coverage
  
  breaking_changes: false
  
  priority: P2
  
  motivation:
    - Current code is hard to test
    - Business logic mixed with infrastructure
    - Difficult to swap JWT provider
```

