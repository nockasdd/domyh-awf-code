# =============================================================================
# Workflow Chains (Multi-Step Prompts)
# =============================================================================
# Extracted from templates/index.yaml for token efficiency
# version: 6.4.10
# =============================================================================

chains:
  /review:
    name: Code Review Chain
    description: Systematic 4-step code review process
    steps:
      - order: 1
        id: review-1
        name: Understand Context
        file: chains/review/step1-understand.md
        description: Understand code and requirements

      - order: 2
        id: review-2
        name: Analyze Issues
        file: chains/review/step2-analyze.md
        depends_on: review-1
        description: Find bugs, security issues, code smells

      - order: 3
        id: review-3
        name: Suggest Fixes
        file: chains/review/step3-fix.md
        depends_on: review-2
        description: Propose solutions

      - order: 4
        id: review-4
        name: Summarize
        file: chains/review/step4-summary.md
        depends_on: review-3
        description: Final report

  /debug:
    name: Debug Chain
    description: Systematic 5-step debugging process
    steps:
      - order: 1
        id: debug-1
        name: Reproduce
        file: chains/debug/step1-reproduce.md
        description: Reproduce the issue

      - order: 2
        id: debug-2
        name: Isolate
        file: chains/debug/step2-isolate.md
        depends_on: debug-1
        description: Isolate the root cause

      - order: 3
        id: debug-3
        name: Analyze
        file: chains/debug/step3-analyze.md
        depends_on: debug-2
        description: Deep analysis

      - order: 4
        id: debug-4
        name: Fix
        file: chains/debug/step4-fix.md
        depends_on: debug-3
        description: Implement fix

      - order: 5
        id: debug-5
        name: Verify
        file: chains/debug/step5-verify.md
        depends_on: debug-4
        description: Verify the fix

  /implement:
    name: Implementation Chain
    description: Systematic 4-step feature implementation
    steps:
      - order: 1
        id: impl-1
        name: Plan
        file: chains/implement/step1-plan.md
        description: Create implementation plan

      - order: 2
        id: impl-2
        name: Code
        file: chains/implement/step2-code.md
        depends_on: impl-1
        description: Write the code

      - order: 3
        id: impl-3
        name: Test
        file: chains/implement/step3-test.md
        depends_on: impl-2
        description: Write and run tests

      - order: 4
        id: impl-4
        name: Document
        file: chains/implement/step4-doc.md
        depends_on: impl-3
        description: Add documentation

  /feature:
    name: Feature Lifecycle Chain
    description: Spec-driven 5-step feature development with phase gates
    steps:
      - order: 1
        id: feat-1
        name: Requirements
        file: chains/feature/step1-requirements.md
        description: Define problem, user stories, acceptance criteria

      - order: 2
        id: feat-2
        name: Design
        file: chains/feature/step2-design.md
        depends_on: feat-1
        description: Architecture decisions, data models, API design

      - order: 3
        id: feat-3
        name: Planning
        file: chains/feature/step3-planning.md
        depends_on: feat-2
        description: Task breakdown with traceability

      - order: 4
        id: feat-4
        name: Implementation
        file: chains/feature/step4-implementation.md
        depends_on: feat-3
        description: Execute tasks per plan with decision logging

      - order: 5
        id: feat-5
        name: Testing & Ship
        file: chains/feature/step5-testing.md
        depends_on: feat-4
        description: Verify all ACs met, coverage check, ship

  /ap:
    name: Audit Pro Chain
    description: "10-step audit with SCoT reasoning, cross-expert critique, holistic synthesis"
    steps:
      - order: 1
        id: audit-1
        name: Discovery
        file: chains/audit/step1-discover.md
        description: Detect stack, project type, auto-activate experts

      - order: 2
        id: audit-2
        name: Scope Contract
        file: chains/audit/step2-scope.md
        depends_on: audit-1
        description: Display options (1-10), STOP for user

      - order: 3
        id: audit-3
        name: Execute (SCoT)
        file: chains/audit/step3-execute.md
        depends_on: audit-2
        description: SCoT 7-step per checkpoint, chunked execution

      - order: 4
        id: audit-4
        name: Critique Round
        file: chains/audit/step4-critique.md
        depends_on: audit-3
        description: Cross-expert challenge on P0/P1

      - order: 5
        id: audit-5
        name: Holistic Synthesis
        file: chains/audit/step5-holistic.md
        depends_on: audit-4
        description: 5 project-level questions beyond checklists

      - order: 6
        id: audit-6
        name: Debate Round
        file: chains/audit/step6-debate.md
        depends_on: audit-5
        description: Expert panel discussion IF systemic issues found

      - order: 7
        id: audit-7
        name: Report
        file: chains/audit/step7-report.md
        depends_on: audit-6
        description: Score, findings, holistic assessment, save

