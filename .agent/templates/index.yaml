templates:
  # ==========================================================================
  # Audit Templates
  # ==========================================================================
  - id: audit-report
    file: audit-report.md
    name: Audit Report
    description: Full audit report with scores and findings
    keywords: [audit, report, score, findings, analysis, review, assess]
    workflows: ["/ap", "/audit"]
    category: audit
    priority: 100

  - id: findings
    file: findings.md
    name: Findings Report
    description: Detailed findings with recommendations
    keywords: [findings, issues, recommendations, problems, solutions]
    workflows: ["/ap", "/review"]
    category: audit
    priority: 90

  # ==========================================================================
  # Debug Templates
  # ==========================================================================
  - id: debug-report
    file: debug-report.md
    name: Debug Report
    description: Bug investigation and resolution report
    keywords: [debug, error, fix, bug, issue, root cause, trace]
    workflows: ["/debug"]
    category: debug
    priority: 100

  # ==========================================================================
  # DevOps Templates
  # ==========================================================================
  - id: deploy-plan
    file: deploy-plan.md
    name: Deployment Plan
    description: Deployment checklist and rollback plan
    keywords: [deploy, release, production, rollback, staging, CI/CD]
    workflows: ["/deploy"]
    category: devops
    priority: 100

  - id: migrate-plan
    file: migrate-plan.md
    name: Migration Plan
    description: Database or system migration plan
    keywords: [migrate, migration, database, schema, upgrade, version]
    workflows: ["/migrate"]
    category: devops
    priority: 95

  # ==========================================================================
  # Planning Templates
  # ==========================================================================
  - id: project-plan
    file: project-plan.md
    name: Project Plan
    description: Full project planning template
    keywords: [project, plan, roadmap, timeline, scope, estimate]
    workflows: ["/plan", "/init"]
    category: planning
    priority: 100

  - id: phase-template
    file: phase-template.md
    name: Phase Template
    description: Multi-phase project tracking
    keywords: [phase, milestone, progress, stage, sprint]
    workflows: ["/plan", "/init"]
    category: planning
    priority: 90

  - id: task-list
    file: task-list.md
    name: Task List
    description: Structured task breakdown
    keywords: [task, todo, checklist, breakdown, work, item]
    workflows: ["/plan"]
    category: planning
    priority: 85

  # ==========================================================================
  # Documentation Templates
  # ==========================================================================
  - id: doc-template
    file: doc-template.md
    name: Documentation
    description: General documentation template
    keywords: [doc, document, readme, guide, tutorial, manual]
    workflows: ["/doc"]
    category: docs
    priority: 100

  # ==========================================================================
  # Testing Templates
  # ==========================================================================
  - id: test-report
    file: test-report.md
    name: Test Report
    description: Test results and coverage report
    keywords: [test, testing, coverage, unit, integration, e2e]
    workflows: ["/test"]
    category: testing
    priority: 100

  # ==========================================================================
  # Reflection Templates
  # ==========================================================================
  - id: reflection-critic
    file: reflection/critic.md
    name: Self-Critique
    description: Pre-delivery self-evaluation using Reflexion Pattern
    keywords: [reflection, critique, review, quality, self-check]
    workflows: ["/code", "/debug", "/fix", "/refactor", "/review"]
    category: reflection
    priority: 80

  - id: reflection-error-analysis
    file: reflection/error_analysis.md
    name: Error Analysis
    description: 5-Whys root cause analysis and pattern storage
    keywords: [error, analysis, root cause, 5-whys, debugging, failure]
    workflows: ["/debug", "/fix"]
    category: reflection
    priority: 75

  - id: reflection-success-analysis
    file: reflection/success_analysis.md
    name: Success Analysis
    description: Positive pattern reinforcement and knowledge capture
    keywords: [success, pattern, reinforcement, learning, improvement]
    workflows: ["/code", "/debug", "/refactor"]
    category: reflection
    priority: 70

  # ==========================================================================
  # Feature Lifecycle Templates
  # ==========================================================================
  - id: feature-lifecycle
    file: feature-lifecycle.md
    name: Feature Lifecycle
    description: Full feature lifecycle template with phase tracking and traceability
    keywords:
      [feature, lifecycle, requirements, design, plan, implement, sdlc, spec]
    workflows: ["/feature"]
    category: planning
    priority: 100

# =============================================================================
# Workflow Chains → Extracted to chains/index.yaml
# =============================================================================
# See: templates/chains/index.yaml

# =============================================================================
# Search Configuration
# =============================================================================

search:
  engine: "hsa" # HSA v1.0.0 HybridSearch
  algorithm: "hybrid" # 70% vector + 30% BM25
  fusion_strategy: "weighted_sum" # weighted_sum | rrf | max_score
  vector_weight: 0.7
  bm25_weight: 0.3
  min_score: 0.3
  fallback: "bm25" # Fallback if HSA unavailable

# =============================================================================
