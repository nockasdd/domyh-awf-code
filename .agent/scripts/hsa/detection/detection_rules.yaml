# =============================================================================
# detection_rules.yaml — Stack Detection Rules for HSA v5.0
# =============================================================================
# Scoring-based detection patterns for 50+ languages/frameworks
# Weights: file_pattern (10), dependency (8), extension_frequency (5)
# =============================================================================

version: "1.0.0"

# =============================================================================
# DETECTION WEIGHTS (from HSA_V4.yaml)
# =============================================================================

weights:
  file_pattern: 10 # Definitive files (.sln, Cargo.toml, etc.)
  dependency: 8 # Dependencies in manifest
  extension_frequency: 5 # File extension counts (log scale)

threshold: 0.3 # Minimum score ratio to include skill
max_skills: 5 # Maximum skills to load

# =============================================================================
# BUILD SYSTEM PATTERNS (Phase 1 Root Discovery)
# =============================================================================

build_systems:
  visual_studio:
    patterns: ["*.sln", "*.slnx", "*.csproj", "*.vcxproj", "*.vbproj"]
    weight: 10
    skills: ["csharp", "cpp"]

  cmake:
    patterns: ["CMakeLists.txt", "CMakePresets.json"]
    weight: 10
    skills: ["cpp", "c"]

  npm:
    patterns: ["package.json"]
    weight: 10
    skills:
      ["javascript", "typescript", "react", "vue", "angular", "nextjs", "nuxt"]

  gradle:
    patterns: ["build.gradle", "build.gradle.kts", "settings.gradle"]
    weight: 10
    skills: ["java", "kotlin"]

  maven:
    patterns: ["pom.xml"]
    weight: 10
    skills: ["java"]

  cargo:
    patterns: ["Cargo.toml"]
    weight: 10
    skills: ["rust"]

  go_mod:
    patterns: ["go.mod", "go.sum"]
    weight: 10
    skills: ["go"]

  python:
    patterns: ["pyproject.toml", "setup.py", "requirements.txt", "Pipfile"]
    weight: 10
    skills: ["python"]

  php:
    patterns: ["composer.json"]
    weight: 10
    skills: ["php"]

  ruby:
    patterns: ["Gemfile", "*.gemspec"]
    weight: 10
    skills: ["ruby"]

  swift:
    patterns: ["Package.swift", "*.xcodeproj", "*.xcworkspace"]
    weight: 10
    skills: ["swift"]

  elixir:
    patterns: ["mix.exs"]
    weight: 10
    skills: ["elixir"]

  deno:
    patterns: ["deno.json", "deno.jsonc"]
    weight: 10
    skills: ["deno", "typescript"]

  bun:
    patterns: ["bun.lockb", "bunfig.toml"]
    weight: 10
    skills: ["bun", "typescript", "javascript"]

# =============================================================================
# DEPENDENCY PATTERNS (Phase 3 - from package manifests)
# =============================================================================

dependencies:
  # JavaScript/TypeScript Frameworks
  react:
    patterns: ["react", "react-dom", "next", "gatsby"]
    weight: 8
    skills: ["react"]

  vue:
    patterns: ["vue", "nuxt", "@vue/"]
    weight: 8
    skills: ["vue"]

  angular:
    patterns: ["@angular/core", "@angular/cli"]
    weight: 8
    skills: ["angular"]

  svelte:
    patterns: ["svelte", "@sveltejs/"]
    weight: 8
    skills: ["svelte"]

  nextjs:
    patterns: ["next"]
    weight: 8
    skills: ["nextjs", "react"]

  nuxt:
    patterns: ["nuxt", "@nuxt/"]
    weight: 8
    skills: ["nuxt", "vue"]

  electron:
    patterns: ["electron"]
    weight: 8
    skills: ["electron"]

  tailwind:
    patterns: ["tailwindcss", "@tailwindcss/"]
    weight: 8
    skills: ["tailwind"]

  # Testing Frameworks
  jest:
    patterns: ["jest", "@jest/"]
    weight: 5
    skills: ["testing"]

  vitest:
    patterns: ["vitest"]
    weight: 5
    skills: ["testing"]

  pytest:
    patterns: ["pytest"]
    weight: 5
    skills: ["testing", "python"]

  # Infrastructure
  docker:
    patterns: ["docker", "dockerode"]
    weight: 6
    skills: ["docker"]

  kubernetes:
    patterns: ["kubernetes-client", "@kubernetes/"]
    weight: 6
    skills: ["kubernetes"]

  aws:
    patterns: ["aws-sdk", "@aws-sdk/", "boto3"]
    weight: 6
    skills: ["aws"]

  # Database
  database:
    patterns:
      ["prisma", "sequelize", "typeorm", "mongoose", "pg", "mysql2", "sqlite3"]
    weight: 5
    skills: ["database", "sql"]

# =============================================================================
# FILE EXTENSION PATTERNS (Phase 4 - frequency based)
# =============================================================================

extensions:
  # Systems Programming
  c:
    patterns: [".c", ".h"]
    weight: 5
    skills: ["c"]

  cpp:
    patterns: [".cpp", ".cc", ".cxx", ".hpp", ".hxx", ".h"]
    weight: 5
    skills: ["cpp"]

  rust:
    patterns: [".rs"]
    weight: 5
    skills: ["rust"]

  go:
    patterns: [".go"]
    weight: 5
    skills: ["go"]

  zig:
    patterns: [".zig"]
    weight: 5
    skills: ["zig"]

  nim:
    patterns: [".nim", ".nims"]
    weight: 5
    skills: ["nim"]

  # JVM Languages
  java:
    patterns: [".java"]
    weight: 5
    skills: ["java"]

  kotlin:
    patterns: [".kt", ".kts"]
    weight: 5
    skills: ["kotlin"]

  scala:
    patterns: [".scala", ".sc"]
    weight: 5
    skills: ["scala"]

  clojure:
    patterns: [".clj", ".cljs", ".cljc", ".edn"]
    weight: 5
    skills: ["clojure"]

  # .NET Languages
  csharp:
    patterns: [".cs"]
    weight: 5
    skills: ["csharp"]

  fsharp:
    patterns: [".fs", ".fsx"]
    weight: 5
    skills: ["fsharp"]

  # Scripting Languages
  python:
    patterns: [".py", ".pyi"]
    weight: 5
    skills: ["python"]

  ruby:
    patterns: [".rb", ".rake"]
    weight: 5
    skills: ["ruby"]

  php:
    patterns: [".php"]
    weight: 5
    skills: ["php"]

  perl:
    patterns: [".pl", ".pm"]
    weight: 5
    skills: ["perl"]

  lua:
    patterns: [".lua"]
    weight: 5
    skills: ["lua"]

  # JavaScript/TypeScript
  javascript:
    patterns: [".js", ".mjs", ".cjs"]
    weight: 5
    skills: ["javascript"]

  typescript:
    patterns: [".ts", ".mts", ".cts"]
    weight: 5
    skills: ["typescript"]

  jsx:
    patterns: [".jsx"]
    weight: 5
    skills: ["react", "javascript"]

  tsx:
    patterns: [".tsx"]
    weight: 5
    skills: ["react", "typescript"]

  vue:
    patterns: [".vue"]
    weight: 5
    skills: ["vue"]

  svelte:
    patterns: [".svelte"]
    weight: 5
    skills: ["svelte"]

  # Mobile
  swift:
    patterns: [".swift"]
    weight: 5
    skills: ["swift"]

  dart:
    patterns: [".dart"]
    weight: 5
    skills: ["flutter"]

  # Functional Languages
  elixir:
    patterns: [".ex", ".exs"]
    weight: 5
    skills: ["elixir"]

  haskell:
    patterns: [".hs", ".lhs"]
    weight: 5
    skills: ["haskell"]

  ocaml:
    patterns: [".ml", ".mli"]
    weight: 5
    skills: ["ocaml"]

  # Data/ML
  r:
    patterns: [".r", ".R"]
    weight: 5
    skills: ["r"]

  julia:
    patterns: [".jl"]
    weight: 5
    skills: ["julia"]

  # Blockchain
  solidity:
    patterns: [".sol"]
    weight: 5
    skills: ["solidity"]

  # Assembly
  asm:
    patterns: [".asm", ".s", ".S"]
    weight: 5
    skills: ["asm"]

  # Infrastructure
  sql:
    patterns: [".sql"]
    weight: 5
    skills: ["sql", "database"]

  dockerfile:
    patterns: ["Dockerfile", "*.dockerfile"]
    weight: 5
    skills: ["docker"]

  yaml:
    patterns: [".yaml", ".yml"]
    weight: 3
    skills: [] # Too generic

  shell:
    patterns: [".sh", ".bash", ".zsh"]
    weight: 4
    skills: [] # Common in many projects

# =============================================================================
# SPECIAL FILE PATTERNS (High confidence indicators)
# =============================================================================

special_files:
  react_native:
    patterns: ["metro.config.js", "app.json"]
    check_dependency: "react-native"
    weight: 10
    skills: ["react-native"]

  flutter:
    patterns: ["pubspec.yaml"]
    weight: 10
    skills: ["flutter"]

  nextjs:
    patterns: ["next.config.js", "next.config.mjs", "next.config.ts"]
    weight: 10
    skills: ["nextjs"]

  nuxt:
    patterns: ["nuxt.config.ts", "nuxt.config.js"]
    weight: 10
    skills: ["nuxt"]

  tailwind:
    patterns: ["tailwind.config.js", "tailwind.config.ts"]
    weight: 8
    skills: ["tailwind"]

  electron:
    patterns: ["electron.js", "main.js", "preload.js"]
    check_dependency: "electron"
    weight: 8
    skills: ["electron"]

  docker:
    patterns: ["docker-compose.yml", "docker-compose.yaml", ".dockerignore"]
    weight: 8
    skills: ["docker"]

  kubernetes:
    patterns: ["k8s/", "kubernetes/", "helm/"]
    weight: 8
    skills: ["kubernetes"]

  ci_cd:
    patterns: [".github/workflows/", ".gitlab-ci.yml", "Jenkinsfile"]
    weight: 6
    skills: ["ci-cd"]

# =============================================================================
# MONOREPO DETECTION
# =============================================================================

monorepo:
  indicators:
    npm_workspaces:
      check: "package.json contains workspaces"
      weight: 10

    lerna:
      patterns: ["lerna.json"]
      weight: 10

    nx:
      patterns: ["nx.json"]
      weight: 10

    turborepo:
      patterns: ["turbo.json"]
      weight: 10

    pnpm_workspace:
      patterns: ["pnpm-workspace.yaml"]
      weight: 10

    vs_solution:
      check: ".sln has multiple <Project> entries"
      weight: 10

# =============================================================================
# SKILL PRIORITY (when multiple match)
# =============================================================================

skill_priority:
  # Framework > Language
  nextjs: 100
  nuxt: 100
  react: 90
  vue: 90
  angular: 90
  svelte: 90
  flutter: 90
  react-native: 90
  electron: 85

  # Languages
  typescript: 80
  rust: 80
  go: 80
  kotlin: 80
  swift: 80

  # Common
  javascript: 70
  python: 70
  java: 70
  csharp: 70
  cpp: 70

  # Infra
  docker: 60
  kubernetes: 60
  aws: 60
  database: 50
  sql: 50

  # Testing (lowest priority, additive)
  testing: 30
  tailwind: 40

# =============================================================================
# _DOMYH Awesome Code v6.1.2 • HSA v5.0 • Detection Rules_
# =============================================================================
