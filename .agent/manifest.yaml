# DOMYH Agent v4.3 — Optimized Manifest
# Token-efficient architecture with Progressive Disclosure
# Developer: NockDev

version: "4.3.0"
name: "DOMYH Agent"
developer: "NockDev"

# =============================================================================
# LANGUAGE & DEFAULTS
# =============================================================================

lang: en # Default: en | vi

defaults:
  evidence_required: true
  evidence_format: "file:line"
  auto_fix: false
  confirm_destructive: true
  quality_frameworks: ["ISO 25010", "CWE Top 25", "OWASP Top 10"]

# =============================================================================
# CORE FILES (Always loaded - MINIMAL tokens)
# =============================================================================

core:
  # Rules System (v4.2 - refactored to modular files)
  rules_dir: rules/ # 15 specialized rule files
  rules_index: rules/README.md # Rules registry
  # Core engines
  router: core/ROUTER.yaml # Semantic routing config
  flow_engine: core/FLOW_ENGINE.yaml # v4.1: Workflow chaining
  memory_engine: core/MEMORY_ENGINE.yaml # v4.2: 4-layer memory
  semantic_engine: core/SEMANTIC_ENGINE.yaml # v4.2: Optional vector DB
  token_loading: core/TOKEN_LOADING.yaml # Token optimization
  # SSoT Files (v4.3 additions)
  token_budgets: core/TOKEN_BUDGETS.yaml # Unified token thresholds
  memory_paths: core/MEMORY_PATHS.yaml # Memory file locations
  scoring_formula: core/SCORING_FORMULA.yaml # Priority scoring algorithm
  context_priority: core/CONTEXT_PRIORITY.yaml # Context injection scoring
  memory_consolidation: core/MEMORY_CONSOLIDATION.yaml # Memory merge strategies
  patterns: core/PATTERNS.yaml # Shared workflow patterns

# =============================================================================
# PROGRESSIVE DISCLOSURE SKILLS
# Tier 1: META.yaml (~100 tokens) - Always loaded
# Tier 2: SKILL.md (~2000 tokens) - On-demand
# Tier 3: ADVANCED.md (~5000 tokens) - Referenced only
# =============================================================================

skills:
  # Baseline: Only META.yaml loaded = 22 skills × 100 tokens = 2,200 tokens
  # Activated: +2,000 tokens per skill
  # Max active: 3 skills = 2,200 + 6,000 = 8,200 tokens

  loading:
    strategy: progressive # progressive | eager | lazy
    max_active: 3 # Max skills in context at once
    cache_ttl: 3600 # 1 hour cache

  # Categories with priority (lower = higher priority)
  categories:
    core:
      priority: 0
      always_metadata: true # Always load META.yaml
      skills: [security] # Security always active (metadata)

    language:
      priority: 1
      skills:
        [
          go,
          python,
          typescript,
          rust,
          cpp,
          csharp,
          java,
          php,
          kotlin,
          swift,
          lua,
        ]

    framework:
      priority: 2
      skills: [react, vue, nextjs]

    devops:
      priority: 3
      skills: [docker, kubernetes, aws, ci-cd]

    support:
      priority: 2
      skills: [database, testing]

# =============================================================================
# SEMANTIC TOOL SELECTION
# Uses embeddings to select top-K relevant skills
# =============================================================================

semantic:
  enabled: true
  top_k: 5 # Select top 5 most relevant
  threshold: 0.30 # Minimum similarity score
  embedding_model: "local" # local | openai | custom

  # Scoring weights
  weights:
    description: 0.50
    keywords: 0.25
    examples: 0.15
    patterns: 0.10

# =============================================================================
# COMMANDS (28 workflows) — v4.2: Complete Command Set
# Token-efficient with caching and categorization
# =============================================================================

commands:
  # ═══════════════════════════════════════════════════════════════════════════
  # DEVELOPMENT (6 commands)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: code
    file: workflows/code.md
    icon: "💻"
    category: development
    persona: developer
    cache: true
    triggers: [code, write, implement, viết code]

  - id: dev
    file: workflows/dev.md
    icon: "▶️"
    category: development
    persona: developer
    cache: false
    triggers: [dev, start, run, chạy]

  - id: debug
    file: workflows/debug.md
    icon: "🐛"
    category: development
    persona: debugger
    cache: true
