# =============================================================================
# TOKEN BUDGET (Target metrics)
# =============================================================================

token_budget:
  idle: 6400 # ~6,400 tokens at rest (64 × META.yaml)
  single_skill: 7900 # ~7,900 with 1 skill active (+1,500 T2)
  peak: 10900 # ~10,900 max (3 skills concurrent)
