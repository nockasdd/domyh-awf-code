# =============================================================================
# PERSONAS (On-demand load)
# =============================================================================

personas:
  default: developer
  available:
    - id: auditor
      file: personas/auditor.md
      experts: 5
    - id: developer
      file: personas/developer.md
    - id: architect
      file: personas/architect.md
    - id: debugger
      file: personas/debugger.md

# =============================================================================
# I18N
# =============================================================================

i18n:
  supported: [en, vi]
  files:
    en: i18n/en.yaml
    vi: i18n/vi.yaml

# =============================================================================
# TOKEN BUDGET (Target metrics)
# =============================================================================

token_budget:
  idle: 2500 # Target: ~2,500 tokens at rest
  single_skill: 5000 # Target: ~5,000 with 1 skill active
  peak: 10000 # Target: ~10,000 max
