# =============================================================================
# =============================================================================
# Token-efficient architecture with Progressive Disclosure
# Developer: NockDev
# NOTE: Sync version from core/VERSION.yaml
# =============================================================================

name: "DOMYH Awesome Code"
developer: "NockDev"

# =============================================================================
# LANGUAGE & DEFAULTS
# =============================================================================

# lang: SSoT is memory/state.json → preferences.language

defaults:
  evidence_required: true
  evidence_format: "file:line"
  auto_fix: false
  confirm_destructive: true
  quality_frameworks: ["ISO 25010", "CWE Top 25", "OWASP Top 10"]

# =============================================================================
# CORE FILES (Always loaded - MINIMAL tokens)
# =============================================================================

core:
  # Rules System (modular files)
  rules_dir: rules/ # 16 active rule modules
  rules_index: rules/README.md # Rules registry
  # SSoT Files
  context_snapshot: memory/CONTEXT_SNAPSHOT.md # Cold-start context
  memory_paths: core/MEMORY_PATHS.yaml # Memory file locations
  # Reference data (read-only)
  reference_dir: core/reference/ # PATTERNS, TEMPLATES, HSA, etc.

# =============================================================================
# PROGRESSIVE DISCLOSURE SKILLS
# Tier 1: META.yaml (~100-400 tokens) - Always loaded
# Tier 2: SKILL.md (~1,500 tokens) - On-demand
# Tier 3: ADVANCED.md (~4,000 tokens) - Referenced only
# =============================================================================

skills:
  # Baseline: Only META.yaml loaded = 104 skills × ~100-400 tokens
  # Activated: +1,500 tokens per skill (data/*.yaml)
  # Max active: 3 T2 SKILL.md slots loaded concurrently (T1 META detection: unlimited)
  # Categories: 9 core + 28 languages + 9 frameworks + 7 devops + 27 cross-cutting + 6 tooling + 9 ai-ml + 9 governance = 104

  loading:
    # SSoT: config.yaml → skills section
    # Defaults: progressive, max_active=3, cache_ttl=3600

  # Categories with priority (lower = higher priority)
  categories:
    core:
      priority: 0
      always_metadata: true # Always load META.yaml
      skills:
        [
          security,
          api-design,
          authentication,
          context-engineering,
          error-handling,
          logging,
          observability,
          graph-patterns,
        ]

    language:
      priority: 1
      skills:
        [
          go,
          python,
          typescript,
          javascript,
          rust,
          cpp,
          c,
          csharp,
          java,
          php,
          kotlin,
          swift,
          lua,
          ruby,
          asm,
          elixir,
          haskell,
          clojure,
          crystal,
          fsharp,
          julia,
          nim,
          ocaml,
          perl,
          r,
          scala,
          solidity,
          zig,
        ]

    framework:
      priority: 2
      skills: [react, vue, nextjs, angular, nuxt, svelte, flutter, react-native, streamlit]

    devops:
      priority: 3
      skills: [docker, kubernetes, aws, ci-cd, terraform, azure, gcp]

    cross-cutting:
      priority: 4
      skills: [
          database,
          testing,
          coding-rules,
          tailwind,
          domyh-design,
          electron,
          bun,
          deno,
          sql,
          web-perf,
          audit-pro,
          tdd-workflow,
          accessibility,
          seo,
          microservices,
          monorepo,
          # v6.3 New
          tauri,
          real-time,
          event-driven,
          wasm,
          playwright,
          skill-creator,
          payment-integration,
          game-development,
        ]

    tooling:
      priority: 5
      skills: [mcp, ide-extension, cli-dev, api-protocols, browser-agent]

    ai-ml:
      priority: 6
      skills:
        [
          ai-agents,
          vector-search,
          prompt-engineering,
          rag-patterns,
          gemini-media-gen,
          gemini-tts,
          gemini-live,
          ml-pipelines,
          agentic-orchestration,
        ]

    governance:
      priority: 7
      skills:
        [
          context-first-gatekeeping,
          context-integrity,
          debug-orchestration,
          delegation-intelligence,
          evidence-discipline,
          pre-stop-checklist,
          session-lifecycle,
          session-memory,
          context-compaction,
        ]

# =============================================================================
# SEMANTIC TOOL SELECTION
# Uses embeddings to select top-K relevant skills
# =============================================================================

semantic:
  enabled: true
  top_k: 5 # Select top 5 most relevant
  threshold: 0.30 # Minimum similarity score
  embedding_model: "local" # local | openai | custom

  # Scoring weights
  weights:
    description: 0.50
    keywords: 0.25
    examples: 0.15
    patterns: 0.10

