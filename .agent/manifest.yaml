# =============================================================================
# DOMYH Awesome Code  — Optimized Manifest
# =============================================================================
# Token-efficient architecture with Progressive Disclosure
# Developer: NockDev
# NOTE: Sync version from core/VERSION.yaml
# =============================================================================

version: "v6.2.1"
name: "DOMYH Awesome Code"
developer: "NockDev"

# =============================================================================
# LANGUAGE & DEFAULTS
# =============================================================================

lang: vi # Default: en | vi — Currently: Tiếng Việt

defaults:
  evidence_required: true
  evidence_format: "file:line"
  auto_fix: false
  confirm_destructive: true
  quality_frameworks: ["ISO 25010", "CWE Top 25", "OWASP Top 10"]

# =============================================================================
# CORE FILES (Always loaded - MINIMAL tokens)
# =============================================================================

core:
  # Rules System (modular files)
  rules_dir: rules/ # 8 active rule modules
  rules_index: rules/README.md # Rules registry
  # SSoT Files
  memory_paths: core/MEMORY_PATHS.yaml # Memory file locations
  # Reference data (read-only)
  reference_dir: core/reference/ # PATTERNS, TEMPLATES, HSA, etc.

# =============================================================================
# PROGRESSIVE DISCLOSURE SKILLS
# Tier 1: META.yaml (~100-400 tokens) - Always loaded
# Tier 2: SKILL.md (~1,500 tokens) - On-demand
# Tier 3: ADVANCED.md (~4,000 tokens) - Referenced only
# =============================================================================

skills:
  # Baseline: Only META.yaml loaded = 79 skills × ~100-400 tokens
  # Activated: +1,500 tokens per skill (SKILL.md)
  # Max active: 3 skills with T2 loaded
  # Categories: 28 languages + 8 frameworks + 6 core + 7 devops + 20 cross-cutting + 4 tooling + 4 ai-ml

  loading:
    strategy: progressive # progressive | eager | lazy
    max_active: 3 # Max skills in context at once
    cache_ttl: 3600 # 1 hour cache

  # Categories with priority (lower = higher priority)
  categories:
    core:
      priority: 0
      always_metadata: true # Always load META.yaml
      skills:
        [
          security,
          api-design,
          authentication,
          error-handling,
          logging,
          observability,
        ]

    language:
      priority: 1
      skills:
        [
          go,
          python,
          typescript,
          javascript,
          rust,
          cpp,
          c,
          csharp,
          java,
          php,
          kotlin,
          swift,
          lua,
          ruby,
          asm,
          elixir,
          haskell,
          clojure,
          crystal,
          fsharp,
          julia,
          nim,
          ocaml,
          perl,
          r,
          scala,
          solidity,
          zig,
        ]

    framework:
      priority: 2
      skills: [react, vue, nextjs, angular, nuxt, svelte, flutter, react-native]

    devops:
      priority: 3
      skills: [docker, kubernetes, aws, ci-cd]

    cross-cutting:
      priority: 4
      skills:
        [
          database,
          testing,
          coding-rules,
          tailwind,
          domyh-design,
          electron,
          bun,
          deno,
          sql,
          web-perf,
          audit-pro,
          tdd-workflow,
          prompt-engineering,
          accessibility,
          seo,
          microservices,
          monorepo,
          rag-patterns,
        ]

# =============================================================================
# SEMANTIC TOOL SELECTION
# Uses embeddings to select top-K relevant skills
# =============================================================================

semantic:
  enabled: true
  top_k: 5 # Select top 5 most relevant
  threshold: 0.30 # Minimum similarity score
  embedding_model: "local" # local | openai | custom

  # Scoring weights
  weights:
    description: 0.50
    keywords: 0.25
    examples: 0.15
    patterns: 0.10

