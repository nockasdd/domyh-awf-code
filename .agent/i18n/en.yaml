# =============================================================================
# UI MESSAGES — Common messages
# =============================================================================

messages:
  # Stop conditions
  stop_required: "⛔ STOP — Confirmation required before proceeding"
  stop_unclear: "⛔ STOP — Request unclear, clarification needed"
  stop_destructive: "⛔ STOP — Destructive action, confirmation required"

  # Confirmations
  confirm_proceed: "Proceed? (y/n)"
  confirm_yes: "Confirmed, proceeding..."
  confirm_no: "Cancelled."

  # Progress
  progress_started: "🚀 Starting..."
  progress_working: "⏳ Working..."
  progress_complete: "✅ Complete!"
  progress_failed: "❌ Failed"

  # Deep Interview (v6.4.2)
  interview_start: "🎯 DEEP INTERVIEW"
  interview_question_what: "What exactly does this feature handle/manage?"
  interview_question_who: "Who uses it? □ Solo | □ Team (2-10) | □ Public"
  interview_question_priority: "If you could only do one thing, what would it be?"
  interview_skip: "→ Sufficient context, skipping interview"
  interview_complete: "→ Context gathered, proceeding with planning..."

  # Auto Test Loop (v6.4.2)
  test_loop_start: "🧪 AUTO TEST LOOP"
  test_loop_retry: "🔄 Retry {n}/3 — Trying different approach..."
  test_loop_pass: "✅ Tests passed!"
  test_loop_fail_options: |
    😅 I've tried 3 approaches but tests still fail.

    What would you like me to do?
    1️⃣ Try a different (simpler) approach
    2️⃣ Skip this test, continue
    3️⃣ Run /debug for deep analysis
    4️⃣ Rollback to before the fix

  # Step Confirmation (v6.4.2)
  step_done: "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n✅ DONE: {task_name}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  step_next: "→ Continue to next task? (y/adjust/stop)"

  # Misc
  scope_contract: "🎯 Please select scope"
  installation_complete: "✅ Installation complete!"
  goodbye: "Goodbye! 👋"
  skills_suggested: "💡 Suggested skills based on your context"
  flow_detected: "🔄 Detected workflow pattern"
  resume_available: "📂 Previous session found. Resume?"
  language_switched: "🌍 Switched to: English"

