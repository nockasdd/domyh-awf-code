# =============================================================================
# DOMYH Awesome Code - English Strings
# i18n/en.yaml v6.4.2 — Enhanced i18n System
# =============================================================================
# NOTE: Version synced from core/VERSION.yaml
# Usage: Agent reads language from state.json → loads corresponding i18n file
# =============================================================================

app:
  name: "DOMYH Awesome Code"
  version: "6.4.2" # Sync from VERSION.yaml
  version_short: v6.4.2
  tagline: "AI-Powered Development Assistant"
  developer: "NockDev"
  language_name: "English"
  language_code: "en"

# =============================================================================
# AGENT BEHAVIOR INSTRUCTIONS
# Important instructions agent MUST follow when using English
# =============================================================================

agent_instructions:
  primary_language: "en"
  response_language: |
    You MUST respond in English for all interactions.
    Use technical terms and proper nouns as-is.

  tone: "professional_friendly" # formal | professional_friendly | casual
  honorifics:
    user_to_agent: "I" # Agent refers to self as "I"
    agent_to_user: "you" # Refers to user as "you"
    neutral: "you"

  formatting:
    use_emoji: true
    use_boxes: true # Use box characters ━━━━
    code_comments: "english"

# =============================================================================
# COMMANDS - Detailed descriptions for each command
# =============================================================================

commands:
  # Development (6)
  ap:
    name: "Full Audit"
    short: "Audit"
    desc: "Comprehensive code audit with 5-expert panel"
    help: "Usage: /ap [scope] — scope: full | quick | security"
  code:
    name: "Write & Fix Code"
    short: "Code"
    desc: "Write production-ready code, fix/improve existing projects"
    help: "Usage: /code [task] | /code fix [issue] | /code improve [target] | /code analyze [path]"
  debug:
    name: "Debug"
    short: "Debug"
    desc: "Systematic debugging with Root Cause Tracing"
    help: "Usage: /debug [error description or message]"
  plan:
    name: "Plan"
    short: "Plan"
    desc: "Feature design with Deep Interview"
    help: "Usage: /plan [feature] — Options: full, quick, tech, risk"
  test:
    name: "Test"
    short: "Test"
    desc: "Run tests and write new test cases"
    help: "Usage: /test [scope] — scope: unit | integration | e2e | all"

  # Planning (5)
  think:
    name: "Brainstorm"
    short: "Think"
    desc: "Brainstorming Pro with 6 methods, 5 tiers"
    help: "Usage: /think [topic] — Methods: 6hats, swot, scamper, starbursting"
  init:
    name: "Init"
    short: "Init"
    desc: "Initialize new project with smart scaffolding"
    help: "Usage: /init [project type] — e.g., nextjs, golang, flutter"
  doc:
    name: "Doc"
    short: "Doc"
    desc: "Generate comprehensive documentation"
    help: "Usage: /doc [type] — type: api | readme | changelog | all"
  visualize:
    name: "Visualize"
    short: "Visualize"
    desc: "Create mockups and wireframes"
    help: "Usage: /visualize [UI description] — style: glassmorphism, minimalist, etc."
  generate:
    name: "Generate"
    short: "Generate"
    desc: "Auto-generate code from templates"
    help: "Usage: /generate [type] — type: crud | api | model | component"

  # Deployment (6)
  deploy:
    name: "Deploy"
    short: "Deploy"
    desc: "Production deployment with pre-checks"
    help: "Usage: /deploy [env] — env: staging | production"
  env:
    name: "Env"
    short: "Env"
    desc: "Manage environment variables and secrets"
    help: "Usage: /env [action] — action: check | sync | diff"
  migrate:
    name: "Migrate"
    short: "Migrate"
    desc: "Database migrations with zero-downtime"
    help: "Usage: /migrate [action] — action: create | run | rollback"
  monitor:
    name: "Monitor"
    short: "Monitor"
    desc: "Setup observability and alerting"
    help: "Usage: /monitor [setup] — setup: logging | metrics | tracing"
  perf:
    name: "Perf"
    short: "Perf"
    desc: "Profiling and performance optimization"
    help: "Usage: /perf [scope] — scope: cpu | memory | network | all"
  revert:
    name: "Revert"
    short: "Revert"
    desc: "Rollback changes with safety checks"
    help: "Usage: /revert [target] — target: commit | deploy | migration"

  # Quality (5)
  review:
    name: "Review"
    short: "Review"
    desc: "Review PRs with security and performance checks"
    help: "Usage: /review [pr_link or file_path]"
  refactor:
    name: "Refactor & Clean"
    short: "Refactor"
    desc: "Refactor code structure, clean dead code, organize imports"
    help: "Usage: /refactor [scope] | /refactor clean [type] | /refactor clean dead"
  upgrade:
    name: "Upgrade"
    short: "Upgrade"
    desc: "Update dependencies with compatibility checks"
    help: "Usage: /upgrade [scope] — scope: minor | major | security"

  # New Commands (v6.3)
  git:
    name: "Git"
    short: "Git"
    desc: "Git operations hub with conventional commits"
    help: "Usage: /git [command] — commit | branch | stash | log | diff | merge"
  fix:
    name: "Quick Fix"
    short: "Fix"
    desc: "Quick-fix pipeline for immediate error resolution"
    help: "Usage: /fix [error] | /fix last | /fix build | /fix lint | /fix types"
  scaffold:
    name: "Scaffold"
    short: "Scaffold"
    desc: "Generate components, pages, services from project patterns"
    help: "Usage: /scaffold [type] [name] — component | page | service | module | api"
  workflow:
    name: "Workflow"
    short: "Workflow"
    desc: "Workflow discovery, chaining, and management"
    help: "Usage: /workflow list | /workflow chain [a] [b] | /workflow suggest"

  # Extended Commands (v6.3)
