    name: "TDD"
    short: "TDD"
    desc: "Test-Driven Development: Red-Green-Refactor"
    help: "Usage: /tdd [function_name] — Write tests first, code after"
  e2e:
    name: "E2E Test"
    short: "E2E"
    desc: "End-to-End testing with Playwright/Cypress"
    help: "Usage: /e2e [scope] — scope: critical | full | smoke"
  verify:
    name: "Verify"
    short: "Verify"
    desc: "Build-Lint-Test verification loop until all pass"
    help: "Usage: /verify [scope] — scope: build | lint | test | all"
  security:
    name: "Security"
    short: "Security"
    desc: "Security scanning and vulnerability remediation"
    help: "Usage: /security [scope] — scope: sast | sca | secrets | full"
  onboard:
    name: "Onboard"
    short: "Onboard"
    desc: "Discover architecture, map dependencies"
    help: "Usage: /onboard [project_path]"
  prompt:
    name: "Prompt"
    short: "Prompt"
    desc: "Generate structured AI prompts"
    help: "Usage: /prompt [description] — Create a structured prompt"
  orchestrate:
    name: "Orchestrate"
    short: "Orchestrate"
    desc: "Multi-agent orchestration, task delegation"
    help: "Usage: /orchestrate [task] — Split and delegate tasks"
  dev:
    name: "Dev Server"
    short: "Dev"
    desc: "Start development server"
    help: "Usage: /dev [port] — Auto-detect stack and run"

  # Workflow Commands
  clean:
    name: "Clean"
    short: "Clean"
    desc: "Remove dead code, organize imports, remove unused dependencies"
    help: "Usage: /clean [scope] — scope: dead-code | imports | deps | all"
  suggest:
    name: "Suggest"
    short: "Suggest"
    desc: "Smart suggestions based on project context"
    help: "Usage: /suggest"
  feature:
    name: "Feature"
    short: "Feature"
    desc: "Feature lifecycle with scaffold, implement, and traceability"
    help: "Usage: /feature [name] — Full lifecycle from spec to ship"
  modify:
    name: "Modify"
    short: "Modify"
    desc: "Detect stack, analyze, plan fixes, and execute"
    help: "Usage: /modify [scope] — scope: full | quick | targeted"
  doctor:
    name: "Doctor"
    short: "Doctor"
    desc: "System diagnostics, runtime checks, config validation"
    help: "Usage: /doctor"
  search:
    name: "Search"
    short: "Search"
    desc: "Semantic search across memory and audit history"
    help: "Usage: /search [query]"
  sync_version:
    name: "Sync Version"
    short: "Sync"
    desc: "Sync version from VERSION.yaml SSoT across all files"
    help: "Usage: /sync-version"

  # Utility (6)
  status:
    name: "Status"
    short: "Status"
    desc: "Check project health"
    help: "Usage: /status"
  recap:
    name: "Recap"
    short: "Recap"
    desc: "Session summary"
    help: "Usage: /recap"
  help:
    name: "Help"
    short: "Help"
    desc: "Show available commands"
    help: "Usage: /help [command]"

