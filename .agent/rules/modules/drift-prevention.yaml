# Drift Prevention v7.2.0
# Rule module for DOMYH — enforces event-based alignment checks
# v7.2: Replaced counter-based triggers with event-based, expanded personas
---
name: drift-prevention
rule_id: "MOD-DRF-001"

description: |
  Prevent agent drift by enforcing event-based alignment checks.
  Triggers warnings when actions diverge from declared intent.

category: "governance"

context:
  always_apply: true
  personas: ["*"]
  trigger: "On scope-change events (see DRF-001 event list)"

rules:
  - id: DRF-001
    name: "Scope Guard"
    severity: warning
    description: |
      Trigger on these events (replaces "every 10 tool calls"):
        - first_file_write: "Is this file in declared scope?"
        - new_file_creation: "Is creating this file part of the plan?"
        - error_in_unrelated_file: "Is debugging this error within scope?"
        - dependency_addition: "Is new dependency justified? Search utils first"
      For each event:
      1. Evaluate: does this action align with declared intent?
      2. If drift detected, evaluate necessity
      3. If justified → update intent via hsa_session
      4. If not justified → refocus on declared goals

  - id: DRF-002
    name: "Goal Alignment"
    severity: info
    description: |
      Periodically verify current work aligns with session goals:
      - After completing a tactic, check remaining goals
      - Before starting new work, verify it matches a declared goal
      - If all goals completed, declare new intent or end session

  - id: DRF-003
    name: "Mode Consistency"
    severity: info
    description: |
      Ensure behavior matches declared mode:
      - plan_driven: follow structured plan, track progress meticulously
      - exploration: allow flexibility but still check drift on file writes
      - bugfix: stay focused on the specific bug, avoid feature creep
      - refactor: limit scope to refactoring, avoid adding new features

  - id: DRF-004
    name: "Debug Escalation Timeout"
    severity: warning
    description: |
      When debugging, follow escalation timeline:
        0-10 min: Normal debugging — follow 5-phase protocol
        10-20 min: REFLECT — re-read error, check assumptions
        20-30 min: REFRAME — try completely different hypothesis
        30-45 min: WIDEN — search docs, issues, external resources
        45+ min: ESCALATE — save progress as anchor, ask user for help
      At 30 min, MUST save: hsa_session({
        content: "[DEBUG-STUCK] Bug: X. Tried: Y. Rejected: Z. Current theory: W.",
        category: "context"
      })
      See skill: governance/debug-orchestration for full protocol.

  - id: DRF-005
    name: "Hypothesis Journaling"
    severity: info
    description: |
      During debugging, maintain a hypothesis tree:
        1. List all hypotheses ranked by likelihood
        2. For each: test, record evidence, verdict (confirmed/rejected)
        3. Save confirmed root cause as anchor
      ENFORCEMENT: Do NOT re-try an approach already marked REJECTED.
      After 2 failed attempts on same approach:
        → MUST try fundamentally different strategy
        → Save rejected approaches as anchor for cross-session memory
      This prevents circular debugging and preserves investigation progress
      across context compaction.

integration:
  tier: 2
  related_modules:
    - session-governance
    - context-integrity
    - stop-conditions
