# Edit Verification Rule v6.3.9
---
name: edit-verification
version: "6.3.9"
rule_id: "MOD-EDV-001"

description: "Mandatory verification after code edits to prevent silent failures."
category: "verification"

context:
  always_apply: true
  personas: ["developer", "debugger", "devops"]

# --- CORE PRINCIPLES ---

principles:
  verify_after_edit:
    - "Display diff evidence (file path, lines added/removed, status)"
    - "Run syntax check after editing (use hsa_detect_stack for correct command)"
    - "Run related tests if they exist"

  scope_containment:
    - "Edit only files mentioned in the request or their direct dependencies"
    - "Preserve existing formatting and coding style"
    - "Confirm with user before touching files outside scope"

  deletion_prevention:
    - "Verify file integrity after edits"
    - "Flag deletions exceeding 100 lines for confirmation"
    - "Use git diff to confirm changes match intent"

# --- VERIFICATION GATES ---

gates:
  1_confirmation: "Display file path, lines changed (+/-), and verification command"
  2_syntax: "Run language-appropriate syntax check (tsc/go build/py_compile/cargo check)"
  3_tests: "Run related tests if they exist (npm test/go test/pytest)"

# --- PROTECTED FILES ---

protected_files:
  - ".env*"
  - "*.key"
  - "*.pem"
  - "id_rsa*"
  - "credentials.*"
  - "secrets.*"

protected_sections:
  marker: "@protected - do not modify"
  action: "Skip editing protected sections"

# --- PATCH STRATEGY ---

patch_rules:
  - "Apply small hunks, not entire files"
  - "If patch fails, regenerate — never force apply"
  - "Commit frequently for safe rollback points"

integration:
  tier: 2
  related_modules: ["stop-conditions"]

---
_DOMYH Awesome Code • Edit Verification Rule_
