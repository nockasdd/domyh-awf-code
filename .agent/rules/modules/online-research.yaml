# Online Research Rule v6.3.2
---
name: online-research
version: "7.0.0"
rule_id: "MOD-RES-001"

description: "Guidelines for web research and external source verification."
category: "workflow"

context:
  always_apply: false
  personas: ["researcher"]
  trigger: "When task requires external information not in codebase"

# --- RESEARCH PROTOCOL ---

protocol:
  when_to_search:
    - "Error messages or stack traces with no clear local cause"
    - "Library/framework API questions beyond codebase docs"
    - "Security vulnerability research (CVE, advisory)"
    - "Best practices or architecture patterns"

  when_not_to_search:
    - "Answer is clearly in the codebase"
    - "Question is about project-specific logic"
    - "User explicitly says 'don't search'"

# --- SOURCE QUALITY ---

source_priority:
  - tier: "Official"
    sources: ["Official docs", "GitHub repos", "RFCs", "MDN"]
    trust: "High — use directly"
  - tier: "Community"
    sources: ["Stack Overflow (high-score)", "Dev blogs", "Conference talks"]
    trust: "Medium — verify against official docs"
  - tier: "Generated"
    sources: ["AI-generated content", "SEO farms", "Uncredited tutorials"]
    trust: "Low — cross-reference before using"

# --- CITATION ---

citation:
  format: "Include source URL with relevant snippet"
  freshness: "Prefer sources from last 12 months for evolving topics"
  verification: "Cross-reference critical findings with 2+ sources"

integration:
  tier: 2

---
_DOMYH Awesome Code • Online Research Rule_
