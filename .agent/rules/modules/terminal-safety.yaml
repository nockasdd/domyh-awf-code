# Terminal Safety Rule v6.0
# Modular rule for terminal command safety

---
name: terminal-safety
version: "6.0.0"
rule_id: "MOD-TRM-001"

# =============================================================================
# RULE METADATA
# =============================================================================

description: |
  Rules to prevent terminal execution errors based on documented agent failures.
  Based on AI Agent Error Research 2024-2025.

category: "safety"

# =============================================================================
# CONTEXT APPLICATION
# =============================================================================

context:
  always_apply: true
  personas: ["developer", "debugger", "devops", "tester"]
  workflows: ["*"]

# =============================================================================
# PRE-FLIGHT CHECKS
# =============================================================================

pre_flight:
  always_check:
    - name: "Working Directory"
      command_ps: "$PWD"
      command_bash: "pwd"
      purpose: "Verify current directory"

    - name: "Environment"
      command_ps: "$PSVersionTable.PSVersion"
      command_bash: "uname -a"
      purpose: "Verify OS/shell"

    - name: "Runtime Versions"
      commands:
        node: "node -v"
        go: "go version"
        python: "python --version"
      purpose: "Verify tool versions"

  environment_detection:
    wsl:
      indicators: ["/mnt/", "WSL_DISTRO_NAME"]
      action: "Use Linux commands"
    remote:
      indicators: ["SSH_CONNECTION", "REMOTE_CONTAINERS"]
      action: "Note remote execution"

# =============================================================================
# TIMEOUT RULES
# =============================================================================

timeout:
  no_output_warning: 60 # Seconds without output
  force_stop: 180 # Maximum total time
  interactive_detected: "warn_and_wait"

  actions:
    on_hang: |
      ⏸️ Command timeout (no output for 60s)

      Options:
      1️⃣ Wait longer
      2️⃣ Cancel command
      3️⃣ Check for prompts

# =============================================================================
# DANGEROUS COMMANDS
# =============================================================================

dangerous_commands:
  always_confirm:
    - pattern: "rm -rf"
      impact: "Recursive delete"
      reversible: false
    - pattern: "rm -r"
      impact: "Recursive delete"
      reversible: false
    - pattern: "drop table"
      impact: "Delete database table"
      reversible: false
    - pattern: "truncate"
      impact: "Delete all data"
      reversible: false
    - pattern: "git reset --hard"
      impact: "Discard all changes"
      reversible: false
    - pattern: "git push --force"
      impact: "Overwrite remote history"
      reversible: "with reflog"
    - pattern: "docker system prune"
      impact: "Remove all unused data"
      reversible: false
    - pattern: "npm publish"
      impact: "Publish to registry"
      reversible: false

  confirmation_template: |
    ⚠️ DANGEROUS COMMAND DETECTED

    Command: {command}
    Impact: {impact}
    Reversible: {reversible}

    Proceed? (y/n):

# =============================================================================
# ANTI-LOOP PROTECTION
# =============================================================================

anti_loop:
  max_retries: 2
  same_command_interval: 60 # seconds

  on_loop_detected: |
    🔁 LOOP DETECTED

    Command `{command}` failed {count} times.
    Errors: {errors}

    Options:
    1️⃣ Try with elevated permissions
    2️⃣ Clear cache and retry
    3️⃣ Manual intervention

    Enter number:

# =============================================================================
# PROTECTED FILES
# =============================================================================

protected_files:
  patterns:
    - ".env*"
    - "*.config.*"
    - "docker-compose*.yml"
    - "Makefile"
    - "*.sql"
    - "package.json"
    - "go.mod"
    - "requirements.txt"
    - ".git*"

  procedure:
    1_notify: "Explain what will be done"
    2_reason: "Why it's needed"
    3_impact: "Consequences if done"
    4_wait: "Wait for user confirmation"

# =============================================================================
# OUTPUT VERIFICATION
# =============================================================================

output_verification:
  exit_codes:
    0: "success"
    non_zero: "investigate"

  no_output_action: "Check for shell issues"

  always_show:
    - exit_code
    - relevant_output
    - any_errors

# =============================================================================
# SHELL INTEGRATION
# =============================================================================

shell_integration:
  known_conflicts:
    - "Starship prompt"
    - "Oh My Posh"
    - "ble.sh"
    - "OSC 633/133 sequences"

  workaround: |
    If terminal output not visible:
    1. Settings > Agents > Inline Editing & Terminal
    2. Enable "Legacy Terminal Tool"
    3. Kill all terminals (Ctrl+Shift+P)
    4. Restart IDE

# =============================================================================
# CHECKLIST
# =============================================================================

checklist:
  - "Verified current directory?"
  - "Checked OS/environment?"
  - "Command is safe?"
  - "Not repeating failed command?"
  - "Timeout configured?"

# =============================================================================
# INTEGRATION
# =============================================================================

integration:
  tier: 1 # Safety tier
  related_modules:
    - stop-conditions
    - edit-verification

  reflection:
    enabled: true
    check_before: "command"
    question: "Is this command safe to run?"

---
_DOMYH Awesome Code v6.0 • Terminal Safety Rule_
