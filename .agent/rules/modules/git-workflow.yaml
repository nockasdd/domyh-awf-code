# Git Workflow Rule v6.0
# Modular rule for git operations

---
name: git-workflow
version: "6.1.2"
rule_id: "MOD-GIT-001"

# =============================================================================
# RULE METADATA
# =============================================================================

description: |
  Rules for git operations: detection, prerequisite checks, and deployment readiness.

category: "workflow"

# =============================================================================
# CONTEXT APPLICATION
# =============================================================================

context:
  always_apply: false
  personas: ["developer", "devops"]
  workflows: ["/code", "/deploy", "/refactor"]

# =============================================================================
# GIT DETECTION
# =============================================================================

detection:
  commands:
    powershell: "Test-Path .git -PathType Container"
    bash: "test -d .git"

  on_detected:
    - "Include git commands (commit, push, diff)"
    - "Show git status in next steps"

  on_missing:
    - "Skip git suggestions"
    - "Offer initialization"

# =============================================================================
# PRE-DEPLOY CHECKS
# =============================================================================

pre_deploy:
  preconditions:
    1_git_init:
      check: ".git/ directory exists"
      fail_action: "Suggest: git init"

    2_remote:
      check: "git remote -v has origin"
      fail_action: "Suggest: git remote add origin <url>"

    3_uncommitted:
      check: "git status --porcelain is empty"
      fail_action: "Suggest: git add .; git commit -m 'message'"

  decision_flow: |
    Before suggesting /deploy:
        │
        ├── No .git/? → "Initialize git: git init"
        │
        ├── No remote? → "Add remote: git remote add origin <url>"
        │
        ├── Uncommitted? → "Commit: git add .; git commit -m 'msg'"
        │
        └── All good → Proceed with /deploy

# =============================================================================
# OUTPUT TEMPLATES
# =============================================================================

templates:
  with_git: |
    Next Steps:
    ├── ✅ Review changes: git diff
    ├── ✅ Commit: git commit -am "{message}"
    └── ✅ Push: git push

  without_git: |
    Next Steps:
    ├── ✅ Changes saved successfully
    └── 💡 Consider: git init; git add .; git commit -m 'Initial'

  pre_deploy_no_git: |
    📋 NEXT STEPS:
    1️⃣ Initialize git: git init
    2️⃣ Add remote: git remote add origin <your-repo-url>
    3️⃣ First commit: git add .; git commit -m 'Initial commit'
    4️⃣ Push: git push -u origin main

    Would you like me to help set this up?

# =============================================================================
# SAFE OPERATIONS
# =============================================================================

safe_operations:
  always_safe:
    - "git status"
    - "git diff"
    - "git log"
    - "git branch"
    - "git remote -v"

  require_confirmation:
    - pattern: "git reset --hard"
      reason: "Discards all uncommitted changes"
    - pattern: "git push --force"
      reason: "Overwrites remote history"
    - pattern: "git clean -fd"
      reason: "Removes untracked files"
    - pattern: "git rebase"
      reason: "Rewrites commit history"

# =============================================================================
# COMMIT MESSAGE GUIDELINES
# =============================================================================

commit_messages:
  format: "type(scope): message"
  types:
    - feat: "New feature"
    - fix: "Bug fix"
    - docs: "Documentation"
    - style: "Formatting"
    - refactor: "Code restructure"
    - test: "Adding tests"
    - chore: "Maintenance"

  examples:
    - "feat(auth): add JWT authentication"
    - "fix(payment): resolve checkout timeout"
    - "docs(readme): update installation guide"

# =============================================================================
# CHECKLIST
# =============================================================================

checklist:
  - "Check .git/ directory exists"
  - "Check git remote -v has origin"
  - "Check git status for uncommitted changes"
  - "Only suggest /deploy if all conditions pass"
  - "Provide helpful git setup if missing"

# =============================================================================
# INTEGRATION
# =============================================================================

integration:
  tier: 2 # Execution tier
  related_modules:
    - terminal-safety
    - edit-verification

  reflection:
    enabled: false

---
_DOMYH Awesome Code v6.1.2 • Git Workflow Rule_
