# Agent Delegation Rule v6.2.5
# When and how to delegate to specialized sub-agents

---
name: agent-delegation
version: "6.2.5"
rule_id: "MOD-DEL-001"

# =============================================================================
# RULE METADATA
# =============================================================================

description: |
  Guidelines for agent delegation: when to delegate tasks to specialized
  sub-agents, scope limits, tool restrictions, and handoff patterns.

category: "workflow"

# =============================================================================
# CONTEXT APPLICATION
# =============================================================================

context:
  always_apply: false
  personas: ["orchestrator", "developer", "architect"]
  workflows: ["/orchestrate", "/plan", "/code"]
  trigger: "When task complexity exceeds single-agent capacity"

# =============================================================================
# DELEGATION CRITERIA
# =============================================================================

when_to_delegate:
  always_delegate:
    - "Security review (→ Security persona)"
    - "Performance audit (→ Performance persona)"
    - "E2E test generation (→ Tester persona)"
    - "Documentation sync (→ Documenter persona)"

  consider_delegating:
    - "Task involves 3+ distinct domains"
    - "Code review with 500+ changed lines"
    - "Multi-language refactoring"
    - "Simultaneous frontend + backend changes"

  never_delegate:
    - "Tasks requiring full conversation context"
    - "User preference/style decisions"
    - "Critical data migrations without review"
    - "Destructive operations (delete, drop)"

# =============================================================================
# SCOPE LIMITS
# =============================================================================

scope_limits:
  per_agent:
    max_files: 10
    max_tool_calls: 50
    timeout_minutes: 15
    allowed_tools:
      - "Read"
      - "Grep"
      - "Glob"
      - "View"

  elevated_tools:
    requires_approval: true
    tools:
      - "Write"
      - "Edit"
      - "Bash"
      - "Terminal"

# =============================================================================
# HANDOFF PATTERNS
# =============================================================================

handoff_patterns:
  - name: sequential-handoff
    description: "One agent completes, passes result to next"
    flow: "Agent A → Result → Agent B → Result → Orchestrator"
    when: "Tasks have dependencies"

  - name: parallel-fan-out
    description: "Multiple agents work simultaneously"
    flow: "Orchestrator → [Agent A, Agent B, Agent C] → Merge"
    when: "Tasks are independent"

  - name: review-loop
    description: "Agent produces, reviewer validates"
    flow: "Developer → Code → Reviewer → Feedback → Developer"
    when: "Quality-critical changes"

# =============================================================================
# COMMUNICATION FORMAT
# =============================================================================

agent_spec_format:
  template: |
    ## Agent: {name}
    **Role**: {role description}
    **Scope**: {files/directories}
    **Tools**: {allowed tools}
    **Output**: {expected deliverable}
    **Constraints**: {limitations}

# =============================================================================
# CHECKLIST
# =============================================================================

checklist:
  - "Is the task clearly scoped?"
  - "Are tools restricted appropriately?"
  - "Is the expected output defined?"
  - "Does the agent have sufficient context?"
  - "Are destructive operations blocked?"

# =============================================================================
# INTEGRATION
# =============================================================================

integration:
  tier: 2
  related_modules:
    - quality
    - stop-conditions
    - yagni

  reflection:
    enabled: true
    check_before: "delegation"
    question: "Could I handle this myself, or does it need a specialist?"

  hsa_tools:
    hsa_prepare_handoff:
      purpose: "Generate context packet for sub-agent with project snapshot and relevant files"
      usage: "hsa_prepare_handoff task_type=[code|test|review|debug] focus_files=[paths] → context packet"
    hsa_filter_tools:
      purpose: "Reduce prompt bloat by pruning tool catalog per sub-agent task type (93-97% token savings)"
      usage: "hsa_filter_tools task_type=[code|test|review] → include/exclude tool lists"
    hsa_get_snapshot:
      purpose: "Provide project overview for sub-agent context injection"
      usage: "hsa_get_snapshot → file tree, detected stack, key symbols"

---
