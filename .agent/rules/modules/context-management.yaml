# Context Management Rule v6.0
# Modular rule for context and token efficiency

---
name: context-management
version: "6.0.0"
rule_id: "MOD-CTX-001"

# =============================================================================
# RULE METADATA
# =============================================================================

description: |
  Rules for efficient context window management and token optimization.
  Based on best practices for LLM conversation management.

category: "efficiency"

# =============================================================================
# CONTEXT APPLICATION
# =============================================================================

context:
  always_apply: true
  personas: ["*"]
  workflows: ["*"]

# =============================================================================
# CORE PRINCIPLES
# =============================================================================

principles:
  progressive_disclosure:
    description: "Load information only when needed"
    implementation:
      - "Start with high-level overview"
      - "Drill down on request or necessity"
      - "Don't load full files unless required"
    examples:
      good: "Use view_file_outline first, then view specific functions"
      bad: "Load entire 500-line file to find one function"

  token_budget_awareness:
    description: "Be conscious of token usage"
    implementation:
      - "Estimate token cost before large operations"
      - "Summarize verbose outputs"
      - "Reference instead of repeat"
    limits:
      working_memory: 2000
      session_context: 5000
      max_single_file: 10000

  smart_caching:
    description: "Remember what you've already seen"
    implementation:
      - "Don't re-read files already in context"
      - "Track which files have been viewed"
      - "Update mental model incrementally"

# =============================================================================
# SPECIFIC RULES
# =============================================================================

rules:
  file_viewing:
    rule: "Use view_file_outline before view_file for large files"
    rationale: "Outline provides structure with minimal tokens"
    threshold: "Files > 200 lines"
    
  search_strategy:
    rule: "Use grep_search for finding, view_file for understanding"
    rationale: "grep returns targeted results, view_file is for context"
    
  conversation_context:
    rule: "Reference previous answers instead of repeating"
    pattern: "As mentioned above..." or "Continuing from earlier..."
    
  output_efficiency:
    rule: "Summarize similar items, detail unique ones"
    example: "Found 15 similar errors in X pattern, showing 3 representative..."
    
  file_modification:
    rule: "Use targeted edits, not full file rewrites"
    pattern: "replace_file_content for modifications"
    exception: "New files use write_to_file"

# =============================================================================
# TRIGGERS & ACTIONS
# =============================================================================

triggers:
  large_file_detected:
    condition: "File > 500 lines"
    action: "Use outline first"
    
  repeated_content:
    condition: "Same content appears twice"
    action: "Reference with pointer"
    
  context_overflow:
    condition: "Context approaching limit"
    action: "Summarize and archive older context"

# =============================================================================
# INTEGRATION
# =============================================================================

integration:
  memory_system:
    - "Use working memory for immediate context"
    - "Move completed context to session memory"
    - "Summarize session to state on save"
    
  reflection:
    enabled: true
    check_after: "Every 5 tool calls"
    question: "Am I using context efficiently?"

---

