# Performance Optimization Rule v6.4.0
---
name: performance-optimization
version: "6.4.0"
rule_id: "MOD-PERF-001"

description: "Model selection, context management, and token budget optimization."
category: "engineering"

context:
  always_apply: true

# --- MODEL SELECTION ---

model_selection:
  - scenario: "Simple code generation, formatting, data parsing"
    recommended: "Fast model (flash/mini)"
    reason: "Pattern matching, speed > reasoning"
  - scenario: "Complex architecture, debugging, security review"
    recommended: "Strong model (opus/pro)"
    reason: "Requires deep multi-step reasoning"
  - scenario: "Code review, refactoring, documentation"
    recommended: "Balanced model (sonnet/standard)"
    reason: "Good reasoning at reasonable cost"

# --- CONTEXT MANAGEMENT ---

context_management:
  - "Include only relevant files/sections — avoid loading entire codebase"
  - "Start with file outline, load detail on-demand (progressive loading)"
  - "Re-read files after edits before verification (context freshness)"
  - "Summarize long context when approaching 60% of window capacity"

# --- TOKEN BUDGET ---

token_budget:
  system_prompt: "10%"
  skill_loading: "15%"
  code_context: "40%"
  reasoning: "25%"
  output: "10%"

# --- EFFICIENT TOOL USAGE ---

tool_efficiency:
  - "Call independent tools in parallel (e.g., read 3 files simultaneously)"
  - "Use grep/search before listing/reading whole directories"
  - "Use multi_replace for multiple edits in same file"
  - "Stop searching after finding the answer (early termination)"
  - "Use view_file_outline before full file reads"
  - "Load META.yaml before SKILL.md before ADVANCED.md"

integration:
  tier: 2
  related_modules: ["yagni", "stop-conditions"]

---
_DOMYH Awesome Code • Performance Optimization Rule_
