# Terminal Hang Prevention for AI Agents on Windows
# PURPOSE: Prevent AI agent commands from hanging on Windows MINGW64/Git Bash.
# SCOPE: Windows only. Linux/macOS pipes work correctly.
---
name: terminal-antigravity
rule_id: "MOD-TERM-001"

description: |
  Prevents AI agent terminal commands from hanging on Windows.
  Covers pipe deadlocks, pagers, interactive prompts, EOF, TTY mismatch.

category: "safety"

context:
  always_apply: false
  platforms: ["windows"]
  personas: ["Developer", "Debugger", "Tester", "DevOps", "Orchestrator"]
  workflows: ["all"]

integration:
  tier: 1
  related_modules: ["terminal-safety", "shell-commands"]

# ═══ CORE PRINCIPLE ═══
# On Windows MINGW64: NEVER pipe, NEVER pager, NEVER interactive without flags.
# Use tool-native output flags instead. Always set WaitMsBeforeAsync.

# ═══ BANNED PATTERNS → SAFE ALTERNATIVES ═══

pipes:
  severity: critical
  banned:
    - { pattern: "| grep",  fix: "Run alone, parse in agent logic" }
    - { pattern: "| tail",  fix: "Use OutputCharacterCount in command_status" }
    - { pattern: "| head",  fix: "Run alone, read first N lines" }
    - { pattern: "| wc",    fix: "Run alone, count in agent logic" }
    - { pattern: "| sort",  fix: "Use command's --sort flag or sort in agent" }
    - { pattern: "| uniq",  fix: "Run alone, deduplicate in agent" }
    - { pattern: "| awk",   fix: "Run alone, extract fields in agent" }
    - { pattern: "| sed",   fix: "Run alone, find-replace in agent" }
    - { pattern: "| tee",   fix: "Redirect: cmd > file.log 2>&1" }
    - { pattern: "| xargs", fix: "Use command's bulk operation or agent loop" }
    - { pattern: "| less",  fix: "Use view_file tool" }
    - { pattern: "| more",  fix: "Use view_file tool" }
    - { pattern: "2>&1 |",  fix: "Use '2>&1' alone without piping" }

pagers:
  severity: critical
  banned:
    - { cmd: "less",     fix: "cat or view_file" }
    - { cmd: "more",     fix: "cat or view_file" }
    - { cmd: "man",      fix: "command --help" }
    - { cmd: "npm help", fix: "npm <sub> --help" }
  implicit:
    - { cmd: "git log",            fix: "git --no-pager log -n N --oneline" }
    - { cmd: "git diff",           fix: "git --no-pager diff" }
    - { cmd: "git show",           fix: "git --no-pager show" }
    - { cmd: "git blame",          fix: "git --no-pager blame file" }
    - { cmd: "git stash show -p",  fix: "git --no-pager stash show -p" }

interactive:
  severity: high
  banned:
    - { cmd: "npm init",           fix: "npm init -y" }
    - { cmd: "npx create-*",       fix: "npx -y create-* --template <name>" }
    - { cmd: "python (no args)",   fix: "python -c 'code' or python script.py" }
    - { cmd: "node (no args)",     fix: "node -e 'code' or node script.js" }
    - { cmd: "git add -p",         fix: "git add . or git add file" }
    - { cmd: "git rebase -i",      fix: "git rebase --autosquash" }
    - { cmd: "git clean -i",       fix: "git clean -fd" }
    - { cmd: "ssh host (no cmd)",  fix: "ssh host 'command'" }
    - { cmd: "apt install (no -y)",fix: "apt install -y package" }

eof:
  severity: critical
  banned:
    - { cmd: "cat (no args)",      fix: "cat file (explicit arg)" }
    - { cmd: "read (bash)",        fix: "Avoid in non-interactive scripts" }
    - { cmd: "cmd 2>&1 | downstream", fix: "cmd > out.log 2> err.log, then view_file" }

nodejs:
  severity: high
  banned:
    - { pattern: "npx vitest run | grep", fix: "npx vitest run --reporter=verbose" }
    - { pattern: "npx jest | tail",       fix: "npx jest --verbose" }
    - { pattern: "npm test | grep",       fix: "npm test (parse in agent)" }
    - { pattern: "npx tsc | grep",        fix: "npx tsc --noEmit (read full output)" }
  dev_servers: "NEVER EXIT. Start with WaitMsBeforeAsync 3000-5000, use command_status."

tty:
  severity: high
  banned:
    - { cmd: "docker exec -it",    fix: "docker exec (no -it) or winpty" }
    - { cmd: "python -c 'input'",  fix: "python -c 'print(...)' (no stdin)" }

infinite:
  severity: high
  banned:
    - { cmd: "tail -f",            fix: "tail -n 50 file" }
    - { cmd: "watch -n N",         fix: "Run command once" }
    - { cmd: "docker logs -f",     fix: "docker logs --tail 50 container" }
    - { cmd: "kubectl logs -f",    fix: "kubectl logs --tail=50 pod" }
    - { cmd: "npm run dev",        fix: "Background: WaitMsBeforeAsync 3000-5000" }
    - { cmd: "docker compose up",  fix: "docker compose up -d" }

# ═══ RECOVERY ═══

recovery:
  detection:
    - "command_status 'running' after reasonable wait"
    - "No output for > 30s on a quick command"
  actions: "check → terminate → retry with safe alternative → log"
  timeouts: { fast: 30, build: 120, test: 300, index: 600 }

# ═══ DECISION FLOW ═══
# Before ANY terminal command:
# 1. Contains "|"? → REWRITE without pipe
# 2. Pager (less/more/man/git without --no-pager)? → Add --no-pager or --help
# 3. Interactive (no -y, REPL)? → Add non-interactive flags
# 4. Infinite (tail -f, watch, dev server)? → Finite version or background
# 5. Set WaitMsBeforeAsync (fast: 5000-10000, build: 10000+background)
# 6. Set OutputCharacterCount 2000-5000

checklist:
  - "No pipe chains (|)?"
  - "No pager (less/more/man)?"
  - "No interactive prompts?"
  - "No infinite commands?"
  - "Git has --no-pager?"
  - "WaitMsBeforeAsync set?"
