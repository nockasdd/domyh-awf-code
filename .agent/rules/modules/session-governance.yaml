# Session Governance
# Rule module for DOMYH v7.0 — teaches agents to use session governance discipline
---
name: session-governance
version: "6.4.0"
rule_id: "MOD-GOV-001"

description: |
  Session governance discipline: declare intent before coding,
  track progress at trajectory/tactic/action levels,
  save anchors for immutable facts, check drift periodically.

category: "governance"

context:
  always_apply: true
  personas:
    - Developer
    - Architect
    - Debugger
    - Planner
    - Orchestrator

rules:
  - id: GOV-001
    name: "Declare Before Code"
    severity: warning
    when: "Starting any significant task (feature, bugfix, refactor)"
    action: |
      Call hsa_declare_intent with:
        - focus: what you're working on
        - mode: plan_driven | exploration | bugfix | refactor
        - goals: concrete deliverables (array of strings)
      This creates a session trajectory and enables drift detection.

  - id: GOV-002
    name: "Track Progress Hierarchy"
    severity: info
    when: "Completing a milestone or starting a new sub-task"
    action: |
      Call hsa_track_progress with:
        - level: trajectory (top goal) | tactic (sub-task) | action (leaf step)
        - label: what this step is about
        - status: active | completed | blocked | cancelled
        - parent_id: parent node ID (for tactic/action)
      Hierarchy: 1 trajectory → N tactics → N actions per tactic.

  - id: GOV-003
    name: "Anchor Immutable Facts"
    severity: info
    when: "Discovering project conventions, making architectural decisions"
    action: |
      Call hsa_save_anchor with:
        - content: the fact to remember
        - category: stack | convention | decision | constraint | context
      Anchors are immutable — they survive context compaction and session resets.
      Save anchors for: tech stack, coding conventions, architecture decisions,
      deployment constraints, project-specific context.

  - id: GOV-004
    name: "Drift Check"
    severity: warning
    when: "Before starting unplanned work or changing scope"
    action: |
      Call hsa_check_drift with:
        - current_action: what you're about to do
        - include_anchors: true (for full context)
      If drift detected:
        1. Evaluate: is this deviation necessary?
        2. If yes: call hsa_declare_intent to update intent
        3. If no: return to declared focus

  - id: GOV-005
    name: "Pre-Stop Checklist"
    severity: warning
    when: "Before claiming 'done' or ending a session"
    action: |
      Before ANY stop, verify 5 points:
        1. BUILD passes (run build command)
        2. TESTS pass (run test suite)
        3. HIERARCHY updated (hsa_track_progress status: completed)
        4. SESSION archived (hsa_save_anchor category: context)
        5. USER notified (report what's done, what's pending)
      Never stop without checking. Incomplete stops compound into lost work.
      See skill: governance/pre-stop-checklist for full protocol.

  - id: GOV-006
    name: "Session Handoff Format"
    severity: info
    when: "Ending a session or saving session state"
    action: |
      Use structured format for session anchors:
        [SESSION-END] Topic: {what}. Done: {completed}. Pending: {remaining}.
        Files: {key files}. Build: pass/fail. Tests: X/Y pass.
      This enables clean resume in next session via hsa_check_drift(include_anchors: true).

integration:
  tier: 2
  related_modules:
    - context-integrity
    - drift-prevention
    - stop-conditions
