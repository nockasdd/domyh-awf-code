# Context Integrity
# Rule module for DOMYH v7.0 — preserves context coherence across long sessions
---
name: context-integrity
version: "7.0.0"
rule_id: "MOD-CTX-001"

description: |
  Maintain coherent context across long sessions.
  Prevent context fragmentation and ensure anchors are preserved
  during context compaction and session handoffs.

category: "governance"

context:
  always_apply: true
  personas:
    - Developer
    - Architect

rules:
  - id: CTX-001
    name: "Anchor on Stack Discovery"
    severity: info
    description: |
      When discovering project stack or conventions (via hsa_detect_stack,
      file exploration, or user statements), immediately save an anchor.
      Example: hsa_save_anchor({ content: "Uses Next.js 14 + Prisma", category: "stack" })

  - id: CTX-002
    name: "Anchor on Architecture Decisions"
    severity: info
    description: |
      When making or learning about architectural decisions, save an anchor.
      Include the rationale — anchors survive compaction, decisions.md may not.
      Example: hsa_save_anchor({ content: "REST over gRPC — team familiarity", category: "decision" })

  - id: CTX-003
    name: "Review Anchors on Resume"
    severity: warning
    description: |
      When resuming work after context compaction or new session:
      1. Call hsa_check_drift with include_anchors=true
      2. Review all saved anchors before making changes
      3. Verify anchors are still current — update intent if needed

  - id: CTX-004
    name: "Preserve Hierarchy on Compaction"
    severity: warning
    description: |
      When session context is running low:
      1. Call hsa_check_drift to get current hierarchy state
      2. Mark completed items with hsa_track_progress
      3. Anchors and hierarchy persist in session-state.json automatically

integration:
  tier: 2
  related_modules:
    - session-governance
    - drift-prevention
