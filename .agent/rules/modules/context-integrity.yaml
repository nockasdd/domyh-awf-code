# Context Integrity
# Rule module for DOMYH v7.2 — preserves context coherence across long sessions
---
name: context-integrity
rule_id: "MOD-CTX-001"

description: |
  Maintain coherent context across long sessions.
  Prevent context fragmentation and ensure anchors are preserved
  during context compaction and session handoffs.

category: "governance"

context:
  always_apply: true
  personas:
    - Developer
    - Architect

rules:
  - id: CTX-001
    name: "Anchor on Stack Discovery"
    severity: info
    description: |
      When discovering project stack or conventions (via hsa_detect,
      file exploration, or user statements), immediately save an anchor.
      Example: hsa_session({ content: "Uses Next.js 14 + Prisma", category: "stack" })

  - id: CTX-002
    name: "Anchor on Architecture Decisions"
    severity: info
    description: |
      When making or learning about architectural decisions, save an anchor.
      Include the rationale — anchors survive compaction, decisions.md may not.
      Example: hsa_session({ content: "REST over gRPC — team familiarity", category: "decision" })

  - id: CTX-003
    name: "Review Anchors on Resume"
    severity: warning
    description: |
      When resuming work after context compaction or new session:
      1. Call hsa_session with include_anchors=true
      2. Review all saved anchors before making changes
      3. Verify anchors are still current — update intent if needed

  - id: CTX-004
    name: "Preserve Hierarchy on Compaction"
    severity: warning
    description: |
      When session context is running low:
      1. Call hsa_session to get current hierarchy state
      2. Mark completed items with hsa_session
      3. Anchors and hierarchy persist in session-state.json automatically

  - id: CTX-005
    name: "Verifiable Context Gate"
    severity: warning
    description: |
      Before ANY code implementation, pass through verifiable context gate.
      Each step produces visible output — agent cannot silently skip.

      Step 1 ANCHORS: hsa_session(include_anchors: true)
        → List anchors found. If 0 and not first session → proceed with caution
      Step 2 SEARCH: hsa_search(query: '{task description}')
        → Must find ≥1 relevant file. If 0 results → widen query before proceeding
      Step 3 DRY: hsa_search(query: '{function/component name}')
        → Log result: "DRY: clear" or "DRY: found similar at {file}:{line}"
      Step 4 SKILLS: hsa_search(action: 'skills', query: '{task domain}')
        → List matched skills. At least 1 should match
      Step 5 INTENT: Verify hsa_session intent is declared
        → If no active intent → declare one before proceeding

      On gate fail (steps 1-5 insufficient): ask user for context before coding.
      See also: read-before-write module for per-file enforcement.

  - id: CTX-006
    name: "Cross-Session Bridge"
    severity: info
    description: |
      At session boundaries, create a bridge anchor:
        hsa_session({
          content: "[SESSION] Topic: X. Done: list. Pending: list. Files: key files.",
          category: "context"
        })
      On resume: hsa_session(include_anchors: true) → read bridge → declare intent.
      This ensures continuity across sessions without re-debating decisions.

integration:
  tier: 2
  related_modules:
    - session-governance
    - drift-prevention
    - read-before-write
