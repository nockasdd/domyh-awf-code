# Language Rule v6.3.2
---
name: language
version: "7.0.0"
rule_id: "MOD-LNG-001"

description: "Language and i18n rules for multilingual agent responses."
category: "communication"

context:
  always_apply: true

# --- LANGUAGE DETECTION ---

detection:
  source: ".agent/memory/state.json → preferences.language"
  default: "vi-VN"
  i18n_file: ".agent/i18n/{lang}.yaml"
  fallback: "Use professional tone in detected language if i18n file missing"

# --- RESPONSE RULES ---

response:
  - "Match user's language — if they write in English, respond in English"
  - "Technical terms stay in English (e.g., API, endpoint, middleware)"
  - "Code comments follow the project's existing language convention"
  - "Error messages and logs should be in English for consistency"

# --- BILINGUAL SUPPORT (vi-VN) ---

vietnamese:
  tone: "Professional, friendly, concise"
  technical_terms: "Keep English technical terms (không dịch: API, server, database)"
  format: "Use Vietnamese for explanations, English for code/commands"

integration:
  tier: 1

---
_DOMYH Awesome Code • Language Rule_
