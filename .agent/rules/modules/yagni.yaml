# YAGNI Enforcement Rule v6.3.9
---
name: yagni
version: "6.3.9"
rule_id: "MOD-YAG-001"

description: "You Aren't Gonna Need It — prevent premature abstraction and over-engineering."
category: "quality"

context:
  always_apply: true
  personas: ["developer", "planner"]

# --- CORE PRINCIPLE ---

principle: "Build only what is explicitly requested. Defer everything else."

# --- YAGNI VIOLATIONS ---

violations:
  - name: "Premature Abstraction"
    signs:
      [
        "Creating interfaces before second implementation",
        "Generic factory for single type",
        "Abstract base for one subclass",
      ]
    fix: "Start concrete, abstract when pattern emerges (Rule of Three)"

  - name: "Speculative Generality"
    signs:
      [
        "Adding parameters 'for future use'",
        "Building plugin system before need",
        "Supporting formats not yet required",
      ]
    fix: "Implement only current requirements. Future is uncertain."

  - name: "Gold Plating"
    signs:
      [
        "Adding features not requested",
        "Over-optimizing before profiling",
        "Building admin UI before core logic",
      ]
    fix: "Ship the simplest working solution first."

  - name: "Premature Optimization"
    signs:
      [
        "Caching before measuring",
        "Async before bottleneck identified",
        "Custom data structures for small data",
      ]
    fix: "Measure first, optimize only proven bottlenecks."

# --- ALLOWED EXCEPTIONS ---

exceptions:
  - "Security hardening — always apply regardless of request"
  - "Error handling — always handle errors properly"
  - "Accessibility — always build accessible UIs"
  - "Data validation — always validate inputs"

# --- DECISION FRAMEWORK ---

decision:
  ask: "Is this explicitly in the requirements?"
  yes: "Build it with the simplest approach that works"
  no: "Skip it — document as future consideration if relevant"

integration:
  tier: 2
  related_modules: ["quality", "stop-conditions"]

---
_DOMYH Awesome Code • YAGNI Enforcement Rule_
