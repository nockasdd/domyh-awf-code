# Behavioral Patterns v7.1.0
# Anti-pattern examples for LLM reasoning improvement
# Source: andrej-karpathy-skills (forrestchang) reasoning analysis
# Adds concrete BAD/GOOD code examples to DOMYH rule system
---
name: behavioral-patterns
rule_id: "MOD-BEH-001"

description: |
  Concrete anti-pattern examples that teach LLMs to recognize and avoid
  common reasoning failures. Each anti-pattern shows BAD behavior
  (what LLMs commonly do wrong) and GOOD behavior (correct approach).
  Based on karpathy-skills contrastive learning pattern.

category: "quality"

context:
  always_apply: true
  personas: ["*"]
  trigger: "On every code implementation, refactor, or fix task"

# ═══ THINK BEFORE CODING ANTI-PATTERNS ═══

think_before_coding:

  - id: TC-001
    name: "Silent Assumption Imposition"
    severity: high
    signs:
      - "Implements feature immediately without asking scope"
      - "Assumes all/filtered data, file location, format, fields"
      - "Picks interpretation and runs with it"
    bad_example: |
      User: "Add export feature"
      Agent: Implements export of ALL users to /tmp/users.csv
      Violation: Assumed scope (all), location (/tmp), format (CSV), fields (all)
      Result: Wrong scope, wrong location, wrong format
    good_example: |
      User: "Add export feature"
      Agent: "Before implementing, I need to clarify:
      1. Scope: export all users or filtered subset? (privacy implications)
      2. Format: browser download, email attachment, or API response?
      3. Fields: which user fields? (some might be sensitive)
      4. Volume: how many users typically? (affects approach)
      Simplest approach: API endpoint returning paginated JSON.
      Would need more info for file-based exports."
    self_check: "Did I list all assumptions before implementing?"

  - id: TC-002
    name: "Hidden Tradeoff Suppression"
    severity: medium
    signs:
      - "Chooses technology/pattern without explaining why not alternatives"
      - "Doesn't mention tradeoffs, costs, or constraints"
      - "Presents as obvious when multiple valid options exist"
    bad_example: |
      User: "What database should I use?"
      Agent: "We'll use MongoDB." (never explains why not PostgreSQL)
      Violation: Hidden tradeoff, no alternatives presented
      Result: User may have preferred PostgreSQL for their use case
    good_example: |
      User: "What database should I use?"
      Agent: "'Make search faster' could mean:
      1. Faster response time (<100ms) — add indexes, cache frequent
      2. Handle more concurrent searches — add async/await, connection pooling
      3. Faster perceived speed — show partial results immediately
      Current search takes ~500ms. Which aspect matters most for your use case?"
    self_check: "Did I surface at least one tradeoff or alternative?"

  - id: TC-003
    name: "Silent Specification Drift"
    severity: high
    signs:
      - User says simple X but agent builds full-featured X
      - "Scope expands during implementation without asking"
      - "Adds features not explicitly requested"
    bad_example: |
      User: "Add a simple login"
      Agent: Implements OAuth2, MFA, session management, password reset
      Violation: 'Simple' interpreted as full-featured auth system
      Result: 10x more code than intended, security surface area increased
    good_example: |
      User: "Add a simple login"
      Agent: "By 'simple login' I'll implement:
      - Email + password authentication
      - Session cookie
      - Basic redirect on success
      Expanding to OAuth/MFA/password-reset would add ~500 LOC.
      Want me to scope it that way or keep it minimal?"
    self_check: "Did I confirm scope matches user's intent?"

# ═══ SIMPLICITY FIRST ANTI-PATTERNS ═══

simplicity_first:

  - id: SF-001
    name: "Strategy Pattern for Single Discount"
    severity: medium
    signs:
      - "Creates interfaces/abstracts before second implementation exists"
      - "Factory pattern for single type"
      - "Abstract base for one concrete class"
    bad_example: |
      # User: "Add a function to calculate discount"
      class DiscountStrategy(ABC):
        @abstractmethod
        def calculate(self, amount: float) -> float: pass

      class PercentageDiscount(DiscountStrategy):
        def __init__(self, percentage: float): self.percentage = percentage
        def calculate(self, amount: float) -> float:
          return amount * (self.percentage / 100)

      # Requires 30+ lines of setup for simple calculation
    good_example: |
      # User: "Add a function to calculate discount"
      def calculate_discount(amount: float, percent: float) -> float:
        """Calculate discount amount. percent should be 0-100."""
        return amount * (percent / 100)

      # Usage
      discount = calculate_discount(100.0, 10.0)  # $10 off
    self_check: "Would a senior engineer say this is overcomplicated?"

  - id: SF-002
    name: "Speculative Feature Addition"
    severity: high
    signs:
      - "Adds caching before measuring"
      - "Adds validation/extraction/notification that wasn't asked"
      - "Building plugin system before need"
    bad_example: |
      # User: "Save user preferences to database"
      def save_preferences(db, user_id, prefs, merge=True, validate=True,
                           notify=False):
        # 30+ lines of speculative features nobody asked for
        if validate: errors = validator.validate(prefs)
        if notify: notify_preference_change(user_id, prefs)
        # ...
    good_example: |
      # User: "Save user preferences to database"
      def save_preferences(db, user_id, preferences):
        db.execute(
          "UPDATE users SET preferences = ? WHERE id = ?",
          (json.dumps(preferences), user_id)
        )
      # Add caching/validation/merging IF AND WHEN performance/requirements demand it
    self_check: "Is this feature explicitly requested or speculative?"

  - id: SF-003
    name: "Premature Optimization"
    severity: medium
    signs:
      - "Caching before measuring"
      - "Async before bottleneck identified"
      - "Custom data structures for small data"
    bad_example: |
      # User: "Fetch user data"
      @lru_cache(maxsize=1000)
      async def get_user(user_id):
        # 200 lines of optimization for 10 users
        ...
    good_example: |
      # User: "Fetch user data"
      def get_user(user_id):
        return db.query("SELECT * FROM users WHERE id = ?", user_id)
      # Profile first. Add cache only if measurably slow.
    self_check: "Have I measured this bottleneck before optimizing?"

# ═══ SURGICAL CHANGES ANTI-PATTERNS ═══

surgical_changes:

  - id: SC-001
    name: "Scope Creep in Bug Fix"
    severity: critical
    signs:
      - "Refactors entire module while fixing single bug"
      - "Improves adjacent code while fixing unrelated issue"
      - "Adds new features during bug fix"
    bad_example: |
      # User: "Fix the bug where empty emails crash the validator"
      # Agent diff:
      - if not user_data.get('email'):
      + email = user_data.get('email', '').strip()
      + # Improved email regex
      + if '@' not in email or '.' not in email.split('@')[1]:
      + # Also fix username validation (was 'ugly')
      + if not username.isalnum(): raise ValueError("Username invalid")
      Violation: Expanded email validation AND added username validation
      Result: Two bugs fixed in one PR, harder to review
    good_example: |
      # User: "Fix the bug where empty emails crash the validator"
      # Agent diff:
      - if not user_data.get('email'):
      + email = user_data.get('email', '')
      + if not email or not email.strip():
           raise ValueError("Email required")
         # Existing code below unchanged
    self_check: "Does every changed line trace directly to the user's request?"

  - id: SC-002
    name: "Style Imposition"
    severity: medium
    signs:
      - "Changes quote style ('' to \"\")"
      - "Adds type hints nobody asked for"
      - "Reformats whitespace, spacing, line breaks"
      - "Adds/removes docstrings as side effect"
    bad_example: |
      # User: "Add logging to upload function"
      # Agent diff:
      - def upload_file(file_path, destination):
      + def upload_file(file_path: str, destination: str) -> bool:
      +     """Upload file to destination with logging."""
      -         with open(file_path, 'rb') as f:
      +         with open(file_path, "rb") as f:
      -         response = requests.post(destination, files={'file': data})
      +         response = requests.post(destination, files={"file": data})
      +     # Added docstring, type hints, changed quotes — not asked for
    good_example: |
      # User: "Add logging to upload function"
      # Agent diff:
      - def upload_file(file_path, destination):
      + def upload_file(file_path, destination):
          try:
              with open(file_path, 'rb') as f:
                  data = f.read()
              response = requests.post(destination, files={'file': data})
              if response.status_code == 200:
                  return True
          except Exception as e:
              print(f"Error: {e}")  # Original style preserved
              return False
    self_check: "Did I preserve existing style conventions exactly?"

  - id: SC-003
    name: "Cleanup Overreach"
    severity: medium
    signs:
      - "Deletes unused functions not related to task"
      - "Removes 'ugly' code not in scope"
      - "Deletes code from other developers"
    bad_example: |
      # User: "Add new endpoint"
      # Agent: Also removes old endpoint that 'nobody uses'
      # Agent: Also removes utility function that 'looks wrong'
      Violation: Touching code outside task scope
      Result: Breaking other parts of the system
    good_example: |
      # User: "Add new endpoint"
      # Agent: Adds only the new endpoint
      # If dead code noticed: "I noticed `old_function` appears unused.
      # Want me to remove it?" (mention, don't delete)
    self_check: "Is this code I created unused, or pre-existing?"

  - id: SC-004
    name: "New File Proliferation"
    severity: low
    signs:
      - "Creates 5+ files when 1 would suffice"
      - "Splits single logical unit into multiple files"
      - "Creates helper files for trivial operations"
    bad_example: |
      # User: "Add validation for email"
      # Agent creates: validators/base.py, validators/email.py,
      # validators/schemas.py, validators/errors.py, validators/__init__.py
      # For a 5-line email validation function
    good_example: |
      # User: "Add validation for email"
      # Agent: Adds email validation to existing validators.py
      # Or if no validators.py: creates single validators/email.py
    self_check: "Could this be a function in an existing file?"

# ═══ GOAL-DRIVEN EXECUTION ANTI-PATTERNS ═══

goal_driven:

  - id: GD-001
    name: "Unverifiable Completion"
    severity: high
    signs:
      - "Reports 'Fixed the bug' without showing verification"
      - "Claims 'Code should work' without testing"
      - "Says 'Implemented' without evidence"
    bad_example: |
      Agent: "Fixed the authentication bug. The code should work now."
      (No test shown, no verification evidence)
    good_example: |
      Agent: "Fixed the authentication bug. Verified by:
      - Test: `test_login_valid_user` passes
      - Test: `test_login_invalid_password` returns 401
      - Manual: curl to /auth/login with valid creds returns 200
      - Regression: existing auth tests still pass"
    self_check: "What evidence can I show that this actually works?"

  - id: GD-002
    name: "Vague Multi-Step Plan"
    severity: medium
    signs:
      - "Plan without verifiable checkpoints"
      - "Steps like 'implement X' without 'verify Y'"
      - "No criteria for 'done'"
    bad_example: |
      # User: "Add rate limiting to the API"
      Agent: "I'll:
      1. Review the code
      2. Identify the best approach
      3. Implement rate limiting
      4. Test the changes"
      (What does 'test' mean? What is 'done'?)
    good_example: |
      # User: "Add rate limiting to the API"
      Plan:
      1. Add basic in-memory rate limiting (single endpoint)
         Verify: curl endpoint 11 times → 10 succeed, 11th gets 429
      2. Extract to middleware (apply to all endpoints)
         Verify: /users and /posts both rate-limited, existing tests pass
      3. Add Redis backend (multi-server support)
         Verify: Rate limit persists across app restarts
      Each step independently verifiable and deployable.
    self_check: "Does each step have a specific verification criterion?"

  - id: GD-003
    name: "Fix Without Reproducing"
    severity: critical
    signs:
      - "Changes code without first writing failing test"
      - "Assumes bug cause without verification"
      - "Doesn't isolate the bug"
    bad_example: |
      # User: "The sorting breaks with duplicate scores"
      Agent: Immediately changes sort logic
      (No test written, no reproduction attempt)
    good_example: |
      # User: "The sorting breaks with duplicate scores"
      1. Write test that reproduces:
         scores = [{name:'A',score:100}, {name:'B',score:100}, {name:'C',score:90}]
         Run test 10x → fails with inconsistent ordering
      2. Now fix with stable sort:
         sorted(scores, key=lambda x: (-x['score'], x['name']))
      3. Test passes consistently
    self_check: "Can I write a test that reproduces this before fixing?"

# ═══ INTEGRATION ═══

integration:
  tier: 2
  related_modules:
    - yagni
    - edit-verification
    - proportional-response
    - drift-prevention
    - stop-conditions
  referenced_by:
    - SACRED_RULES.xml (via surgical changes enforcement)
    - workflows/code.md (PLAN step)
    - workflows/think.md (anti-pattern recognition)
