# 🔧 Modular Rule: Reflection Integration

> Self-improvement through reflection patterns
> version: 6.2.3

---

## Overview

This modular rule integrates reflection capabilities into the agent's workflow,
enabling learning from both successes and failures.

---

## Configuration

```yaml
name: reflection
version: "6.2.6"
category: improvement
priority: 2

# Dependencies
dependencies:
  requires:
    - evidence  # Need evidence to reflect on
  enhances:
    - quality
    - context-management
  conflicts_with: []

# Applicability
context:
  always_apply: false  # Activated on triggers
  personas: ["*"]
  workflows: ["*"]
```

---

## Reflection Triggers

```yaml
triggers:
  # Automatic reflection
  auto:
    on_error:
      condition: "user_correction OR task_failure"
      action: "analyze_error"
      template: "templates/reflection/error_analysis.md"
      
    on_success:
      condition: "user_satisfaction OR task_complete"
      action: "analyze_success"
      template: "templates/reflection/success_analysis.md"
      
    on_uncertainty:
      condition: "confidence < 70%"
      action: "self_critique"
      template: "templates/reflection/critic.md"

  # Manual reflection
  manual:
    command: "/reflect"
    action: "full_reflection_cycle"
```

---

## Reflection Process

```yaml
process:
  pre_output:
    name: "Self-Critique"
    when: "Before delivering significant output"
    template: "templates/reflection/critic.md"
    questions:
      - "Does this address the user's actual request?"
      - "Is the information accurate and verified?"
      - "Are there missing edge cases?"
      - "Could this cause unintended consequences?"
    action_on_fail: "revise_before_output"

  post_error:
    name: "Error Analysis"
    when: "User corrects or task fails"
    template: "templates/reflection/error_analysis.md"
    steps:
      1_identify: "What specifically went wrong?"
      2_cause: "Why did it happen? (5 Whys)"
      3_classify: "What type of error?"
      4_learn: "What pattern to avoid?"
      5_store: "Save to patterns/errors.json"

  post_success:
    name: "Success Reinforcement"
    when: "User satisfied or task succeeds"
    template: "templates/reflection/success_analysis.md"
    steps:
      1_identify: "What worked well?"
      2_extract: "What pattern to replicate?"
      3_generalize: "How to apply elsewhere?"
      4_store: "Save to patterns/successes.json"
```

---

## Pattern Storage

```yaml
storage:
  errors:
    file: "patterns/errors.json"
    schema:
      id: "ERR-XXX"
      name: "descriptive_name"
      trigger: "What situation triggers this"
      wrong_action: "What was done incorrectly"
      correct_action: "What should be done"
      detection_rule: "How to recognize this"
      severity: "P0-P3"
      occurrences: 0
      last_seen: "ISO8601"

  successes:
    file: "patterns/successes.json"
    schema:
      id: "SUC-XXX"
      name: "descriptive_name"
      context: "When this applies"
      approach: "Steps that worked"
      key_elements: "Critical factors"
      success_rate: 0.0
      uses: 0
      last_used: "ISO8601"
```

---

## Integration Points

```yaml
integration:
  # Load patterns at task start
  on_task_start:
    - "Load patterns/errors.json"
    - "Load patterns/successes.json"
    - "Match context to known patterns"
    - "Apply relevant learnings"

  # Check patterns during execution
  during_execution:
    - "Compare current approach to error patterns"
    - "If match found, apply prevention"
    - "Compare to success patterns"
    - "If match found, follow proven approach"

  # Update patterns at end
  on_task_end:
    - "Analyze outcome"
    - "Update relevant patterns"
    - "Save to storage"
```

---

## Confidence Thresholds

```yaml
confidence:
  thresholds:
    high: 90  # Very confident, proceed
    medium: 70  # Mostly confident, note caveats
    low: 50  # Uncertain, request verification
    critical: 30  # Very uncertain, stop and research

  actions:
    below_critical:
      - "Stop current approach"
      - "Request more information"
      - "Research before continuing"
      
    below_low:
      - "Add uncertainty markers"
      - "Suggest verification steps"
      - "Offer alternatives"
```

