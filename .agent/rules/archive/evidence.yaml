# Evidence Rule v6.0
# Modular rule for evidence-based claims

---
name: evidence
version: "6.2.5"
rule_id: "MOD-EVD-001"

# =============================================================================
# RULE METADATA
# =============================================================================

description: |
  Rules for ensuring all claims and findings are backed by evidence.
  Critical for auditing, debugging, and code review workflows.

category: "quality"

# =============================================================================
# CONTEXT APPLICATION
# =============================================================================

context:
  always_apply: false
  personas: ["auditor", "debugger", "security", "researcher"]
  workflows: ["/ap", "/debug", "/review", "/security"]

# =============================================================================
# CORE PRINCIPLES
# =============================================================================

principles:
  claim_evidence_linking:
    description: "Every claim must have supporting evidence"
    format: "Claim → Evidence → Location"

  source_citation:
    description: "Cite sources for external information"
    types:
      - "file:line for code"
      - "URL for web sources"
      - "command output for runtime"

  confidence_levels:
    description: "Indicate certainty of findings"
    levels:
      high: "Confirmed with evidence"
      medium: "Strong indicators"
      low: "Suspected, needs verification"

# =============================================================================
# EVIDENCE TYPES
# =============================================================================

evidence_types:
  code_evidence:
    format: |
      **File:** `path/to/file:45`
      **Code:**
      ```language
      // The relevant code
      ```
    required_for:
      - Bug reports
      - Security findings
      - Refactoring suggestions

  log_evidence:
    format: |
      **Log:** `[TIMESTAMP] [LEVEL] message`
      **Source:** Log file or console
    required_for:
      - Runtime errors
      - Performance issues
      - Debugging

  test_evidence:
    format: |
      **Test:** `test_name`
      **Result:** Pass/Fail
      **Output:** ...
    required_for:
      - Bug fixes
      - Regression reports
      - Coverage claims

  metrics_evidence:
    format: |
      **Metric:** metric_name
      **Value:** X
      **Source:** tool/command
    required_for:
      - Performance findings
      - Coverage reports
      - Quality assessments

# =============================================================================
# SPECIFIC RULES
# =============================================================================

rules:
  file_line_required:
    rule: "All code findings must include file:line reference"
    example: "src/auth/service.ts:45"
    validation: "^[a-zA-Z0-9_./-]+:[0-9]+$"

  code_snippet_required:
    rule: "Include relevant code snippet for findings"
    min_context: "3 lines"
    max_context: "10 lines"

  no_speculation:
    rule: "Don't claim issues not confirmed by evidence"
    allowed: "Suggest investigation areas"
    not_allowed: "Assert bugs without proof"

  source_freshness:
    rule: "Verify sources are current"
    for_code: "Use current file state"
    for_docs: "Note if docs may be outdated"

# =============================================================================
# TEMPLATES
# =============================================================================

templates:
  finding:
    format: |
      ## [Severity] [Title]

      **File:** `{file}:{line}`
      **Confidence:** {high|medium|low}

      **Evidence:**
      ```{language}
      {code_snippet}
      ```

      **Issue:** {description}
      **Impact:** {impact}
      **Recommendation:** {fix}

  claim:
    format: |
      {claim} (Source: `{source}`)

# =============================================================================
# VALIDATION
# =============================================================================

validation:
  pre_output:
    - "All findings have file:line references"
    - "Code snippets are current (not fabricated)"
    - "Confidence levels are appropriate"

  disallow:
    - "Findings without evidence"
    - "Fabricated code snippets"
    - "Unverified external claims"

# =============================================================================
# INTEGRATION
# =============================================================================

integration:
  hsa_tools:
    hsa_get_context:
      purpose: "Gather code context as evidence for findings"
      usage: "hsa_get_context files=[target] → retrieve relevant code snippets"
    hsa_search_skills:
      purpose: "Find best-practice patterns to validate claims"
      usage: "hsa_search_skills query=[topic] → cross-reference against skill knowledge"

  reflection:
    enabled: true
    check_before: "output"
    questions:
      - "Is every claim backed by evidence?"
      - "Are file:line references accurate?"
      - "Are code snippets from the actual file?"
      - "Did I use HSA context for deeper evidence?"

---
_DOMYH Awesome Code • Evidence Rule_
