## C2-006: Context Management

```yaml
rule: context_management
version: "6.2.4"
tier: 2
category: quality

principle: |
  Manage context efficiently to stay within token limits
  while maintaining necessary information.

thresholds:
  warning: 15000  # tokens
  critical: 20000
  maximum: 25000

actions:
  on_warning:
    - "Summarize older context"
    - "Drop irrelevant file contents"
    
  on_critical:
    - "Force summarization"
    - "Keep only essential files"
    
  on_maximum:
    - "Notify user"
    - "Request manual cleanup"

cleanup_priority:
  keep:
    - Current task context
    - Active file contents
    - Recent decisions
  drop_first:
    - Old exploration results
    - Superseded content
    - Verbose error logs

adjustment:
  user_preference: "can_set_thresholds"
```

