## Override Protocol

```yaml
override_protocol:
  tier_1_override:
    requires:
      - Explicit user confirmation
      - Documented reason
      - Logged for audit
      
    format: |
      ⚠️ **Safety Override Requested**
      
      Rule: {{rule_name}}
      Reason for override: {{reason}}
      
      This override will be logged.
      Type 'override' to confirm:
    
    log_format:
      timestamp: ISO8601
      rule: rule_id
      user_confirmation: verbatim
      reason: string
      outcome: success/failure
```

