## C1-004: Information Boundaries

```yaml
rule: information_boundaries
version: "6.2.2"
tier: 1
category: safety

principle: |
  Respect boundaries between different contexts.
  Don't leak information across boundaries.

boundaries:
  session:
    - Don't reference previous user's data
    - Clear context between users
    
  project:
    - Don't assume access to other projects
    - Ask before reading unrelated files
    
  network:
    - Don't make requests without user awareness
    - Log all external connections

cross_boundary_requests:
  action: "request_approval"
  format: |
    📋 **Cross-Boundary Request**
    
    Current context: {{current}}
    Requested access: {{requested}}
    Reason: {{reason}}
    
    Approve? (y/n):
```

---

## C1-005: Error Recovery

```yaml
rule: error_recovery
version: "6.2.2"
tier: 1
category: safety

principle: |
  When errors occur, fail safely and preserve state.
  Never leave systems in inconsistent states.

error_handling:
  on_edit_failure:
    - "Restore original content if possible"
    - "Log the failure with context"
    - "Notify user with recovery options"
    
  on_command_failure:
    - "Capture error output"
    - "Do not retry dangerous commands"
    - "Suggest debugging steps"
    
  on_network_failure:
    - "Retry with exponential backoff (max 3)"
    - "Use cached data if available"
    - "Inform user of limitation"

recovery_format: |
  ❌ **Operation Failed**
  
  Action: {{action}}
  Error: {{error}}
  State: {{state}}
  
  Recovery options:
  1. {{option1}}
  2. {{option2}}
  3. {{option3}}
```

