# Skills Customization Configuration
# DOMYH Awesome Code  - Deep Interview + Auto Test Loop
# NOTE: Sync version from core/VERSION.yaml

# =============================================================================
# PROJECT-LEVEL SKILL CONFIGURATION
# =============================================================================

# Override default skill behavior for this project
project:
  name: auto
  install_mode: project # global | project — required by SACRED_RULES ENV_001

# =============================================================================
# INTERNATIONALIZATION (v6.4.5)
# =============================================================================

i18n:
  default: "vi" # Vietnamese — synced from state.json
  fallback: "en" # Fallback if key missing
  strings_path: "./i18n/" # Translation files location

# =============================================================================
# SKILL LOADING
# =============================================================================

skills:
  # Loading strategy: progressive | eager | lazy
  loading: progressive

  # Maximum skills active at once
  max_active: 3

  # Cache TTL in seconds
  cache_ttl: 3600

  # Always preload these skills (T2)
  preload:
    - security

  # Disable specific skills for this project
  disabled: []

  # Priority overrides (lower = higher priority)
  priority_override:
    # my-skill: 0

  # v6.4.5: Auto-suggest configuration
  auto_suggest:
    enabled: true
    display_top: 3
    show_on_session_start: true

# =============================================================================
# PRIVATE SKILLS
# =============================================================================

private:
  # Path to private skills (relative to .agent/)
  path: ./private/

  # Auto-discover and load private skill META.yaml
  auto_load: true

  # Private skills override public skills with same ID
  override_public: true

  # Private skill registry file
  registry: ./private/_index.yaml

# =============================================================================
# DETECTION RULES
# =============================================================================

detection:
  # Detect based on file extensions
  file_based: true

  # Detect based on content patterns
  pattern_based: true

  # Minimum confidence for auto-activation
  min_confidence: 0.30

  # Boost for recently used skills
  recency_boost: 0.15

# =============================================================================
# CONTEXT SETTINGS
# =============================================================================

context:
  # Total budget for ALL T1 META.yaml files (86 skills × ~100 tokens each)
  # Not to be confused with IDE baseline (runtime prompt overhead in ide/*.json)
  t1_budget: 8600

  # Maximum tokens per T2 skill
  t2_budget: 1500

  # Maximum total context (T1 + 3 active skills)
  max_context: 12700

  # Include project README in context
  include_readme: false

# =============================================================================
# NOTE: Engine-specific configs (token_management, context_cleanup,
# project_tracking, rules_engine) moved to core/archive/.
# These were aspirational specs with no backing runtime.
# See core/AGENT_BEHAVIOR.md for behavioral guidelines.
# =============================================================================
