name: nextjs
version: "6.2.2"
display: "Next.js Patterns"
category: frontend
tier: 1
priority: 2

desc: "Next.js 16+ development patterns (Oct 2025+). Turbopack default, Cache Components, React 19.2."

caps:
  - app-router
  - server-components
  - server-functions
  - caching-strategies
  - turbopack
  - edge-runtime

data_files:
  - data/core.yaml
  - data/caching.yaml
  - data/server.yaml

patterns:
  total: 16
  domains:
    core: 6
    caching: 5
    server: 5

    - search_nextjs_patterns
    - get_nextjs_route

triggers:
  file_patterns:
    - "next.config.js"
    - "next.config.mjs"
    - "next.config.ts"
    - "app/layout.tsx"
    - "app/page.tsx"
  keywords:
    # Core
    - nextjs
    - next.js
    - app router
    - server component
    - client component
    # Rendering
    - turbopack
    - use client
    - use server
    - server function
    # Caching
    - use cache
    - revalidateTag
    - revalidatePath
    - unstable_cache
    - isr
    # API
    - route handler
    - middleware
    - proxy.ts
    # React
    - react 19
    - useOptimistic
    - react compiler
  intents:
    - next.js app
    - server component
    - server function
    - next.js caching
    - next.js api

related_skills:
  - react
  - typescript
  - tailwind
  - prisma

prevent_confusion_with:
  - nuxt: "Next.js uses React, Nuxt uses Vue"
  - react: "Next.js is a React meta-framework with SSR/SSG"
