name: react-native
version: "6.2.3"
display: "React Native Patterns"
category: mobile
tier: 1
priority: 3

desc: "React Native 0.76-0.77+ development patterns (2025-2026). New Architecture default, Fabric, Turbo Modules, JSI."

caps:
  - new-architecture
  - fabric-renderer
  - turbo-modules
  - jsi-bridge
  - expo-router
  - platform-specific

data_files:
  - data/core.yaml
  - data/platform.yaml

patterns:
  total: 10
  domains:
    core: 5
    platform: 5

    - search_rn_patterns
    - get_rn_component

triggers:
  file_patterns:
    - "*.tsx"
    - "*.jsx"
    - "app.json"
    - "metro.config.js"
    - "react-native.config.js"
  keywords:
    # Core
    - react native
    - react-native
    - expo
    - expo router
    # Architecture
    - new architecture
    - fabric
    - turbo module
    - jsi
    - hermes
    # Platform
    - ios
    - android
    - platform specific
    # Navigation
    - react-navigation
    - stack navigator
    - tab navigator
  intents:
    - react native app
    - mobile app
    - ios android
    - expo app
    - native module

related_skills:
  - react
  - typescript
  - expo

prevent_confusion_with:
  - flutter: "React Native uses JavaScript/TypeScript, Flutter uses Dart"
  - react: "React Native is for mobile, React is for web"
