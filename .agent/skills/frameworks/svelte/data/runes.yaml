# Svelte Runes Patterns (Feb 2026)
# =============================================================================
# Svelte 5 reactivity: $state, $derived, $effect, $props

metadata:
  skill: svelte
  domain: runes
  version: "5.x"
  updated: "2026-02-05"
  patterns_count: 6

patterns:
  - id: sve001
    name: $state - Reactive State
    category: state
    version: "5.0+"
    description: Declare reactive state with automatic deep reactivity
    text: state reactive signal let rune svelte 5
    example: |
      <script>
        // 🆕 Svelte 5: $state replaces let
        let count = $state(0);
        let user = $state({ name: 'John', age: 30 });

        function increment() {
          count++;  // Reactive!
        }

        function updateName(name) {
          user.name = name;  // Deep reactivity
        }
      </script>

      <button onclick={increment}>
        Count: {count}
      </button>

      <!-- ✅ Deep reactivity for objects/arrays -->
      <script>
        let items = $state([{ name: 'Item 1', done: false }]);

        function toggle(index) {
          // ✅ This triggers reactive update automatically
          items[index].done = !items[index].done;
        }
      </script>
    severity: CRITICAL
    docs_url: https://svelte.dev/docs/svelte/$state

  - id: sve002
    name: $derived - Computed Values
    category: state
    version: "5.0+"
    description: Computed values that automatically update
    text: derived computed reactive calculated expression rune
    example: |
      <script>
        let firstName = $state('John');
        let lastName = $state('Doe');

        // 🆕 $derived replaces $:
        let fullName = $derived(`${firstName} ${lastName}`);

        // Complex derived with function
        let initials = $derived(() => {
          return `${firstName[0]}${lastName[0]}`.toUpperCase();
        });
      </script>

      <p>{fullName} ({initials})</p>

      <!-- ✅ Derived from arrays -->
      <script>
        let todos = $state([
          { text: 'Learn Svelte', done: true },
          { text: 'Build app', done: false },
        ]);

        let remaining = $derived(
          todos.filter(t => !t.done).length
        );
      </script>

      <p>{remaining} items remaining</p>
    severity: HIGH
    docs_url: https://svelte.dev/docs/svelte/$derived

  - id: sve003
    name: $effect - Side Effects
    category: lifecycle
    version: "5.0+"
    description: Run side effects when reactive values change
    text: effect side effect cleanup lifecycle mount unmount rune
    example: |
      <script>
        let count = $state(0);

        // 🆕 $effect replaces $: for side effects
        $effect(() => {
          console.log('Count changed:', count);

          // Return cleanup function
          return () => {
            console.log('Cleanup');
          };
        });

        // Run once after mount (like onMount)
        $effect(() => {
          const timer = setInterval(() => count++, 1000);
          return () => clearInterval(timer);
        });

        // Pre-effect (runs before DOM update)
        $effect.pre(() => {
          console.log('Before DOM update:', count);
        });
      </script>

      <!-- ✅ Track function for partial dependency -->
      <script>
        let user = $state({ name: 'John', age: 30 });

        $effect(() => {
          // Only runs when name changes, not age
          $effect.tracking(() => user.name);
          console.log('Name:', user.name);
        });
      </script>
    severity: HIGH
    docs_url: https://svelte.dev/docs/svelte/$effect

  - id: sve004
    name: $props - Component Props
    category: component
    version: "5.0+"
    description: Declare component props with destructuring
    text: props export let component input rune
    example: |
      <script>
        // 🆕 $props replaces export let
        let {
          name,
          age = 0,        // Default value
          onSave          // Event handler
        } = $props();
      </script>

      <div>
        <p>{name} is {age} years old</p>
        <button onclick={() => onSave?.({ name, age })}>
          Save
        </button>
      </div>

      <!-- ✅ TypeScript support -->
      <script lang="ts">
        interface Props {
          name: string;
          age?: number;
          onSave?: (data: { name: string; age: number }) => void;
        }

        let { name, age = 0, onSave }: Props = $props();
      </script>

      <!-- ✅ Rest props -->
      <script>
        let { name, ...rest } = $props();
      </script>
      <div {...rest}>{name}</div>
    severity: HIGH
    docs_url: https://svelte.dev/docs/svelte/$props

  - id: sve005
    name: $bindable - Two-way Binding
    category: component
    version: "5.0+"
    description: Enable parent binding to child prop
    text: bindable bind two-way binding parent child rune
    example: |
      <!-- TextInput.svelte -->
      <script>
        // Parent can bind to this
        let { value = $bindable('') } = $props();
      </script>

      <input bind:value />

      <!-- Usage in parent -->
      <script>
        import TextInput from './TextInput.svelte';
        let searchQuery = $state('');
      </script>

      <TextInput bind:value={searchQuery} />
      <p>Searching: {searchQuery}</p>

      <!-- ✅ Multiple bindable props -->
      <script>
        let {
          open = $bindable(false),
          selected = $bindable(null),
        } = $props();
      </script>
    severity: MEDIUM
    docs_url: https://svelte.dev/docs/svelte/$bindable

  - id: sve006
    name: $inspect - Debugging
    category: development
    version: "5.0+"
    description: Reactive console.log for development
    text: inspect debug console log development rune
    example: |
      <script>
        let count = $state(0);
        let user = $state({ name: 'Alice', age: 25 });

        // ✅ $inspect - reactive console.log for development
        $inspect(count);           // Logs whenever count changes
        $inspect(user).with(fn);   // Custom handler

        // ✅ Chainable with custom handlers
        $inspect(user).with((type, newVal, oldVal) => {
          console.log(`${type}: ${oldVal} → ${newVal}`);
        });

        // ⚠️ $inspect is REMOVED in production builds
        // No performance impact in prod
      </script>

      <!-- ✅ Inspect multiple values -->
      <script>
        $inspect({ count, user });
      </script>
    severity: LOW
    docs_url: https://svelte.dev/docs/svelte/$inspect
