name: svelte
version: "6.2.5"
display: "Svelte & SvelteKit Patterns"
category: frontend
tier: 1
priority: 3

desc: "Svelte 5.x / SvelteKit 2.x development patterns (Feb 2026). Runes stable, async SSR, CSP hydration, deep reactivity."

caps:
  - runes-reactivity
  - sveltekit-routing
  - form-actions
  - ssr-csp
  - snippets
  - deep-reactivity

data_files:
  - data/runes.yaml
  - data/sveltekit.yaml

patterns:
  total: 12
  domains:
    runes: 6
    sveltekit: 6

    - search_svelte_patterns
    - get_svelte_component

triggers:
  file_patterns:
    - "svelte.config.js"
    - "*.svelte"
    - "+page.svelte"
    - "+layout.svelte"
    - "+page.ts"
    - "+page.server.ts"
  keywords:
    # Runes
    - svelte
    - "$state"
    - "$derived"
    - "$effect"
    - "$props"
    - "$bindable"
    - "$inspect"
    - runes
    # SvelteKit
    - sveltekit
    - load function
    - form action
    - enhance
    - "+page"
    - "+layout"
    # Features
    - snippet
    - "@render"
    - async ssr
    - csp
  intents:
    - svelte component
    - svelte runes
    - sveltekit page
    - svelte form
    - svelte state

related_skills:
  - typescript
  - tailwind
  - vite

prevent_confusion_with:
  - vue: "Svelte uses compilation, Vue uses virtual DOM"
  - react: "Svelte uses runes, React uses hooks"
