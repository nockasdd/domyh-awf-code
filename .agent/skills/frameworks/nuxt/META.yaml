name: nuxt
version: "6.2.6"
display: "Nuxt Framework Patterns"
category: frontend
tier: 1
priority: 2

desc: "Nuxt 4 development patterns (4.0 Jul 2025, latest 4.3.1). App directory, smart data fetching, Nitro server."

caps:
  - ssr-ssg-hybrid
  - file-based-routing
  - auto-imports
  - server-api
  - nitro-engine
  - data-fetching

data_files:
  - data/core.yaml
  - data/server.yaml

patterns:
  total: 11
  domains:
    core: 6
    server: 5

    - search_nuxt_patterns
    - get_nuxt_composable

triggers:
  file_patterns:
    - "nuxt.config.ts"
    - "nuxt.config.js"
    - "app.vue"
    - "pages/*.vue"
    - "server/api/*.ts"
  keywords:
    # Core
    - nuxt
    - nuxt.js
    - useAsyncData
    - useFetch
    - definePageMeta
    - NuxtLink
    # Server
    - nitro
    - defineEventHandler
    - useRuntimeConfig
    - server/api
    # Features
    - auto-import
    - file-based routing
    - layouts
    - middleware
  intents:
    - nuxt app
    - nuxt page
    - nuxt api
    - nuxt server
    - vue fullstack

related_skills:
  - vue
  - typescript
  - nitro
  - tailwind

prevent_confusion_with:
  - nextjs: "Nuxt uses Vue, Next.js uses React"
  - vue: "Nuxt is a Vue meta-framework with SSR/SSG"
