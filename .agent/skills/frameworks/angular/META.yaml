name: angular
version: "6.4.5"
display: "Angular Patterns"
category: frontend
tier: 1
priority: 3

desc: "Angular 20.2/21/22 development patterns (2025-2026). Signals-first, standalone, zoneless-stable."

caps:
  - signals-system
  - standalone-components
  - zoneless-change-detection
  - incremental-hydration
  - ssr-hydration
  - dependency-injection

data_files:
  - data/core.yaml
  - data/server.yaml
  - data/performance.yaml

patterns:
  total: 15
  domains:
    core: 6
    server: 4
    performance: 5

    - search_angular_patterns
    - get_angular_component

triggers:
  file_patterns:
    - "angular.json"
    - "*.component.ts"
    - "*.module.ts"
    - "*.service.ts"
  keywords:
    # Core
    - angular
    - "@angular/core"
    - component
    - standalone component
    # Signals
    - signal
    - computed
    - effect
    - input signal
    - model signal
    # Control Flow
    - "@if"
    - "@for"
    - "@defer"
    - "@switch"
    # SSR
    - hydration
    - zoneless
    - provideZonelessChangeDetection
    - incremental hydration
    - route rendering
    # DI
    - inject
    - providedIn
    - dependency injection
    # Routing
    - router
    - routes
    - lazy loading
  intents:
    - angular component
    - angular signal
    - angular ssr
    - angular zoneless
    - angular performance

related_skills:
  - typescript
  - tailwind
  - rxjs

prevent_confusion_with:
  - react: "Angular uses signals + DI, React uses hooks"
  - vue: "Angular is enterprise-focused with full framework"
