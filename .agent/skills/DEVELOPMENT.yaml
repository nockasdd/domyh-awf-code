# DOMYH Awesome Code — Skill Development Guide
# How to create and maintain skills
# Version: 6.2.1

# =============================================================================
# 📋 OVERVIEW
# =============================================================================

# Skills provide language/framework-specific patterns and best practices.
# They use a 3-tier Progressive Disclosure system for token efficiency.

# =============================================================================
# 🏗️ SKILL STRUCTURE
# =============================================================================

structure:
  description: "Each skill folder contains 3 files"

  files:
    META.yaml:
      purpose: "Tier 1 - Always loaded metadata"
      size: "~100 tokens"
      contents:
        - name # Skill identifier
        - display # Human-readable name
        - category # Classification
        - priority # Loading priority (0=highest)
        - desc # Brief description
        - keywords # Trigger keywords
        - detect # File patterns for auto-detection
        - caps # Core capabilities

    SKILL.md:
      purpose: "Tier 2 - On-demand patterns"
      size: "~1,500 tokens"
      contents:
        - Core patterns with examples
        - Project structure recommendations
        - Checklists for verification

    ADVANCED.md:
      purpose: "Tier 3 - Reference only"
      size: "~4,000 tokens"
      contents:
        - Deep dive patterns
        - Edge cases
        - Performance optimizations
        - Troubleshooting guides

# =============================================================================
# 🔄 CREATION WORKFLOW
# =============================================================================

workflow:
  steps:
    1_create_folder:
      action: "Create folder in skills/"
      naming: "lowercase, hyphen-separated"
      example: "skills/new-skill/"

    2_write_meta:
      action: "Create META.yaml"
      template: |
        name: new-skill
        display: New Skill Name
        category: language  # or framework, devops, cross-cutting
        priority: 2
        desc: "Brief description under 80 chars"
        keywords:
          - keyword1
          - keyword2
        detect: ["*.ext", "config.file"]
        caps:
          - Core capability 1
          - Core capability 2
      validation:
        - Under 500 bytes
        - All required fields present
        - Description under 80 chars

    3_write_skill:
      action: "Create SKILL.md"
      sections:
        - "Frontmatter (name, detect)"
        - "# Title"
        - "## Project Structure"
        - "## Core Patterns"
        - "## Checklist"
      validation:
        - Under 150 lines
        - Has checklist
        - Has code examples

    4_write_advanced:
      action: "Create ADVANCED.md (optional but recommended)"
      sections:
        - "# DOMYH Awesome Code  — Tier 3 Reference"
        - "## Overview"
        - "## Advanced Patterns"
        - "## Edge Cases"
        - "## Troubleshooting"
      validation:
        - Under 300 lines
        - Has footer

    5_register:
      action: "Add to index.json"
      example: |
        {
          "id": "new-skill",
          "path": "skills/new-skill/",
          "category": "language",
          "files": {
            "meta": "META.yaml",
            "skill": "SKILL.md",
            "advanced": "ADVANCED.md"
          }
        }

    6_update_embeddings:
      action: "Regenerate embeddings.json"
      note: "TF-IDF vectors auto-generated from keywords and content"

    7_validate:
      action: "Run validation checks"
      command: "Verify skill against SKILL_SCHEMA.yaml"

# =============================================================================
# 📚 CATEGORIES
# =============================================================================

categories:
  core:
    priority: 0
    description: "Always active, security-focused"
    examples: [security]

  language:
    priority: 1
    description: "Programming languages"
    examples: [go, python, typescript, rust]

  framework:
    priority: 2
    description: "Frontend/Backend frameworks"
    examples: [react, vue, nextjs]

  devops:
    priority: 3
    description: "Infrastructure and deployment"
    examples: [docker, kubernetes, aws, ci-cd]

  cross-cutting:
    priority: 4
    description: "Cross-cutting concerns"
    examples: [database, testing, tailwind, audit-pro]

# =============================================================================
# 🎯 BEST PRACTICES
# =============================================================================

best_practices:
  meta_yaml:
    - "Keep under 500 bytes"
    - "Use 5-10 keywords, prioritize unique terms"
    - "Detect patterns should be specific"
    - "Capabilities should be actionable"

  skill_md:
    - "Focus on 5-7 most important patterns"
    - "Include runnable code examples"
    - "Checklist should be verification-oriented"
    - "Use tables for quick reference"

  advanced_md:
    - "Only reference from SKILL.md"
    - "Include edge cases"
    - "Add troubleshooting section"
    - "Deep dive into complex patterns"

  naming:
    - "Use lowercase"
    - "Prefer hyphens over underscores"
    - "Match common terminology"

  keywords:
    - "Include variations (js, javascript)"
    - "Include framework names"
    - "Include common commands"
    - "Include file extensions"

# =============================================================================
# 🔍 DETECTION PATTERNS
# =============================================================================

detection:
  file_patterns:
    description: "Match file names or extensions"
    examples:
      - "*.go" # Go files
      - "go.mod" # Go module
      - "*.tsx" # TypeScript React
      - "Dockerfile" # Docker

  config_files:
    description: "Match configuration files"
    examples:
      - "package.json"
      - "tsconfig.json"
      - "Cargo.toml"
      - ".eslintrc"

# =============================================================================
# 🧪 TESTING
# =============================================================================

testing:
  validation:
    - "Run SKILL_SCHEMA.yaml validation"
    - "Check size limits"
    - "Verify all links work"

  manual:
    - "Test keyword detection"
    - "Verify patterns are correct"
    - "Check code examples compile"
