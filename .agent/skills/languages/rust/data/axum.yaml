  - id: rs201
    name: Router with State
    category: http
    version: "axum 0.7+"
    description: |
      Axum router setup with shared application state.
      Database pools, config, services.
    text: axum router state arc pool database
    example: |
      use axum::{Router, routing::{get, post}, extract::State};
      use std::sync::Arc;
      use sqlx::PgPool;

      // ✅ Application state
      #[derive(Clone)]
      struct AppState {
          db: PgPool,
          redis: redis::Client,
          config: Arc<Config>,
      }

      impl AppState {
          async fn new() -> Result<Self, Error> {
              let db = PgPool::connect(&env::var("DATABASE_URL")?).await?;
              let redis = redis::Client::open(env::var("REDIS_URL")?)?;
              let config = Arc::new(Config::load()?);
              
              Ok(Self { db, redis, config })
          }
      }

      // ✅ Handler using state
      async fn list_users(State(state): State<AppState>) -> Result<Json<Vec<User>>, AppError> {
          let users = sqlx::query_as!(User, "SELECT * FROM users")
              .fetch_all(&state.db)
              .await?;
          Ok(Json(users))
      }

      async fn get_config(State(state): State<AppState>) -> Json<Config> {
          Json((*state.config).clone())
      }

      // ✅ Router setup
      fn create_router(state: AppState) -> Router {
          Router::new()
              .route("/users", get(list_users).post(create_user))
              .route("/users/:id", get(get_user).put(update_user).delete(delete_user))
              .route("/health", get(health_check))
              .with_state(state)
      }

      #[tokio::main]
      async fn main() -> Result<(), Error> {
          let state = AppState::new().await?;
          let app = create_router(state);
          
          let listener = tokio::net::TcpListener::bind("0.0.0.0:3000").await?;
          axum::serve(listener, app).await?;
          Ok(())
      }
    severity: HIGH
    docs_url: https://docs.rs/axum/latest/axum/#using-state

  - id: rs202
    name: Tower Middleware
    category: http
    version: "tower 0.4+"
    description: |
      Composable middleware with Tower ecosystem.
      Logging, tracing, compression, timeout.
    text: tower middleware layer service builder tracing
    example: |
      use axum::{Router, middleware};
      use tower::ServiceBuilder;
      use tower_http::{
          trace::TraceLayer,
          compression::CompressionLayer,
          timeout::TimeoutLayer,
          cors::CorsLayer,
      };
      use std::time::Duration;

      // ✅ ServiceBuilder for middleware stack
      fn create_app(state: AppState) -> Router {
          Router::new()
              .route("/api/users", get(list_users))
              .route("/api/posts", get(list_posts))
              .layer(
                  ServiceBuilder::new()
                      .layer(TraceLayer::new_for_http())
                      .layer(CompressionLayer::new())
                      .layer(TimeoutLayer::new(Duration::from_secs(30)))
                      .layer(CorsLayer::permissive())
              )
              .with_state(state)
      }

      // ✅ Custom middleware with from_fn
      use axum::{http::Request, middleware::Next, response::Response};

      async fn auth_middleware(
          State(state): State<AppState>,
          request: Request<axum::body::Body>,
          next: Next,
      ) -> Result<Response, AppError> {
          let token = request
              .headers()
              .get("Authorization")
              .and_then(|h| h.to_str().ok())
              .ok_or(AppError::Unauthorized)?;
          
          let user = validate_token(&state.db, token).await?;
          
          // Add user to request extensions
          let mut request = request;
          request.extensions_mut().insert(user);
          
          Ok(next.run(request).await)
      }

      // Apply to specific routes
      fn protected_routes(state: AppState) -> Router {
          Router::new()
              .route("/profile", get(get_profile))
              .route("/settings", get(get_settings).put(update_settings))
              .layer(middleware::from_fn_with_state(state.clone(), auth_middleware))
              .with_state(state)
      }

      // ✅ Request timing middleware
      async fn timing_middleware(
          request: Request<axum::body::Body>,
          next: Next,
      ) -> Response {
          let start = std::time::Instant::now();
          let path = request.uri().path().to_string();
          
          let response = next.run(request).await;
          
          let duration = start.elapsed();
          tracing::info!(
              path = %path,
              status = %response.status(),
              duration_ms = %duration.as_millis(),
              "request completed"
          );
          
          response
      }
    severity: HIGH
    docs_url: https://docs.rs/tower/latest/tower/

  - id: rs203
    name: Extractors and Responses
    category: http
