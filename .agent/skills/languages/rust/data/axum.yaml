    docs_url: https://docs.rs/axum/latest/axum/extract/index.html

  - id: rs204
    name: Error Handling Layer
    category: errors
    version: "axum 0.7+"
    description: |
      Centralized error handling with custom error types.
      Convert errors to HTTP responses.
    text: error handling axum intoresponse appError status
    example: |
      use axum::{
          response::{IntoResponse, Response},
          http::StatusCode,
          Json,
      };
      use serde_json::json;

      // ✅ Application error type
      #[derive(Debug)]
      pub enum AppError {
          NotFound(String),
          BadRequest(String),
          Unauthorized,
          Forbidden,
          Internal(anyhow::Error),
          Database(sqlx::Error),
          Validation(validator::ValidationErrors),
      }

      impl IntoResponse for AppError {
          fn into_response(self) -> Response {
              let (status, message) = match &self {
                  AppError::NotFound(msg) => (StatusCode::NOT_FOUND, msg.clone()),
                  AppError::BadRequest(msg) => (StatusCode::BAD_REQUEST, msg.clone()),
                  AppError::Unauthorized => (StatusCode::UNAUTHORIZED, "Unauthorized".into()),
                  AppError::Forbidden => (StatusCode::FORBIDDEN, "Forbidden".into()),
                  AppError::Internal(err) => {
                      tracing::error!("Internal error: {:?}", err);
                      (StatusCode::INTERNAL_SERVER_ERROR, "Internal server error".into())
                  }
                  AppError::Database(err) => {
                      tracing::error!("Database error: {:?}", err);
                      (StatusCode::INTERNAL_SERVER_ERROR, "Database error".into())
                  }
                  AppError::Validation(errors) => {
                      let messages: Vec<String> = errors
                          .field_errors()
                          .into_iter()
                          .flat_map(|(f, e)| e.into_iter().map(move |e| format!("{}: {:?}", f, e.message)))
                          .collect();
                      (StatusCode::UNPROCESSABLE_ENTITY, messages.join(", "))
                  }
              };
              
              let body = Json(json!({ "error": message }));
              (status, body).into_response()
          }
      }

      // ✅ From implementations for ? operator
      impl From<sqlx::Error> for AppError {
          fn from(err: sqlx::Error) -> Self {
              match err {
                  sqlx::Error::RowNotFound => AppError::NotFound("Resource not found".into()),
                  _ => AppError::Database(err),
              }
          }
      }

      impl From<anyhow::Error> for AppError {
          fn from(err: anyhow::Error) -> Self {
              AppError::Internal(err)
          }
      }

      // ✅ Usage in handlers
      async fn get_user(
          State(state): State<AppState>,
          Path(id): Path<i32>,
      ) -> Result<Json<User>, AppError> {
          let user = sqlx::query_as!(User, "SELECT * FROM users WHERE id = $1", id)
              .fetch_optional(&state.db)
              .await?
              .ok_or_else(|| AppError::NotFound(format!("User {} not found", id)))?;
          
          Ok(Json(user))
      }
    severity: HIGH
    docs_url: https://docs.rs/axum/latest/axum/error_handling/index.html

  - id: rs205
    name: SQLx Integration
    category: database
    version: "sqlx 0.8+"
    description: |
      Compile-time checked SQL with SQLx.
      Async database operations with Axum.
    text: sqlx database postgres mysql query compile-time
    example: |
      use sqlx::{PgPool, FromRow, postgres::PgPoolOptions};

      // ✅ Database model
      #[derive(FromRow, Serialize)]
      pub struct User {
          pub id: i32,
          pub email: String,
          pub name: String,
          pub created_at: chrono::DateTime<chrono::Utc>,
      }

      // ✅ Connection pool setup
      async fn create_pool() -> Result<PgPool, sqlx::Error> {
          PgPoolOptions::new()
              .max_connections(20)
              .min_connections(5)
              .acquire_timeout(std::time::Duration::from_secs(3))
              .connect(&std::env::var("DATABASE_URL")?)
              .await
      }

      // ✅ Compile-time checked queries
      async fn get_user(pool: &PgPool, id: i32) -> Result<Option<User>, sqlx::Error> {
          sqlx::query_as!(User, "SELECT * FROM users WHERE id = $1", id)
              .fetch_optional(pool)
              .await
      }

      async fn create_user(pool: &PgPool, email: &str, name: &str) -> Result<User, sqlx::Error> {
          sqlx::query_as!(
              User,
              r#"
              INSERT INTO users (email, name)
              VALUES ($1, $2)
              RETURNING *
              "#,
              email,
              name
          )
          .fetch_one(pool)
          .await
      }

      // ✅ Transaction
      async fn transfer_funds(
          pool: &PgPool,
          from_id: i32,
          to_id: i32,
          amount: i64,
      ) -> Result<(), sqlx::Error> {
          let mut tx = pool.begin().await?;
          
          sqlx::query!(
              "UPDATE accounts SET balance = balance - $1 WHERE id = $2",
              amount,
              from_id
          )
          .execute(&mut *tx)
          .await?;
          
          sqlx::query!(
              "UPDATE accounts SET balance = balance + $1 WHERE id = $2",
              amount,
              to_id
          )
          .execute(&mut *tx)
          .await?;
          
          tx.commit().await?;
          Ok(())
      }

      // ✅ Dynamic queries
      use sqlx::QueryBuilder;

      async fn search_users(
          pool: &PgPool,
          search: Option<&str>,
          limit: i32,
      ) -> Result<Vec<User>, sqlx::Error> {
          let mut builder = QueryBuilder::new("SELECT * FROM users");
          
          if let Some(term) = search {
              builder.push(" WHERE name ILIKE ");
              builder.push_bind(format!("%{}%", term));
          }
          
          builder.push(" ORDER BY created_at DESC LIMIT ");
          builder.push_bind(limit);
          
          builder.build_query_as::<User>()
              .fetch_all(pool)
              .await
      }
    severity: HIGH
    docs_url: https://docs.rs/sqlx/
