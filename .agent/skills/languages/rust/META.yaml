name: rust
version: "6.1.2"
category: systems
tier: 1

description: |
  Systems programming patterns for Rust 1.80+.
  Covers async/await, Tokio, Axum, error handling, WebAssembly.

triggers:
  file_patterns:
    - "Cargo.toml"
    - "*.rs"
    - "Cargo.lock"
  keywords:
    # Core
    - rust
    - cargo
    - rustc
    - rustup
    - crate
    # Async
    - tokio
    - async rust
    - await rust
    - async trait
    - futures
    # Web
    - axum
    - actix
    - actix-web
    - rocket rust
    - warp
    - tower
    - hyper
    # Database
    - sqlx
    - diesel
    - sea-orm
    - postgres rust
    # Serialization
    - serde
    - serde_json
    - bincode
    # Error Handling
    - thiserror
    - anyhow
    - result rust
    - option rust
    # CLI
    - clap
    - structopt
    # Logging
    - tracing
    - log rust
    - env_logger
    # HTTP
    - reqwest
    - hyper client
    # WebAssembly
    - wasm
    - webassembly
    - wasm-bindgen
    - wasm-pack
    # Memory
    - ownership
    - borrowing
    - lifetime
    - reference rust
    # Testing
    - cargo test
    - mockall
  intents:
    - create rust project
    - rust api
    - rust async
    - rust error handling
    - rust wasm

related_skills:
  - docker

prevent_confusion_with:
  - cpp: "Rust uses ownership, C++ uses RAII"
  - go: "Rust has no GC, Go has GC"
