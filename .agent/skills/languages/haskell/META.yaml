name: haskell
version: "6.1.2"
category: functional
tier: 2

description: |
  Haskell development patterns for GHC 9.8+.
  Covers pure FP, type classes, monads, servant, lens.

triggers:
  file_patterns:
    - "*.hs"
    - "*.cabal"
    - "stack.yaml"
    - "cabal.project"
    - "package.yaml"
  keywords:
    # Core
    - haskell
    - ghc
    - ghci
    - cabal
    - stack
    # Features
    - monad
    - functor
    - applicative
    - type class
    - pure function
    - algebraic data type
    # Libraries
    - servant
    - yesod
    - lens
    - aeson
    - mtl
    - transformers
    - parsec
    - quickcheck
  intents:
    - create haskell project
    - haskell api
    - pure functional
    - type-safe haskell

related_skills:
  - scala
  - ocaml
  - rust

prevent_confusion_with:
  - ocaml: "Haskell is lazy, OCaml is strict"
  - rust: "Haskell has GC, Rust has ownership"
