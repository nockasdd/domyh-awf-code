name: r
version: "6.1.2"
category: data
tier: 2

description: |
  R development patterns for R 4.4+.
  Covers Tidyverse, ggplot2, Shiny, statistical modeling.

triggers:
  file_patterns:
    - "*.R"
    - "*.Rmd"
    - "*.qmd"
    - "DESCRIPTION"
    - ".Rproj"
    - "renv.lock"
  keywords:
    # Core
    - r programming
    - r language
    - r 4.4
    - rstats
    - cran
    - renv
    # Tidyverse
    - tidyverse
    - dplyr
    - ggplot2
    - tidyr
    - purrr
    - readr
    - stringr
    - lubridate
    # Shiny
    - shiny
    - shiny app
    - shinydashboard
    - golem
    # Data
    - data.table
    - data frame
    - tibble
    # ML
    - caret
    - mlr3
    - tidymodels
    # Stats
    - regression
    - anova
    - hypothesis test
    # Viz
    - ggplot
    - plotly r
    - leaflet r
  intents:
    - create r project
    - data analysis r
    - statistical analysis
    - shiny dashboard

related_skills:
  - python
  - database

prevent_confusion_with:
  - python: "R uses <- for assignment, Python uses ="
