patterns:
  - id: js101
    name: AbortController Pattern
    category: cancellation
    version: "ES2017+"
    description: |
      Cancel async operations and cleanup.
      Timeout, user cancellation, cleanup.
    text: abort controller signal cancel timeout cleanup
    example: |
      // ✅ Basic AbortController
      async function fetchWithTimeout(url, timeoutMs = 5000) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
        
        try {
          const response = await fetch(url, { signal: controller.signal });
          return await response.json();
        } catch (error) {
          if (error.name === 'AbortError') {
            throw new Error('Request timed out');
          }
          throw error;
        } finally {
          clearTimeout(timeoutId);
        }
      }

      // ✅ AbortSignal.timeout (modern)
      const response = await fetch(url, {
        signal: AbortSignal.timeout(5000)
      });

      // ✅ AbortSignal.any - multiple abort sources
      const userController = new AbortController();

      // Abort on timeout OR user action
      const signal = AbortSignal.any([
        userController.signal,
        AbortSignal.timeout(30000)
      ]);

      cancelButton.onclick = () => userController.abort();
      await fetch(url, { signal });

      // ✅ Cleanup with abort
      function createPolling(url, intervalMs) {
        const controller = new AbortController();
        
        const poll = async () => {
          while (!controller.signal.aborted) {
            try {
              const data = await fetch(url, { signal: controller.signal })
                .then(r => r.json());
              processData(data);
            } catch (error) {
              if (error.name !== 'AbortError') throw error;
            }
            await new Promise(r => setTimeout(r, intervalMs));
          }
        };
        
        return {
          start: poll,
          stop: () => controller.abort()
        };
      }
    severity: HIGH
    docs_url: https://developer.mozilla.org/en-US/docs/Web/API/AbortController

  - id: js102
    name: Promise.allSettled
    category: async
    version: "ES2020"
    description: |
      Wait for all promises regardless of outcome.
      Collect both fulfilled and rejected results.
    text: allSettled promise all results fulfilled rejected
    example: |
      // ✅ Promise.allSettled - no short-circuit
      async function fetchMultiple(urls) {
        const results = await Promise.allSettled(
          urls.map(url => fetch(url).then(r => r.json()))
        );
        
        const successes = results
          .filter(r => r.status === 'fulfilled')
          .map(r => r.value);
        
        const failures = results
          .filter(r => r.status === 'rejected')
          .map(r => r.reason);
        
        console.log(`${successes.length} succeeded, ${failures.length} failed`);
        return successes;
      }

      // ✅ With structured result
      async function batchProcess(items, processor) {
        const results = await Promise.allSettled(
          items.map(async item => ({
            id: item.id,
            result: await processor(item)
          }))
        );
        
        return results.map((result, index) => ({
          id: items[index].id,
          status: result.status,
          data: result.status === 'fulfilled' ? result.value.result : null,
          error: result.status === 'rejected' ? result.reason.message : null
        }));
      }

      // ✅ Comparison: .all vs .allSettled vs .any
      // Promise.all     - First rejection fails all
      // Promise.allSettled - All results, no failures
      // Promise.any     - First success wins
      // Promise.race    - First to settle wins

      const results = await Promise.allSettled([
        fetchUser(1),
        fetchUser(2),  // This might fail
        fetchUser(3),
      ]);

      // Even if fetchUser(2) fails, we get results for 1 and 3
    severity: HIGH
    docs_url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/allSettled

  - id: js103
    name: for await...of
    category: async-iteration
    version: "ES2018"
    description: |
      Iterate over async iterables.
      Streams, paginated APIs, generators.
    text: for await async iterator generator stream
    example: |
      // ✅ Async generator
      async function* fetchAllPages(baseUrl) {
        let page = 1;
        let hasMore = true;
        
        while (hasMore) {
          const response = await fetch(`${baseUrl}?page=${page}`);
          const data = await response.json();
          
          yield* data.items;
          
          hasMore = data.hasNextPage;
          page++;
        }
      }

      // Consume with for await
      for await (const item of fetchAllPages('/api/users')) {
        processUser(item);
      }

      // ✅ Stream processing
      async function processStream(readable) {
        const reader = readable.getReader();
        
        try {
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            console.log('Chunk:', value);
          }
        } finally {
          reader.releaseLock();
        }
      }

      // ✅ From fetch Response body
      async function streamResponse(response) {
        const decoder = new TextDecoder();
        
        for await (const chunk of response.body) {
          const text = decoder.decode(chunk, { stream: true });
          console.log(text);
        }
      }

      // ✅ ReadableStream as async iterable (Node.js 17+)
      import { Readable } from 'stream';

      for await (const chunk of Readable.from(someSource)) {
        process(chunk);
      }

      // ✅ Async iteration with timeout
      async function* withTimeout(asyncIterable, ms) {
        for await (const item of asyncIterable) {
          yield await Promise.race([
            Promise.resolve(item),
            new Promise((_, reject) =>
              setTimeout(() => reject(new Error('Timeout')), ms)
            )
          ]);
        }
      }
    severity: MEDIUM
    docs_url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/for-await...of

  - id: js104
    name: Event Loop Understanding
    category: runtime
    version: "JavaScript"
    description: |
      Understand microtasks vs macrotasks.
      Critical for debugging async behavior.
    text: event loop microtask macrotask queueMicrotask setTimeout
    example: |
      // ✅ Execution order
      console.log('1: sync');

      setTimeout(() => console.log('2: macrotask'), 0);

      Promise.resolve().then(() => console.log('3: microtask'));

      queueMicrotask(() => console.log('4: microtask'));

      console.log('5: sync');

      // Output: 1, 5, 3, 4, 2
      // Sync → Microtasks → Macrotasks

      // ✅ Microtasks
      // - Promise .then/.catch/.finally
      // - queueMicrotask()
      // - MutationObserver
      // - async/await (after first await)

      // ✅ Macrotasks
      // - setTimeout/setInterval
      // - setImmediate (Node.js)
      // - I/O callbacks
      // - UI rendering (browser)

      // ✅ Nested example
      Promise.resolve().then(() => {
        console.log('microtask 1');
        setTimeout(() => console.log('nested macrotask'), 0);
        Promise.resolve().then(() => console.log('nested microtask'));
      });

      setTimeout(() => console.log('macrotask 1'), 0);

      // Output: microtask 1, nested microtask, macrotask 1, nested macrotask

      // ✅ Avoid microtask starvation
      // BAD: Infinite microtask loop blocks macrotasks/rendering
      function bad() {
        Promise.resolve().then(() => bad()); // Never yields
      }

      // GOOD: Use macrotask for long operations
      function processItems(items, callback) {
        let i = 0;
        
        function processNext() {
          const start = Date.now();
          
          while (i < items.length && Date.now() - start < 16) {
            callback(items[i++]);
          }
          
          if (i < items.length) {
            setTimeout(processNext, 0); // Yield to event loop
          }
        }
        
        processNext();
      }
    severity: HIGH
    docs_url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Event_loop
