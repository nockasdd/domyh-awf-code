name: python
version: "6.3.1"
category: backend
tier: 3

desc: "Python development patterns for Python 3.13/3.14. GIL-free mode, JIT compiler, t-strings, FastAPI, asyncio, type hints."

triggers:
  file_patterns:
    - "pyproject.toml"
    - "requirements.txt"
    - "*.py"
    - "Pipfile"
    - "setup.py"
  keywords:
    # Core
    - python
    - python 3.12
    - python 3.13
    - pip
    - pyenv
    - venv
    - virtualenv
    - poetry
    # FastAPI
    - fastapi
    - uvicorn
    - starlette
    - pydantic
    - openapi
    # Django
    - django
    - django rest
    - drf
    - django orm
    - django admin
    # Async
    - asyncio
    - async await python
    - aiohttp
    - httpx
    - taskgroup
    # Type Hints
    - type hint
    - typing python
    - mypy
    - pyright
    # Data Science
    - pandas
    - numpy
    - polars
    - matplotlib
    - seaborn
    - plotly
    # ML
    - pytorch
    - tensorflow
    - scikit-learn
    - transformers
    - huggingface
    # Testing
    - pytest
    - pytest asyncio
    - unittest
    - mock python
    # Quality
    - ruff
    - black
    - flake8
    - pylint
    # Database
    - sqlalchemy
    - alembic
  intents:
    - create fastapi app
    - django project
    - python async
    - data analysis
    - machine learning

related_skills:
  - database
  - docker

prevent_confusion_with:
  - javascript: "Python uses def/async def, JS uses function/async function"
  - php: "Python uses indentation, PHP uses braces"
