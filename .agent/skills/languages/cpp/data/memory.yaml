patterns:
  - id: cpp201
    name: std::span (C++20)
    category: memory
    version: "C++20"
    description: |
      Non-owning view over contiguous memory.
      Replace raw pointer + size parameters.
    text: span view array vector contiguous memory
    example: |
      #include <span>
      #include <vector>
      #include <array>

      // ✅ Accept any contiguous container
      void process(std::span<const int> data) {
          for (int value : data) {
              std::println("{}", value);
          }
      }

      // Works with:
      std::vector<int> vec = {1, 2, 3};
      std::array<int, 3> arr = {4, 5, 6};
      int c_arr[] = {7, 8, 9};

      process(vec);
      process(arr);
      process(c_arr);

      // ✅ Subspan operations
      std::span<int> data(vec);
      auto first_two = data.first(2);
      auto last_two = data.last(2);
      auto middle = data.subspan(1, 2);

      // ✅ Fixed-extent span
      std::span<int, 3> fixed(arr);  // Compile-time size known

      // ✅ Mutable vs const
      void modify(std::span<int> data) {
          for (int& v : data) v *= 2;
      }

      void read_only(std::span<const int> data) {
          // Cannot modify
      }

      // ✅ Span from string_view (C++20)
      void process_bytes(std::span<const std::byte> bytes) {
          // Binary data processing
      }

      // ✅ Multi-dimensional with mdspan (C++23)
      // See mdspan pattern below
    severity: HIGH
    docs_url: https://en.cppreference.com/w/cpp/container/span

  - id: cpp202
    name: std::mdspan (C++23)
    category: memory
    version: "C++23"
    description: |
      Multi-dimensional view over contiguous memory.
      Matrix operations, scientific computing.
    text: mdspan multidimensional matrix array view
    example: |
      #include <mdspan>
      #include <vector>

      // ✅ 2D view over flat array
      std::vector<int> data(12);  // 3x4 matrix
      std::mdspan matrix(data.data(), 3, 4);

      // Access elements
      matrix[1, 2] = 42;  // C++23 multidimensional subscript

      // ✅ Iterate over matrix
      for (size_t i = 0; i < matrix.extent(0); ++i) {
          for (size_t j = 0; j < matrix.extent(1); ++j) {
              std::print("{} ", matrix[i, j]);
          }
          std::println();
      }

      // ✅ Layout policies
      using RowMajor = std::mdspan<int, std::dextents<size_t, 2>, std::layout_right>;
      using ColMajor = std::mdspan<int, std::dextents<size_t, 2>, std::layout_left>;

      RowMajor row_matrix(data.data(), 3, 4);  // C-style
      // ColMajor col_matrix(data.data(), 3, 4);  // Fortran-style

      // ✅ Static extents for optimization
      using Matrix3x3 = std::mdspan<float, std::extents<size_t, 3, 3>>;

      std::array<float, 9> mat_data{};
      Matrix3x3 mat(mat_data.data());

      // ✅ Mixed static/dynamic extents
      using DynamicRows = std::mdspan<int, std::extents<size_t, std::dynamic_extent, 4>>;

      // ✅ Submdspan (C++26)
      auto submatrix = std::submdspan(matrix, 
          std::pair{0, 2},   // Rows 0-1
          std::pair{1, 3});  // Cols 1-2
    severity: MEDIUM
    docs_url: https://en.cppreference.com/w/cpp/container/mdspan

  - id: cpp203
    name: Memory Alignment
    category: memory
    version: "C++11+"
    description: |
      Control memory alignment for performance.
      SIMD, cache optimization.
    text: alignas alignof alignment cache line simd
    example: |
      #include <new>
      #include <memory>

      // ✅ alignas - specify alignment
      struct alignas(64) CacheAligned {
          int data[16];  // Fits in one cache line
      };

      // ✅ alignof - query alignment
      static_assert(alignof(CacheAligned) == 64);

      // ✅ SIMD alignment
      struct alignas(32) SimdData {
          float values[8];  // AVX-aligned
      };

      // ✅ Aligned allocation (C++17)
      struct alignas(128) LargeAligned {
          char data[256];
      };

      // Stack allocation respects alignas
      LargeAligned stack_obj;

      // Heap allocation (C++17 aligned new)
      auto* heap_obj = new LargeAligned;

      // ✅ Over-aligned types with smart pointers
      auto ptr = std::make_unique<alignas(64) float[]>(100);

      // ✅ aligned_alloc for raw memory
      void* raw = std::aligned_alloc(64, 1024);
      std::free(raw);

      // ✅ Check alignment at runtime
      bool is_aligned = (reinterpret_cast<uintptr_t>(ptr.get()) % 64) == 0;

      // ✅ [[assume]] for optimization hints (C++23)
      void process(float* data) {
          [[assume(reinterpret_cast<uintptr_t>(data) % 32 == 0)]];
          // Compiler can assume data is 32-byte aligned
      }

      // ✅ Hardware constructive/destructive interference
      struct alignas(std::hardware_destructive_interference_size) ThreadLocalCounter {
          std::atomic<int> count{0};
      };
      // Prevents false sharing between threads
    severity: MEDIUM
    docs_url: https://en.cppreference.com/w/cpp/language/alignas

  - id: cpp204
    name: Custom Allocators
    category: memory
    version: "C++11+"
    description: |
      Control memory allocation strategy.
      Pool allocators, arena allocators.
    text: allocator pmr polymorphic memory resource pool
    example: |
      #include <memory_resource>
      #include <vector>

      // ✅ Stack-based allocation (pmr)
      std::array<std::byte, 10000> buffer;
      std::pmr::monotonic_buffer_resource pool(
          buffer.data(), buffer.size()
      );

      std::pmr::vector<int> vec(&pool);
      vec.push_back(1);  // Allocates from buffer, not heap

      // ✅ Pool resource for many small objects
      std::pmr::synchronized_pool_resource sync_pool;
      std::pmr::vector<std::string> strings(&sync_pool);

      // ✅ Unsynchronized for single-threaded
      std::pmr::unsynchronized_pool_resource fast_pool;
      std::pmr::vector<int> local_vec(&fast_pool);

      // ✅ Custom allocator (classic style)
      template<typename T>
      class PoolAllocator {
          MemoryPool* pool_;
          
      public:
          using value_type = T;
          
          explicit PoolAllocator(MemoryPool* p) : pool_(p) {}
          
          T* allocate(size_t n) {
              return static_cast<T*>(pool_->allocate(n * sizeof(T), alignof(T)));
          }
          
          void deallocate(T* p, size_t n) {
              pool_->deallocate(p, n * sizeof(T));
          }
      };

      // ✅ Arena allocator pattern
      class ArenaAllocator {
          std::vector<std::byte> buffer_;
          size_t offset_ = 0;
          
      public:
          explicit ArenaAllocator(size_t size) : buffer_(size) {}
          
          void* allocate(size_t size, size_t align) {
              offset_ = (offset_ + align - 1) & ~(align - 1);
              auto* ptr = buffer_.data() + offset_;
              offset_ += size;
              return ptr;
          }
          
          void reset() { offset_ = 0; }  // Free all at once
      };
    severity: MEDIUM
    docs_url: https://en.cppreference.com/w/cpp/memory/memory_resource
