name: cpp
version: "6.4.3"
display: C++
category: language
tier: 3
priority: 1

desc: "Modern C++ (C++23/26) development patterns. Modules, Concepts, expected, Ranges, std::format, mdspan."

triggers:
  file_patterns:
    - "CMakeLists.txt"
    - "*.cpp"
    - "*.hpp"
    - "*.h"
    - "vcpkg.json"
    - "conanfile.txt"
  keywords:
    # Core
    - c++
    - cpp
    - c++20
    - c++23
    - modern c++
    # Build
    - cmake
    - vcpkg
    - conan
    - gcc
    - clang
    - msvc
    # Features
    - concepts
    - ranges
    - coroutines
    - smart pointer
    - std::vector
  intents:
    - c++ code
    - cpp project
    - cmake build
    - modern c++

related_skills:
  - c
  - rust

caps:
  - Modern C++20/23/26
  - CMake builds
  - Smart pointers
  - Concepts & ranges
  - Coroutines

prevent_confusion_with:
  c: "C++ = classes/templates, C = no classes"
  rust: "C++ = manual memory, Rust = ownership"
