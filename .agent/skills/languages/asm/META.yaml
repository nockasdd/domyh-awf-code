name: asm
display: Assembly Language
category: language
tier: 3
priority: 2
version: "6.2.5"

desc: "Assembly patterns: x86/x64, ARM64, SIMD, inline ASM, optimization, debugging"

domains:
  core: 4
  advanced: 4

    - "*.asm"
    - "*.s"
    - "*.S"
  keywords:
    # Assemblers (Modern + Legacy)
    - assembly
    - asm
    - nasm
    - masm
    - gas
    - fasm
    - tasm
    - yasm
    # Architectures
    - x86
    - x64
    - amd64
    - arm64
    - aarch64
    - risc-v
    # SIMD
    - simd
    - sse
    - avx
    - avx2
    - avx512
    - avx10
    - amx
    - neon
    - sve
    # Inline ASM
    - inline assembly
    - __asm
    - asm volatile
    - intrinsics
    # OS/Mode
    - syscall
    - dos
    - real mode
    - protected mode
    - calling convention
    # Tools
    - ghidra
    - ida
    - reverse engineering
  intents:
    - write assembly
    - x86 optimization
    - simd programming
    - inline asm

caps:
  - x86/x64 assembly (Intel/AT&T syntax)
  - ARM64 assembly (AArch64/NEON)
  - Inline assembly (GCC extended, MSVC limitations)
  - SIMD programming (SSE/AVX/AVX-512/NEON)
  - C++ integration patterns
  - IDE setup (Visual Studio, VSCode, CLion)
  - Calling conventions (cdecl, stdcall, fastcall, Windows x64, System V)
  - Build system integration (CMake, MASM, NASM, GAS)

related_skills:
  - cpp
  - c
  - security
