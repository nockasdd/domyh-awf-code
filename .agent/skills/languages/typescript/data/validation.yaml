patterns:
  - id: ts101
    name: Zod Schema Patterns
    category: validation
    version: "zod 3.24+"
    description: |
      Zod for TypeScript-first schema validation.
      Type inference, composable schemas.
    text: zod schema validation type inference infer
    example: |
      import { z } from 'zod';

      // ✅ Define schema with type inference
      const UserSchema = z.object({
        id: z.number().int().positive(),
        email: z.string().email(),
        name: z.string().min(2).max(100),
        role: z.enum(['admin', 'user', 'guest']),
        metadata: z.record(z.string()).optional(),
      });

      // Infer type from schema
      type User = z.infer<typeof UserSchema>;

      // ✅ Parse with validation
      function createUser(input: unknown): User {
        return UserSchema.parse(input); // Throws on invalid
      }

      // ✅ Safe parse (no throw)
      function validateUser(input: unknown): User | null {
        const result = UserSchema.safeParse(input);
        if (!result.success) {
          console.error(result.error.flatten());
          return null;
        }
        return result.data;
      }

      // ✅ Extend schemas
      const UserCreateSchema = UserSchema.omit({ id: true });
      const UserUpdateSchema = UserSchema.partial().required({ id: true });

      // ✅ Nested schemas
      const OrderSchema = z.object({
        id: z.string().uuid(),
        user: UserSchema,
        items: z.array(z.object({
          productId: z.string(),
          quantity: z.number().int().positive(),
        })).min(1),
        total: z.number().nonnegative(),
      });
    severity: HIGH
    docs_url: https://zod.dev/

  - id: ts102
    name: Zod Transform Pattern
    category: validation
    version: "zod 3.0+"
    description: |
      Transform and preprocess data during validation.
      Normalize, coerce, and enrich data.
    text: zod transform preprocess coerce normalize
    example: |
      import { z } from 'zod';

      // ✅ Transform after validation
      const UserInputSchema = z.object({
        email: z.string().email().transform(e => e.toLowerCase()),
        name: z.string().transform(n => n.trim()),
        birthDate: z.string().transform(s => new Date(s)),
      });

      // ✅ Preprocess before validation
      const StringToNumber = z.preprocess(
        (val) => typeof val === 'string' ? parseInt(val, 10) : val,
        z.number()
      );

      // ✅ Coerce (shorthand for common transforms)
      const CoercedSchema = z.object({
        id: z.coerce.number(),      // String "123" → 123
        active: z.coerce.boolean(), // "true" → true
        date: z.coerce.date(),      // ISO string → Date
      });

      // ✅ Default values
      const ConfigSchema = z.object({
        port: z.number().default(3000),
        host: z.string().default('localhost'),
        debug: z.boolean().default(false),
      });

      const config = ConfigSchema.parse({}); // Uses all defaults

      // ✅ Complex transform: API response normalization
      const ApiResponseSchema = z.object({
        data: z.array(z.object({
          user_id: z.number(),
          user_name: z.string(),
          created_at: z.string(),
        })),
      }).transform(res => ({
        users: res.data.map(u => ({
          id: u.user_id,
          name: u.user_name,
          createdAt: new Date(u.created_at),
        })),
      }));
    severity: MEDIUM
    docs_url: https://zod.dev/api#transform

  - id: ts103
    name: safeParse vs parse
    category: validation
    version: "zod 3.0+"
    description: |
      Choose between throwing and safe parsing.
      safeParse for performance-critical code.
    text: zod safeParse parse error handling performance
    example: |
      import { z } from 'zod';

      const UserSchema = z.object({
        email: z.string().email(),
        age: z.number().int().min(0).max(150),
      });

      // ✅ parse() - throws ZodError on failure
      // Use when: Invalid data is exceptional
      function processUser(data: unknown): void {
        try {
          const user = UserSchema.parse(data);
          saveUser(user);
        } catch (error) {
          if (error instanceof z.ZodError) {
            console.error('Validation failed:', error.errors);
          }
          throw error;
        }
      }

      // ✅ safeParse() - returns Result object
      // Use when: Invalid data is expected, performance matters
      function validateUserInput(data: unknown): UserInput | null {
        const result = UserSchema.safeParse(data);
        
        if (!result.success) {
          // Access structured errors
          const formatted = result.error.flatten();
          console.error('Field errors:', formatted.fieldErrors);
          return null;
        }
        
        return result.data;
      }

      // ✅ Performance comparison
      // safeParse: No try-catch overhead, ~10-20% faster for invalid data
      // parse: Slightly faster for valid data (no result wrapping)

      // ✅ Batch validation pattern
      function validateBatch<T>(
        schema: z.ZodType<T>,
        items: unknown[]
      ): { valid: T[]; invalid: Array<{ index: number; errors: z.ZodError }> } {
        const valid: T[] = [];
        const invalid: Array<{ index: number; errors: z.ZodError }> = [];
        
        items.forEach((item, index) => {
          const result = schema.safeParse(item);
          if (result.success) {
            valid.push(result.data);
          } else {
            invalid.push({ index, errors: result.error });
          }
        });
        
        return { valid, invalid };
      }
    severity: MEDIUM
    docs_url: https://zod.dev/api#parse

  - id: ts104
    name: Effect Schema
    category: validation
    version: "effect 3.0+"
    description: |
      @effect/schema for functional validation.
      Deep integration with Effect ecosystem.
    text: effect schema functional validation composable
    example: |
      import { Schema as S } from '@effect/schema';
      import { Effect, Either } from 'effect';

      // ✅ Define schema
      const UserSchema = S.Struct({
        id: S.Number.pipe(S.int(), S.positive()),
        email: S.String.pipe(S.pattern(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)),
        name: S.String.pipe(S.minLength(2), S.maxLength(100)),
        role: S.Literal('admin', 'user', 'guest'),
      });

      type User = S.Schema.Type<typeof UserSchema>;

      // ✅ Decode (parse) with Either
      const decodeUser = S.decodeEither(UserSchema);

      function parseUser(input: unknown): Either.Either<User, S.ParseError> {
        return decodeUser(input);
      }

      // ✅ Decode with Effect (for async/error handling)
      const decodeUserEffect = S.decode(UserSchema);

      function parseUserAsync(input: unknown): Effect.Effect<User, S.ParseError> {
        return decodeUserEffect(input);
      }

      // ✅ Encode (serialize)
      const encodeUser = S.encode(UserSchema);

      // ✅ Transformations
      const DateFromString = S.transform(
        S.String,
        S.DateFromSelf,
        {
          decode: (s) => new Date(s),
          encode: (d) => d.toISOString(),
        }
      );

      // ✅ Tagged unions (discriminated)
      const ApiResponse = S.Union(
        S.Struct({ _tag: S.Literal('success'), data: UserSchema }),
        S.Struct({ _tag: S.Literal('error'), message: S.String }),
      );

      // Pattern match with exhaustiveness
      function handleResponse(response: S.Schema.Type<typeof ApiResponse>) {
        switch (response._tag) {
          case 'success':
            return response.data;
          case 'error':
            throw new Error(response.message);
        }
      }
    severity: MEDIUM
    docs_url: https://effect.website/docs/schema/introduction

  - id: ts105
    name: Environment Validation
    category: validation
    version: "zod 3.0+"
    description: |
      Validate process.env at startup.
      Type-safe environment configuration.
    text: environment validation env config process.env
    example: |
      import { z } from 'zod';

      // ✅ Define environment schema
      const EnvSchema = z.object({
        // Required
        DATABASE_URL: z.string().url(),
        REDIS_URL: z.string().url(),
        JWT_SECRET: z.string().min(32),
        
        // Optional with defaults
        PORT: z.coerce.number().default(3000),
        NODE_ENV: z.enum(['development', 'production', 'test']).default('development'),
        LOG_LEVEL: z.enum(['debug', 'info', 'warn', 'error']).default('info'),
        
        // Boolean from string
        DEBUG: z.string()
          .transform(s => s === 'true')
          .default('false'),
        
        // Optional
        SENTRY_DSN: z.string().url().optional(),
      });

      // ✅ Parse and validate at startup
      function loadEnv() {
        const result = EnvSchema.safeParse(process.env);
        
        if (!result.success) {
          console.error('❌ Invalid environment variables:');
          console.error(result.error.flatten().fieldErrors);
          process.exit(1);
        }
        
        return result.data;
      }

      // ✅ Export typed config
      export const env = loadEnv();

      // Type is inferred
      type Env = z.infer<typeof EnvSchema>;

      // ✅ Usage
      console.log(`Server starting on port ${env.PORT}`);
      console.log(`Environment: ${env.NODE_ENV}`);

      // ✅ t3-env pattern (recommended for Next.js)
      // npm install @t3-oss/env-nextjs
      import { createEnv } from '@t3-oss/env-nextjs';

      export const env = createEnv({
        server: {
          DATABASE_URL: z.string().url(),
          JWT_SECRET: z.string().min(32),
        },
        client: {
          NEXT_PUBLIC_API_URL: z.string().url(),
        },
        runtimeEnv: {
          DATABASE_URL: process.env.DATABASE_URL,
          JWT_SECRET: process.env.JWT_SECRET,
          NEXT_PUBLIC_API_URL: process.env.NEXT_PUBLIC_API_URL,
        },
      });
    severity: HIGH
    docs_url: https://env.t3.gg/
