name: typescript
version: "6.4.5"
category: frontend
tier: 3
priority: 3

desc: "Type-safe JavaScript development for TypeScript 5.8/6.0. Zod validation, Effect-TS, Iterator Helpers, using declaration."

trigger_desc: |
  Activate when user works with TypeScript files (.ts, .tsx, .mts, .cts),
  asks about type definitions, generics, utility types, branded types,
  Zod validation, ESM modules, tsconfig, or TypeScript-specific tooling
  (biome, tsup, tsx). Also for strict mode, discriminated unions, decorators.

triggers:
  file_patterns:
    - "tsconfig.json"
    - "*.ts"
    - "*.tsx"
    - "*.mts"
    - "*.cts"
  keywords:
    # Core
    - typescript
    - ts
    - tsconfig
    - tsc
    - typescript 5
    - typescript 5.5
    - typescript 5.6
    # Types
    - interface typescript
    - type typescript
    - generic typescript
    - utility type
    - discriminated union
    - type predicate
    - type guard
    - type inference
    - branded type
    - literal type
    - template literal type
    # Modules
    - esm
    - ecmascript module
    - import type
    - export type
    # Features
    - decorator typescript
    - enum typescript
    - namespace
    - as const
    - satisfies
    - using
    # Strict Mode
    - strict mode
    - noUncheckedIndexedAccess
    - strictNullChecks
    - no any
    - unknown type
    # Build
    - tsc build
    - incremental
    - project references
    - tsup
    - tsx
    # Validation
    - zod
    - valibot
    - effect schema
    # Tools
    - biome
    - eslint typescript
    - prettier
    - ts-node
    # Runtimes
    - bun
    - deno
    - node typescript
  intents:
    - typescript project
    - type definition
    - typescript interface
    - typescript config
    - typescript strict

caps:
  - TypeScript 5.8/6.0 features
  - Type system patterns
  - Zod/Valibot validation
  - ESM module system
  - tsconfig optimization

compatibility: "Node.js >= 18, TypeScript >= 5.0"

related_skills:
  - react
  - nextjs
  - nodejs-best-practices

prevent_confusion_with:
  - javascript: "TypeScript has types, JS doesn't"
  - java: "TypeScript compiles to JS, runs in browser/Node"
  - csharp: "TypeScript uses structural typing, C# nominal"
