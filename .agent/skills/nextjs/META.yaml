name: nextjs
version: "4.3.0"
category: frontend
tier: 1

description: |
  React meta-framework patterns for Next.js 15/16.
  Covers App Router, Server Components, Turbopack, Server Actions.

triggers:
  file_patterns:
    - "next.config.js"
    - "next.config.mjs"
    - "next.config.ts"
    - "app/layout.tsx"
    - "app/page.tsx"
  keywords:
    # Core
    - nextjs
    - next.js
    - next js
    - app router
    - pages router
    - next/image
    - next/link
    - next/font
    # Server Components
    - server component
    - client component
    - use client
    - use server
    - rsc
    - react server component
    # Data Fetching
    - server action
    - server actions
    - revalidatePath
    - revalidateTag
    - unstable_cache
    - fetch next
    # Build
    - turbopack
    - next build
    - next dev
    - next start
    # Routing
    - dynamic route
    - route handler
    - middleware next
    - generateStaticParams
    - generateMetadata
    # Features
    - loading.tsx
    - error.tsx
    - not-found.tsx
    - layout.tsx
    - template.tsx
    - parallel routes
    - intercepting routes
    # Auth
    - nextauth
    - next-auth
    - clerk nextjs
    # Deployment
    - vercel
    - next deploy
    - static export
  intents:
    - create next.js app
    - setup app router
    - server component data
    - next.js deployment
    - next.js middleware

related_skills:
  - react
  - typescript
  - tailwind-patterns

prevent_confusion_with:
  - react: "Next.js is meta-framework, React is library"
  - nodejs: "Next.js has built-in server, use for full-stack"
