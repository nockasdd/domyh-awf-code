# =============================================================================
# AUDIO MODELS
# =============================================================================

audio_models:
  - id: suno_v5
    name: "Suno V5"
    released: "2025-10"
    type: "music"
    best_for: "Vocal songs, full tracks, rapid prototyping"
    prompt_formula: "genre + tempo-feel + instrumentation + vocal intent + mix intent + mood"
    prompt_example: "Uplifting indie folk about overcoming anxiety, acoustic guitar, gentle female vocals, hopeful chorus, warm mix"
    gen_speed: "~30s per track"
    output: "44.1kHz stereo"
    max_duration: "4 minutes"
    special_features:
      - "Hyper-realistic vocals with natural vibrato"
      - "50+ genres supported"
      - "Stem separation (Vocals, Drums, Bass, Melody)"
      - "Hum-to-Song feature"
      - "In-platform DAW editing"
      - "Warner Music Group licensed data"
    strengths: ["vocal quality", "speed", "genre range", "accessibility"]

  - id: udio_v4
    name: "Udio V4"
    released: "2026-01"
    type: "music"
    best_for: "Instrumental quality, professional mixing, long tracks"
    prompt_formula: "genre + vibe/mood + instrumentation + production style + BPM/key"
    prompt_example: "Lo-fi hip hop, chill study beats, jazz piano, vinyl crackle, 85 BPM, Dm"
    gen_speed: "~90s per track"
    output: "48kHz stereo"
    max_duration: "10 minutes (no hallucination drift)"
    special_features:
      - "Magic Edit (regenerate specific sections)"
      - "Stem Separation 2.0 (Vocals, Bass, Drums, Other)"
      - "Voice Cloning from uploaded audio"
      - "Universal Music Group licensed data"
    strengths: ["instrumental separation", "audio fidelity", "editing control"]

  - id: stable_audio
    name: "Stable Audio (Stability AI)"
    type: "music"
    best_for: "Ambient, electronic, enterprise, sound design"
    prompt_formula: "genre + mood + texture + tempo + duration"
    prompt_example: "Ambient electronic, dreamy, synthesizer pads, slow 70 BPM, 45 seconds"
    gen_speed: "~45s"
    output: "44.1kHz stereo"
    special_features:
      - "Precise timing control (down to the second)"
      - "Batch generation for enterprise"
      - "Consistent textures for backgrounds"
    strengths: ["consistency", "timing precision", "enterprise", "ambient"]

  - id: elevenlabs
    name: "ElevenLabs"
    type: "voice/tts"
    best_for: "Voice cloning, realistic TTS, multilingual"
    prompt_params:
      voice_type: ["male", "female", "child", "elderly"]
      pace: ["slow", "medium", "fast"]
      emotion: ["calm", "excited", "serious", "warm", "confident"]
      accent: ["neutral", "british", "southern", "australian"]
      style: ["narration", "conversational", "presentational"]
    special_features:
      - "Voice cloning from 30s sample"
      - "29+ languages"
      - "Real-time streaming"
      - "Sound effects generation"
    strengths: ["voice quality", "cloning", "multilingual"]

# =============================================================================
# NEGATIVE PROMPT PATTERNS (per model)
# =============================================================================

negative_prompt_patterns:
  midjourney:
    syntax: "--no [unwanted elements]"
    common: "--no text, watermark, blurry, low quality, cropped"
    tips:
      - "Keep --no list short (3-5 items)"
      - "Use --style raw for more literal interpretation"
  stable_diffusion:
    syntax: "negative_prompt: [comma-separated]"
    common: "blurry, low quality, bad anatomy, extra fingers, watermark, text, deformed, ugly, duplicate"
    tips:
      - "Negative prompt is as important as positive"
      - "Use embedding-based negatives for SD (EasyNegative)"
  flux:
    syntax: "Natural language negation within prompt"
    common: "Avoid text overlays. Without watermark. No blurry elements."
    tips:
      - "Flux handles negation in natural language better than SD"
  gpt_image:
    syntax: "Conversational corrections in follow-up"
    common: "Remove the text. Make it cleaner. Without the watermark."
    tips:
      - "Best handled via multi-turn editing"
      - "Be specific about what to remove"
  ideogram:
    syntax: "Natural language + Magic Fill for refinement"
    tips:
      - "Use Magic Fill to remove unwanted elements after generation"
      - "Specify clearly what NOT to include in initial prompt"
