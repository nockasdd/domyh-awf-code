patterns:
  - id: rules001
    name: cursor_rules
    category: rules
    description: Cursor IDE rule system (3-level hierarchy)
    text: cursor rules mdc global project dynamic file scope
    hierarchy:
      global: "Cursor Settings → Rules for AI (plain text, all projects)"
      project: ".cursor/index.mdc (project overview, tech stack)"
      dynamic: ".cursor/rules/*.mdc (glob-scoped, activate on context)"
    example: |
      ---
      description: React component guidelines
      globs: ["src/components/**/*.tsx"]
      ---
      - Use functional components with TypeScript
      - Use React.memo for expensive renders
    best_practices:
      - "Keep under 500 lines per rule file"
      - "Use descriptive names for .mdc files"
      - "Reference files instead of copying content"

