    name: rule_anti_patterns
    category: best-practices
    description: Common anti-patterns in agent rules
    text: anti-patterns rules mistakes avoid
    anti_patterns:
      - "Too generic: 'Write good code' → Be specific"
      - "Too long: 1000+ line rule files → Split into focused files"
