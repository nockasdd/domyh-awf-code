name: docker
version: "6.1.2"
display: Docker
category: devops
tier: 1
priority: 1

description: |
  Container orchestration with Docker 28+ and Compose V3.
  Covers multi-stage builds, security, networking, volumes.

triggers:
  file_patterns:
    - "Dockerfile"
    - "docker-compose.yml"
    - ".dockerignore"
  keywords:
    # Core
    - docker
    - dockerfile
    - container
    # Compose
    - docker-compose
    - compose
    # Features
    - multi-stage
    - buildx
    - buildkit
  intents:
    - docker build
    - container setup
    - dockerfile

related_skills:
  - kubernetes
  - ci-cd
  - go

caps:
  - Docker 28+
  - Multi-stage builds
  - BuildKit
  - Docker Compose V3
  - Security best practices
