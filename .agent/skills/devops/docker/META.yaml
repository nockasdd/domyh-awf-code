name: docker
category: infrastructure
tier: 3

desc: "Docker containerization patterns for builds, security, and deployment. Covers Compose v5, Hardened Images, Build Cloud, Bake."

patterns:
  total: 18
  domains:
    build: 5
    compose: 5
    security: 4
    runtime: 4

triggers:
  file_patterns:
    - "Dockerfile"
    - "Dockerfile.*"
    - "docker-compose.yml"
    - "compose.yml"
    - "docker-bake.hcl"
  keywords:
    # Docker
    - docker
    - dockerfile
    - container
    - image
    - docker build
    - docker run
    # Compose
    - docker compose
    - compose
    - multicontainer
    - services
    - compose v5
    # Build
    - buildx
    - multi-stage
    - buildkit
    - docker bake
    - build cloud
    # Security
    - hardened image
    - rootless
    - distroless
    - container security
  intents:
    - create dockerfile
    - optimize docker
    - secure container
    - docker compose

related_skills:
  - kubernetes
  - ci-cd
  - aws
  - security

prevent_confusion_with:
  - kubernetes: "docker is for container building, kubernetes is orchestration"
