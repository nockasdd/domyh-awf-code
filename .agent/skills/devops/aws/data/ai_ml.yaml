# AWS AI/ML Patterns - Bedrock & SageMaker (Feb 2026)
# AgentCore, Cross-Region Inference, SageMaker Unified Studio

metadata:
  skill: aws
  domain: ai-ml
  version: "2026.1"
  updated: "2026-02-05"
