name: aws
version: "7.0.0"
category: infrastructure
tier: 3

desc: "AWS cloud services patterns for serverless, containers, and AI/ML. Covers Lambda, S3, ECS, EKS, Bedrock, and SageMaker."

patterns:
  total: 25
  domains:
    compute: 6
    storage: 5
    kubernetes: 5
    ai-ml: 5
    serverless: 4

triggers:
  file_patterns:
    - "*.tf"
    - "serverless.yml"
    - "sam.yaml"
    - "cdk.json"
    - "template.yaml"
  keywords:
    # Services
    - aws
    - lambda
    - s3
    - ecs
    - eks
    - bedrock
    - sagemaker
    - dynamodb
    - api gateway
    - cloudfront
    # Lambda
    - lambda function
    - serverless
    - event bridge
    - lambda layer
    - lambda durable
    # S3
    - s3 vectors
    - s3 tables
    - s3 metadata
    - iceberg
    # ECS/EKS
    - fargate
    - ecs managed instances
    - pod identity
    - eks capabilities
    # AI/ML
    - bedrock
    - sagemaker
    - mlflow
    - model training
  intents:
    - deploy aws
    - create lambda
    - setup s3
    - configure eks
    - train model

related_skills:
  - docker
  - kubernetes
  - ci-cd
  - security

prevent_confusion_with:
  - kubernetes: "aws covers EKS specifically, kubernetes is general k8s patterns"
