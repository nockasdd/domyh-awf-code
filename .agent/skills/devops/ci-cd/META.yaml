name: ci-cd
version: "6.4.5"
category: infrastructure
tier: 3

desc: "CI/CD pipeline patterns for GitHub Actions, GitLab CI, and GitOps. Includes SLSA Build Level 3, ARM64 runners, security scanning."

patterns:
  total: 20
  domains:
    github-actions: 6
    gitlab-ci: 5
    security: 5
    deployment: 4

triggers:
  file_patterns:
    - ".github/workflows/*.yml"
    - ".gitlab-ci.yml"
    - "Jenkinsfile"
    - "azure-pipelines.yml"
    - ".circleci/config.yml"
  keywords:
    # General
    - ci cd
    - pipeline
    - continuous integration
    - continuous deployment
    - workflow
    # GitHub Actions
    - github actions
    - actions workflow
    - reusable workflow
    - composite action
    - arm64 runner
    - slsa attestation
    # Security
    - dependency review
    - code scanning
    - secret scanning
    - artifact attestation
    - supply chain
  intents:
    - create pipeline
    - setup ci
    - deploy workflow
    - secure pipeline

related_skills:
  - docker
  - kubernetes
  - aws
  - security

prevent_confusion_with:
  - aws: "ci-cd is platform-agnostic, aws covers AWS-specific deployment"
