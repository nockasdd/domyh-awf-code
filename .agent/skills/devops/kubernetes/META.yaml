name: kubernetes
subdomain: infrastructure
category: devops
tier: 3

desc: "Kubernetes orchestration patterns for K8s 1.32-1.33+. Covers Gateway API, Sidecar Containers, Kueue, Pod Security."

patterns:
  total: 20
  domains:
    networking: 5
    workloads: 5
    security: 5
    scheduling: 5

triggers:
  file_patterns:
    - "*.yaml"
    - "*.yml"
    - "Chart.yaml"
    - "kustomization.yaml"
    - "values.yaml"
  keywords:
    - k8s security
    - pod security audit
    # Core
    - kubernetes
    - k8s
    - kubectl
    - helm
    - kustomize
    # Workloads
    - deployment
    - statefulset
    - daemonset
    - job
    - cronjob
    # Networking
    - service
    - ingress
    - gateway api
    - gateway
    - httproute
    # Security
    - pod security
    - rbac
    - service account
    - network policy
    # Scheduling
    - node selector
    - affinity
    - kueue
    - priority class
  intents:
    - deploy kubernetes
    - create deployment
    - configure ingress
    - setup k8s


caps:
  - Gateway API networking
  - Sidecar Container patterns
  - Kueue job scheduling
  - Pod Security Standards
  - Kustomize and Helm packaging

data_files:
  - data/networking.yaml
  - data/scheduling.yaml
  - data/security.yaml
  - data/workloads.yaml
  - data/k8s-security-audit.yaml

related_skills:
  - docker
  - aws
  - ci-cd
  - security

prevent_confusion_with:
  - docker: "kubernetes orchestrates containers, docker builds them"
  - aws: "kubernetes is general, aws covers EKS specifically"

links_to:
  - docker
  - ci-cd
  - observability
  - terraform
