name: kubernetes
version: "6.4.0"
category: infrastructure
tier: 3

desc: "Kubernetes orchestration patterns for K8s 1.32-1.33+. Covers Gateway API, Sidecar Containers, Kueue, Pod Security."

patterns:
  total: 20
  domains:
    networking: 5
    workloads: 5
    security: 5
    scheduling: 5

triggers:
  file_patterns:
    - "*.yaml"
    - "*.yml"
    - "Chart.yaml"
    - "kustomization.yaml"
    - "values.yaml"
  keywords:
    # Core
    - kubernetes
    - k8s
    - kubectl
    - helm
    - kustomize
    # Workloads
    - deployment
    - statefulset
    - daemonset
    - job
    - cronjob
    # Networking
    - service
    - ingress
    - gateway api
    - gateway
    - httproute
    # Security
    - pod security
    - rbac
    - service account
    - network policy
    # Scheduling
    - node selector
    - affinity
    - kueue
    - priority class
  intents:
    - deploy kubernetes
    - create deployment
    - configure ingress
    - setup k8s

related_skills:
  - docker
  - aws
  - ci-cd
  - security

prevent_confusion_with:
  - docker: "kubernetes orchestrates containers, docker builds them"
  - aws: "kubernetes is general, aws covers EKS specifically"
