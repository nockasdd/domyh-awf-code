metadata:
  skill: payment-integration
  domain: common-patterns
  updated: "2026-02-27"

# ============================================================
# UNIVERSAL INTEGRATION FLOW
# ============================================================

integration_flow:
  description: "Standard payment integration flow (applies to all providers)"
  steps:
    step_1_create_order:
      action: "Save order to database"
      status: "PENDING"
      fields: [order_id, amount, currency, items, user_id, created_at]
      note: "Generate unique order_id/txn_ref BEFORE calling provider"

    step_2_create_payment:
      action: "Call provider API to create payment"
      providers:
        vnpay: "Build GET URL with params → redirect"
        momo: "POST → receive payUrl → redirect"
        zalopay: "POST → receive order_url → redirect"
        pay2s: "POST → receive Collection Link → redirect"
        payos: "POST → receive payment link → redirect"
        sepay: "Generate VietQR → display to user"
        casso: "Generate VietQR → display to user"
        stripe: "POST PaymentIntent → use client-side JS"
        paypal: "POST Create Order → redirect to PayPal"
        razorpay: "POST Create Order → open Razorpay modal"

    step_3_user_pays:
      action: "User completes payment on provider's page"
      note: "Your server waits for callback (DO NOT poll)"

    step_4_webhook_callback:
      action: "Receive webhook/IPN from provider (server-to-server)"
      critical_steps:
        - "Verify signature/HMAC FIRST"
        - "Find order by reference ID"
        - "Verify amount matches"
        - "Check order not already processed (idempotency)"
        - "Update order status atomically"
        - "Return success response FAST"

    step_5_return_url:
      action: "Handle client redirect (display only)"
      warning: "NEVER update order status from return URL"
      note: "Show 'Thank you' or 'Payment processing' page"

# ============================================================
# ERROR HANDLING
# ============================================================

error_handling:
  api_calls:
    timeout: "30 seconds max for provider API calls"
    retry: "Exponential backoff: 1s, 2s, 4s (max 3 retries)"
    circuit_breaker: "After 5 consecutive failures, pause 60s"

  webhook_processing:
    fast_response: "Return 200/success within 5 seconds"
    async_processing: "Queue complex logic (email, inventory) for background processing"
    error_logging: "Log full webhook body + error for debugging"
    dead_letter: "Move permanently failed webhooks to dead letter queue for manual review"

  user_facing:
    payment_pending: "Show 'Payment is being processed' if webhook delayed"
    payment_timeout: "After 15 minutes pending, offer retry or cancel"
    payment_failed: "Show clear error message + retry option"
    cancel: "Handle provider cancel URL gracefully"

# ============================================================
# DATABASE SCHEMA PATTERN
# ============================================================

database_schema:
  orders:
    fields:
      - {name: id, type: "UUID/BIGINT", pk: true}
      - {name: order_code, type: "VARCHAR(64)", unique: true, description: "Your reference, sent to provider"}
      - {name: user_id, type: "BIGINT", fk: users}
      - {name: amount, type: "DECIMAL(15,2)"}
      - {name: currency, type: "VARCHAR(3)", default: "VND"}
      - {name: status, type: "ENUM", values: ["pending", "paid", "failed", "cancelled", "refunded"]}
      - {name: provider, type: "VARCHAR(20)", description: "vnpay/momo/stripe/etc."}
      - {name: provider_transaction_id, type: "VARCHAR(100)", nullable: true}
      - {name: paid_at, type: TIMESTAMP, nullable: true}
      - {name: created_at, type: TIMESTAMP}
      - {name: updated_at, type: TIMESTAMP}

  payment_logs:
    description: "Audit trail — log ALL webhook/IPN calls"
    fields:
      - {name: id, type: "BIGINT", pk: true}
      - {name: order_id, type: "BIGINT", fk: orders}
      - {name: provider, type: "VARCHAR(20)"}
      - {name: event_type, type: "VARCHAR(50)", description: "IPN/webhook/return"}
      - {name: raw_body, type: TEXT, description: "Full request body (sanitized)"}
      - {name: signature_valid, type: BOOLEAN}
      - {name: result_code, type: "VARCHAR(10)"}
      - {name: processed, type: BOOLEAN, default: false}
      - {name: created_at, type: TIMESTAMP}

