# ============================================================
# PROVIDER COMPARISON
# ============================================================

comparison:
  decision_matrix:
    - scenario: "Vietnam e-commerce, no gateway fee"
      recommended: [sepay, casso, payos]
      reason: "Bank monitoring — free, VietQR support"

    - scenario: "Vietnam e-commerce, official gateway"
      recommended: [vnpay]
      reason: "Largest VN gateway, bank + card + QR support"

    - scenario: "Vietnam, mobile-first users"
      recommended: [momo, zalopay]
      reason: "E-wallet with large user base"

    - scenario: "Vietnam, need both QR and official gateway"
      recommended: [pay2s, payos]
      reason: "Napas 247 + VietQR + Collection Link"

    - scenario: "Global SaaS, card payments"
      recommended: [stripe]
      reason: "Best DX, 135+ currencies, subscriptions"

    - scenario: "Global marketplace"
      recommended: [stripe, paypal]
      reason: "Stripe Connect + PayPal multi-party"

    - scenario: "India market"
      recommended: [razorpay]
      reason: "UPI + netbanking + local cards"
