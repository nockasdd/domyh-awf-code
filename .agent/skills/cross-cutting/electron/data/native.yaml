  - id: nat006
    name: protocol handler
    category: native
    version: all
    description: Register custom URL protocol for deep linking
    text: protocol handler custom url scheme deep link open with
    example: |
      import { app } from 'electron';

      // Register protocol
      app.setAsDefaultProtocolClient('myapp');

      // Handle URL on macOS
      app.on('open-url', (event, url) => {
        event.preventDefault();
        handleDeepLink(url); // myapp://action?param=value
      });
    severity: MEDIUM

  - id: nat007
    name: single instance
    category: native
    version: all
    description: Ensure only one instance of app runs
    text: single instance lock second instance focus prevent duplicate
    example: |
      const gotTheLock = app.requestSingleInstanceLock();

      if (!gotTheLock) {
        app.quit();
      } else {
        app.on('second-instance', (event, argv) => {
          // Focus existing window
          if (mainWindow) {
            if (mainWindow.isMinimized()) mainWindow.restore();
            mainWindow.focus();
          }
        });
      }
    severity: HIGH
