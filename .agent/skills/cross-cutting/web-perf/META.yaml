name: web-perf
version: "6.2.4"
category: support
tier: 3

desc: "Core Web Vitals 2026 audit and web performance optimization. Chrome DevTools MCP integration for systematic profiling."

patterns:
  total: 38
  domains:
    core-web-vitals: 10
    lcp-optimization: 8
    inp-optimization: 8
    cls-optimization: 6
    measurement: 6

    - "*.html"
    - "lighthouse.json"
    - "web-vitals.*"
    - "lighthouserc.js"
  keywords:
    # Core Web Vitals 2025
    - web performance
    - core web vitals
    - lighthouse
    - page speed
    - performance audit
    # Metrics
    - lcp
    - fcp
    - cls
    - ttfb
    - inp
    - tbt
    - speed index
    - largest contentful paint
    - interaction to next paint
    - cumulative layout shift
    # LCP Optimization
    - preload lcp
    - fetchpriority
    - critical css
    - webp avif
    - lazy loading
    # INP Optimization
    - long tasks
    - web workers
    - code splitting
    - debounce throttle
    - scheduler.yield
    # CLS Prevention
    - image dimensions
    - font display swap
    - content-visibility
    - layout shift
    # Issues
    - render blocking
    - slow loading
    - first paint
    # Tools
    - chrome devtools
    - performance profiling
    - network waterfall
    - bundle size
    - pagespeed insights
    - crux
    - web-vitals library
  intents:
    - audit performance
    - optimize page load
    - reduce bundle size
    - fix core web vitals
    - improve lighthouse score
    - optimize lcp
    - improve inp
    - prevent cls

related_skills:
  - react
  - nextjs
  - vue
  - tailwind
  - domyh-design

prevent_confusion_with:
  - testing: "web-perf audits performance, testing verifies correctness"
