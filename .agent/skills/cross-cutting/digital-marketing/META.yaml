name: digital-marketing
display: Digital Marketing Engineering
category: cross-cutting
tier: 1
priority: 1

desc: "Digital marketing integration: GA4 analytics (gtag.js, Measurement Protocol), GTM (dataLayer, Consent Mode v2, server-side tagging), A/B testing (PostHog, LaunchDarkly, Statsig), email marketing (Resend, React Email, SendGrid, Postmark, SPF/DKIM/DMARC), privacy-first analytics (Plausible, Umami, Fathom), conversion tracking (UTM, attribution, funnels). 160+ patterns."

