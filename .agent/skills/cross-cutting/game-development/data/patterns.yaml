  - id: gdd-generation
    name: "GDD Generation from Prompt"
    engine: any
    when: "User describes game concept in natural language"
    difficulty: S
    steps:
      - Parse user prompt for genre, mechanics, art style
      - Match to genre template from genres.yaml
      - Generate GDD.json with systems, scripts, assets lists
      - Present GDD to user for approval
      - Scaffold project from approved GDD

  - id: debug-loop
    name: "Compile-Log-Fix Debug Loop"
    engine: any
    when: "Iterative bug fixing with bridge tools"
    difficulty: S
    max_iterations: 5
    steps:
      - "compile_scripts() → check for errors"
      - "Parse error messages → match against gotchas.yaml"
      - "Apply fix (code edit or bridge property change)"
      - "Re-compile → verify fix"
      - "If still failing after 5 iterations → escalate to user"

  - id: greybox-prototype
    name: "Greybox Level Prototyping"
    engine: any
    when: "Quick level layout with primitives before art"
    difficulty: S
    steps:
      - Create ground plane (Cube scaled flat or Plane)
      - Add player spawn point
      - Place obstacle primitives (Cubes, Spheres)
      - Add boundary walls
      - Set camera position
      - Test movement

  - id: scene-scaffold
    name: "Scene Scaffolding from GDD"
    engine: any
    when: "Auto-create initial scene objects from GDD specification"
    difficulty: M
    steps:
      - Read GDD.json systems spec
      - Create Manager objects (GameManager, ScoreManager, etc.)
      - Attach generated scripts to managers
      - Create Player object with controller script
      - Set up UI Canvas with HUD elements
      - Configure camera follow

  - id: visual-verify
    name: "Visual Verification Protocol"
    engine: any
    when: "Screenshot + multimodal analysis for visual bugs"
    difficulty: M
    steps:
      - Capture screenshot via bridge (future endpoint)
      - Analyze with multimodal LLM
      - Compare against expected layout from GDD
      - Report visual discrepancies
      - Suggest fixes for misalignment/wrong sprites
