  - id: ue-editor-utility
    name: "Editor Utility Widget"
    engine: unreal
    when: "Custom editor tools for level designers"
    difficulty: L
    example: |
      import unreal
      # Create an Editor Utility Widget via Python
      # This creates a simple tool that batch-renames actors
      selected = unreal.EditorUtilityLibrary.get_selected_assets()
      for i, asset in enumerate(selected):
          old_name = asset.get_name()
          new_name = f"Prop_{i:03d}"
          unreal.EditorAssetLibrary.rename_asset(
              asset.get_path_name(),
              f"/Game/Props/{new_name}"
          )
          unreal.log(f"Renamed {old_name} → {new_name}")

