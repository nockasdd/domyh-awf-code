  - id: unity-event-system
    name: "ScriptableObject Event System"
    engine: unity
    when: "Inter-system communication without tight coupling"
    difficulty: S
    scripts: ["GameEvent.cs", "GameEventListener.cs"]
    example: |
      [CreateAssetMenu(menuName = "Events/GameEvent")]
      public class GameEvent : ScriptableObject
      {
          private readonly List<GameEventListener> _listeners = new();
          public void Raise() {
              for (int i = _listeners.Count - 1; i >= 0; i--)
                  _listeners[i].OnEventRaised();
          }
          public void Register(GameEventListener l) => _listeners.Add(l);
          public void Unregister(GameEventListener l) => _listeners.Remove(l);
      }

  - id: unity-object-pool
    name: "Generic Object Pool"
    engine: unity
    when: "High-frequency spawn/destroy (bullets, particles, enemies)"
    difficulty: S
    scripts: ["ObjectPool.cs"]
    example: |
      public class ObjectPool<T> where T : MonoBehaviour
      {
          private readonly Queue<T> _pool = new();
          private readonly T _prefab;
          private readonly Transform _parent;
          public ObjectPool(T prefab, int initialSize, Transform parent = null) {
              _prefab = prefab; _parent = parent;
              for (int i = 0; i < initialSize; i++) _pool.Enqueue(CreateNew());
          }
          public T Get() {
              var obj = _pool.Count > 0 ? _pool.Dequeue() : CreateNew();
              obj.gameObject.SetActive(true); return obj;
          }
          public void Return(T obj) { obj.gameObject.SetActive(false); _pool.Enqueue(obj); }
          private T CreateNew() {
              var o = Object.Instantiate(_prefab, _parent); o.gameObject.SetActive(false); return o;
          }
      }

  - id: unity-state-machine
    name: "Enum-Based State Machine"
    engine: unity
    when: "Player states, enemy AI, game flow management"
    difficulty: S
    scripts: ["GameManager.cs"]
    example: |
      public enum GameState { Menu, Playing, Paused, GameOver }
      public class GameManager : MonoBehaviour {
          public static GameManager Instance { get; private set; }
          private GameState _state;
          public event System.Action<GameState> OnStateChanged;
          private void Awake() {
              if (Instance != null) { Destroy(gameObject); return; }
              Instance = this; DontDestroyOnLoad(gameObject);
          }
          public void ChangeState(GameState s) {
              if (_state == s) return; _state = s;
              OnStateChanged?.Invoke(s);
              Time.timeScale = s is GameState.Paused or GameState.GameOver ? 0f : 1f;
          }
      }

  - id: unity-movement
    name: "Player Movement (New Input System)"
    engine: unity
    when: "Player controller with modern input handling"
    difficulty: M
    scripts: ["PlayerController.cs"]
    dependencies: ["com.unity.inputsystem"]
    example: |
      using UnityEngine;
      using UnityEngine.InputSystem;
      [RequireComponent(typeof(CharacterController))]
      public class PlayerController : MonoBehaviour
      {
          [SerializeField] private float moveSpeed = 5f;
          [SerializeField] private float jumpForce = 7f;
          [SerializeField] private float gravity = -9.81f;
          private CharacterController _cc;
          private Vector2 _moveInput;
          private float _verticalVelocity;
          private void Awake() => _cc = GetComponent<CharacterController>();
          public void OnMove(InputAction.CallbackContext ctx) => _moveInput = ctx.ReadValue<Vector2>();
          public void OnJump(InputAction.CallbackContext ctx) {
              if (ctx.started && _cc.isGrounded) _verticalVelocity = jumpForce;
          }
          private void Update() {
              var move = new Vector3(_moveInput.x, 0, _moveInput.y) * moveSpeed;
              _verticalVelocity += gravity * Time.deltaTime;
              if (_cc.isGrounded && _verticalVelocity < 0) _verticalVelocity = -2f;
              move.y = _verticalVelocity;
              _cc.Move(move * Time.deltaTime);
          }
      }

  - id: unity-camera
    name: "Camera Follow Controller"
    engine: unity
    when: "Third-person or side-scroller camera follow"
    difficulty: S
    scripts: ["CameraFollow.cs"]
    example: |
      public class CameraFollow : MonoBehaviour
      {
          [SerializeField] private Transform target;
          [SerializeField] private Vector3 offset = new(0, 5, -10);
          [SerializeField] private float smoothSpeed = 5f;
          private void LateUpdate() {
              if (target == null) return;
              var desired = target.position + offset;
              transform.position = Vector3.Lerp(transform.position, desired, smoothSpeed * Time.deltaTime);
              transform.LookAt(target);
          }
      }

  - id: unity-ui-manager
    name: "UI Manager Pattern"
    engine: unity
    when: "HUD, menus, score display, health bars"
    difficulty: S
    scripts: ["UIManager.cs"]
    example: |
      using UnityEngine;
      using TMPro;
      public class UIManager : MonoBehaviour
      {
          public static UIManager Instance { get; private set; }
          [SerializeField] private TextMeshProUGUI scoreText;
          [SerializeField] private GameObject gameOverPanel;
          [SerializeField] private GameObject pausePanel;
          private void Awake() { Instance = this; gameOverPanel.SetActive(false); pausePanel.SetActive(false); }
          public void UpdateScore(int score) => scoreText.text = $"Score: {score}";
          public void ShowGameOver() => gameOverPanel.SetActive(true);
          public void TogglePause(bool paused) => pausePanel.SetActive(paused);
      }

  - id: unity-audio
    name: "Audio Manager (Pool-based)"
    engine: unity
    when: "Sound effects and music management"
    difficulty: M
    scripts: ["AudioManager.cs"]
    example: |
      public class AudioManager : MonoBehaviour
      {
          public static AudioManager Instance { get; private set; }
          [SerializeField] private AudioSource musicSource;
          [SerializeField] private AudioSource sfxSourcePrefab;
          private ObjectPool<AudioSource> _sfxPool;
          private void Awake() {
              if (Instance != null) { Destroy(gameObject); return; }
              Instance = this; DontDestroyOnLoad(gameObject);
              _sfxPool = new ObjectPool<AudioSource>(sfxSourcePrefab, 10, transform);
          }
          public void PlaySFX(AudioClip clip, float volume = 1f) {
              var src = _sfxPool.Get(); src.clip = clip; src.volume = volume; src.Play();
              StartCoroutine(ReturnAfterPlay(src, clip.length));
          }
          public void PlayMusic(AudioClip clip) { musicSource.clip = clip; musicSource.loop = true; musicSource.Play(); }
          private System.Collections.IEnumerator ReturnAfterPlay(AudioSource s, float t) {
              yield return new WaitForSeconds(t); _sfxPool.Return(s);
          }
      }

