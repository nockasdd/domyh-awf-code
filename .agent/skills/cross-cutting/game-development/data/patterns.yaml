  - id: ue-asset-import
    name: "Batch Asset Import"
    engine: unreal
    when: "Import textures, meshes, sounds from folder"
    difficulty: S
    example: |
      import unreal
      import os
      asset_tools = unreal.AssetToolsHelpers.get_asset_tools()
      source_dir = "C:/GameAssets/Textures"
      dest_path = "/Game/Art/Textures"
      tasks = []
      for f in os.listdir(source_dir):
          if f.endswith(('.png', '.jpg', '.tga')):
              task = unreal.AssetImportTask()
              task.set_editor_property('filename', os.path.join(source_dir, f))
              task.set_editor_property('destination_path', dest_path)
              task.set_editor_property('automated', True)
              task.set_editor_property('replace_existing', True)
              tasks.append(task)
      asset_tools.import_asset_tasks(tasks)
      unreal.log(f"Imported {len(tasks)} assets")

  - id: ue-level-populate
    name: "Level Population Script"
    engine: unreal
    when: "Scatter actors in level via Python script"
    difficulty: M
    example: |
      import unreal
      import random
      world = unreal.EditorLevelLibrary.get_editor_world()
      mesh_path = "/Game/Meshes/SM_Tree"
      mesh = unreal.load_asset(mesh_path)
      for i in range(50):
          loc = unreal.Vector(
              random.uniform(-5000, 5000),
              random.uniform(-5000, 5000),
              0
          )
          rot = unreal.Rotator(0, random.uniform(0, 360), 0)
          actor = unreal.EditorLevelLibrary.spawn_actor_from_class(
              unreal.StaticMeshActor, loc, rot
          )
          actor.get_editor_property('static_mesh_component').set_editor_property('static_mesh', mesh)
          actor.set_actor_label(f"Tree_{i:03d}")

