pe_manipulation:
  header_erasure:
    name: "PE Header Erasure"
    desc: "Erase DOS/NT headers after DLL loaded"
    code: |
      void EraseHeaders(HMODULE module) {
          DWORD oldProtect;
          VirtualProtect(module, 0x1000, PAGE_READWRITE, &oldProtect);
          memset(module, 0, 0x1000);
          VirtualProtect(module, 0x1000, oldProtect, &oldProtect);
      }

  module_unlink:
    name: "PEB Module Unlinking"
    desc: "Remove from InLoadOrderModuleList, InMemoryOrderModuleList"
    code: |
      void UnlinkModule(HMODULE module) {
          auto peb = (PPEB)__readgsqword(0x60);
          auto ldr = peb->Ldr;
          auto head = &ldr->InLoadOrderModuleList;
          for (auto entry = head->Flink; entry != head; entry = entry->Flink) {
              auto mod = CONTAINING_RECORD(entry, LDR_DATA_TABLE_ENTRY, InLoadOrderLinks);
              if (mod->DllBase == module) {
                  mod->InLoadOrderLinks.Flink->Blink = mod->InLoadOrderLinks.Blink;
                  mod->InLoadOrderLinks.Blink->Flink = mod->InLoadOrderLinks.Flink;
                  break;
              }
          }
      }

syscall:
  direct_syscall:
    name: "Direct Syscall"
    desc: "Bypass ntdll hooks by calling syscall instruction directly"
    code: |
      // Manual syscall — bypasses all ntdll hooks
      // SSN (System Service Number) varies by Windows version
      extern "C" NTSTATUS NtReadVirtualMemory_Syscall(
          HANDLE ProcessHandle, PVOID BaseAddress,
          PVOID Buffer, SIZE_T NumberOfBytesToRead,
          PSIZE_T NumberOfBytesRead);

  syscall_stub:
    name: "Syscall Stub Generator"
    desc: "Generate syscall stubs from clean ntdll copy"

