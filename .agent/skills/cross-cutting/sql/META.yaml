name: sql
version: "6.1.2"
category: database
tier: 1

description: |
  SQL development patterns for PostgreSQL 16+, MySQL 8+.
  Covers query optimization, migrations, indexes, stored procedures.

triggers:
  file_patterns:
    - "*.sql"
    - "migrations/*.sql"
    - "*.pgsql"
  keywords:
    # Core
    - sql
    - query
    - database query
    - select from
    - insert into
    - update set
    - delete from
    # PostgreSQL
    - postgresql
    - postgres
    - psql
    - pg_dump
    - pgadmin
    # MySQL
    - mysql
    - mariadb
    # SQLite
    - sqlite
    # Features
    - join
    - left join
    - inner join
    - group by
    - order by
    - having
    - cte
    - window function
    - subquery
    - index
    - migration
    - stored procedure
    - trigger
    - view
    # ORM
    - raw sql
    - query builder
  intents:
    - write sql query
    - optimize query
    - create migration
    - database schema

related_skills:
  - database
  - python
  - go

prevent_confusion_with:
  - database: "SQL is query language, database skill covers ORMs"
