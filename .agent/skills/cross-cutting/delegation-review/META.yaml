name: delegation-review
display: Delegation Review Pipeline
category: cross-cutting
tier: 2
priority: 3

desc: "Use when dispatching an implementation task to a subagent — provides 2-stage review pipeline (spec compliance then code quality) with implementer 4-status protocol and subagent prompt templates."

trigger_desc: |
  Activate when reviewing subagent output, dispatching subagents for
  implementation review, verifying spec compliance of delegated work,
  or quality-checking code a subagent produced.

triggers:
  file_patterns: []
  keywords:
    - delegate
    - subagent
    - delegation review
    - spec compliance
    - code quality review
    - implementation review
    - 4-status
    - dispatch
    - review pipeline
  intents:
    - review subagent output
    - verify implementation quality
    - dispatch subagent for review
    - check spec compliance

caps:
  - 2-stage review pipeline (spec then quality)
  - 4-status implementer protocol (DONE/DONE_WITH_CONCERNS/BLOCKED/NEEDS_CONTEXT)
  - Spec compliance reviewer prompt template
  - Code quality reviewer prompt template
  - Implementer prompt template with self-review checklist
  - Escalation guidelines

links_to:
  - audit-pro
  - coding-rules
  - receiving-code-review
