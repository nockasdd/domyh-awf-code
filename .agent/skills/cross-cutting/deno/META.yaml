name: deno
version: "6.2.5"
category: runtime
tier: 3

desc: "Deno 2.6+ development patterns. Covers TypeScript-first, permissions, Fresh framework, npm/jsr compat, OpenTelemetry."

patterns:
  total: 27
  domains:
    runtime: 12
    security: 9
    tooling: 6

    - "deno.json"
    - "deno.jsonc"
    - "deno.lock"
    - "mod.ts"
    - "deps.ts"
  keywords:
    # Core
    - deno
    - deno 2
    - deno deploy
    - Deno.serve
    - Deno.openKv
    # Features
    - url import
    - permissions deno
    - deno compile
    - deno audit
    - jsr:
    - npm:
    # Security
    - "--allow-net"
    - "--allow-read"
    - "--allow-write"
    - "--allow-env"
    - "--deny-"
    # Framework
    - fresh framework
    - oak deno
    - hono deno
    # Testing
    - deno test
    - deno bench
    - Deno.test
  intents:
    - create deno project
    - deno api
    - fresh app
    - deno deploy
    - deno permissions

related_skills:
  - typescript
  - javascript
  - nodejs

prevent_confusion_with:
  - nodejs: "Deno uses URL imports, Node uses npm"
  - bun: "Deno is security-first, Bun is speed-first"
