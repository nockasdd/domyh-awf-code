  - id: item_054
    platform: flutter
    technology: Flutter
    technique: Staggered animation with Interval
    description: Cascading multi-step animations
    performance_rating: "5"
    example_code: |
      final controller = AnimationController(vsync: this, duration: Duration(milliseconds: 800));
      final fadeAnim = Tween(begin: 0.0, end: 1.0).animate(
        CurvedAnimation(parent: controller, curve: Interval(0.0, 0.5, curve: Curves.easeOut)));
      final slideAnim = Tween(begin: Offset(0, 0.3), end: Offset.zero).animate(
        CurvedAnimation(parent: controller, curve: Interval(0.2, 0.7, curve: Curves.easeOut)));
    avoid: Sequential await chains

