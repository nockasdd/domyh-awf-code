  # ── NEW: .NET MAUI ───────────────────────────────────────────

  - id: item_044
    platform: csharp
    technology: .NET MAUI
    technique: ViewExtensions animations
    description: Fluent animation API cho cross-platform
    performance_rating: "4"
    example_code: |
      await element.FadeTo(1, 300, Easing.CubicOut);
      await element.TranslateTo(0, -20, 200);
      await element.ScaleTo(1.1, 150).ContinueWith(_ => element.ScaleTo(1, 150));
    avoid: Custom timer-based animation

  - id: item_045
    platform: csharp
    technology: .NET MAUI
    technique: Animation class
    description: Complex composite animations
    performance_rating: "4"
    example_code: |
      var anim = new Animation(v => element.Opacity = v, 0, 1, Easing.CubicIn);
      anim.Add(0, 0.5, new Animation(v => element.TranslationY = v, 30, 0));
      anim.Commit(element, "FadeSlideIn", length: 400);
    avoid: Sequential await chains cho parallel animations

  # ── NEW: Avalonia Advanced ───────────────────────────────────

  - id: item_046
