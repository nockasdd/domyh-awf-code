  # ── NEW: General Desktop Best Practice ───────────────────────

  - id: item_058
    platform: all-desktop
    technology: General
    technique: 60fps animation budget
    description: Target 16.67ms per frame — allocate wisely
    performance_rating: reference
    example_code: |
      Frame Budget (60fps = 16.67ms):
      ├── Input handling: ~2ms
      ├── Animation tick: ~2ms
      ├── Layout/measure: ~4ms
      ├── Render/paint: ~6ms
      └── Buffer: ~2.67ms
      Total: 16.67ms
    avoid: Block main thread > 8ms during animation
