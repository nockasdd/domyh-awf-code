  - id: item_047
    platform: avalonia
    technology: Avalonia
    technique: Custom IPageTransition
    description: Implement custom transition effects
    performance_rating: "4"
    example_code: |
      public class FadeSlideTransition : IPageTransition {
        public async Task Start(Visual from, Visual to, bool forward, CancellationToken ct) {
          if (to != null) { to.Opacity = 0; await to.Animate().Opacity(1, TimeSpan.FromMilliseconds(300)); }
          if (from != null) { await from.Animate().Opacity(0, TimeSpan.FromMilliseconds(200)); }
        }
      }
    avoid: Abrupt page switches

