  # ── NEW: Windows Animation Manager (WAM) ─────────────────────

  - id: item_028
    platform: cpp
    technology: Windows Animation Manager
    technique: IUIAnimationManager2
    description: System-level animation orchestration cho Win32 apps — automatic pacing, priority queueing
    performance_rating: "5"
    example_code: |
      IUIAnimationManager2* mgr; CoCreateInstance(CLSID_UIAnimationManager2, ...);
      IUIAnimationTimer* timer; CoCreateInstance(CLSID_UIAnimationTimer, ...);
      mgr->SetManagerEventHandler(handler);
      IUIAnimationTransition2* trans;
      transLib->CreateAccelerateDecelerateTransition(0.3, 1.0, 0.4, 0.6, &trans);
      mgr->ScheduleTransition(var, trans, currentTime);
    avoid: Custom timer loops khi sử dụng WAM

  - id: item_029
    platform: cpp
    technology: Windows Animation Manager
    technique: Storyboard orchestration
    description: Coordinate multiple animation variables trên cùng timeline
    performance_rating: "5"
    example_code: |
      IUIAnimationStoryboard2* sb;
      mgr->CreateStoryboard(&sb);
      sb->AddTransition(xVar, transX);
      sb->AddTransition(yVar, transY);
      sb->Schedule(currentTime);
    avoid: Independent timers per animation variable

  # ── NEW: DirectComposition ───────────────────────────────────

  - id: item_030
    platform: cpp
    technology: DirectComposition
    technique: Independent compositor thread
    description: Animations chạy trên compositor thread riêng — không block UI thread
    performance_rating: "5"
    example_code: |
      IDCompositionDevice* device;
      DCompositionCreateDevice(dxgiDevice, IID_PPV_ARGS(&device));
      IDCompositionTarget* target;
      device->CreateTargetForHwnd(hwnd, TRUE, &target);
      IDCompositionVisual* visual;
      device->CreateVisual(&visual);
      // Animation runs independently of UI thread
    avoid: Main thread animation qua WM_PAINT

  - id: item_031
    platform: cpp
    technology: DirectComposition
    technique: Transform animations
    description: GPU-accelerated transform trên visual tree
    performance_rating: "5"
    example_code: |
      IDCompositionScaleTransform* scale;
      device->CreateScaleTransform(&scale);
      IDCompositionAnimation* anim;
      device->CreateAnimation(&anim);
      anim->AddCubic(0.0, 1.0, 0.5, 0.0, 0.0); // cubic bezier
      scale->SetScaleX(anim);
      visual->SetTransform(scale);
    avoid: Software-rendered transform

  # ── NEW: WinUI 3 Advanced ───────────────────────────────────

  - id: item_032
    platform: csharp
    technology: WinUI 3
    technique: Spring Animation
    description: Physics-based spring motion — natural feel
    performance_rating: "5"
    example_code: |
      var spring = compositor.CreateSpringScalarAnimation();
      spring.DampingRatio = 0.6f;
      spring.Period = TimeSpan.FromMilliseconds(150);
      spring.FinalValue = 1.0f;
      visual.StartAnimation("Scale.X", spring);
    avoid: Linear keyframe cho interactive responses

  - id: item_033
