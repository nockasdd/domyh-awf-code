patterns:
  - id: item_001
    platform: cpp
    technology: DirectX 12
    technique: Batch Rendering
    description: Combine multiple draw calls into single batch
    performance_rating: "5"
    example_code: commandList->DrawIndexedInstanced(count, instances, 0, 0, 0);
    avoid: Individual draw calls per object
  - id: item_002
    platform: cpp
    technology: DirectX 12
    technique: Instancing
    description: GPU draws same geometry with different transforms
    performance_rating: "5"
    example_code: D3D12_INPUT_ELEMENT_DESC with D3D12_INPUT_CLASSIFICATION_PER_INSTANCE_DATA
    avoid: Unique buffers for identical meshes
  - id: item_003
    platform: cpp
    technology: DirectX 12
    technique: Swap Chain
    description: Double/triple buffering for smooth frame display
    performance_rating: "5"
    example_code: IDXGISwapChain4, Present1() with DXGI_SWAP_EFFECT_FLIP_DISCARD
    avoid: Single buffer rendering
  - id: item_004
    platform: cpp
    technology: DirectX 12
    technique: Frustum Culling
    description: Skip rendering objects outside camera view
    performance_rating: "4"
    example_code: BoundingFrustum::Contains(boundingBox) != ContainmentType::Disjoint
    avoid: Render all objects unconditionally
  - id: item_005
    platform: cpp
    technology: DirectX 12
    technique: Occlusion Culling
    description: Skip hidden objects using GPU queries
    performance_rating: "4"
    example_code: ID3D12QueryHeap TYPE_OCCLUSION, BeginQuery/EndQuery
    avoid: Render occluded geometry
