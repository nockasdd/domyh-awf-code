  # ── NEW: Dear ImGui ──────────────────────────────────────────

  - id: item_039
    platform: cpp
    technology: Dear ImGui
    technique: Lerp-based animation
    description: Per-frame interpolation trong immediate mode GUI
    performance_rating: "4"
    example_code: |
      static float progress = 0.0f;
      float target = is_open ? 1.0f : 0.0f;
      progress += (target - progress) * ImGui::GetIO().DeltaTime * 8.0f;
      // Use progress for alpha, position, size
      ImGui::SetNextWindowBgAlpha(progress);
    avoid: Abrupt state changes without lerp

  - id: item_040
    platform: cpp
    technology: Dear ImGui
    technique: Custom drawing with AnimateValue
    description: Smooth numeric transitions cho UI values
    performance_rating: "4"
    example_code: |
      static float displayed_value = 0;
      displayed_value = displayed_value + (actual_value - displayed_value) * 0.1f;
      ImGui::ProgressBar(displayed_value / max_value);
    avoid: Instant value jumps in UI

