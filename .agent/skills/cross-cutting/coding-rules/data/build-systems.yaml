    build_system: CMake 4.0
    primary_file: CMakeLists.txt
    secondary_files: CMakeCache.txt;CMakePresets.json
    version_indicator: cmake_minimum_required(VERSION 4.0)
    build_command: cmake --build build --config Release -j8
    clean_command: cmake --build build --target clean
    test_command: ctest --test-dir build --output-on-failure
