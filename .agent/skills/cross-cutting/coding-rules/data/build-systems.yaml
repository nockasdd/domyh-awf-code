patterns:
  - id: item_001
    language: C++
    build_system: Visual Studio 2026
    primary_file: "*.slnx"
    secondary_files: "*.vcxproj;*.vcxproj.filters"
    version_indicator: PlatformToolset=v145 (VS2026)
    build_command: msbuild {sln} /p:Configuration=Release /p:Platform=x64
    clean_command: msbuild {sln} /t:Clean
  - id: item_002
    language: C++
    build_system: Visual Studio 2022
