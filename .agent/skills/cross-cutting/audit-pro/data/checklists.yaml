          - ARCH-002 | Open/Closed (extensible, not modifiable) | P2
          - ARCH-003 | Liskov Substitution (subtypes replaceable) | P3
          - ARCH-004 | Interface Segregation (small interfaces) | P2
          - ARCH-005 | Dependency Inversion (abstractions) | P2
      patterns:
        label: "📐 Design Patterns"
