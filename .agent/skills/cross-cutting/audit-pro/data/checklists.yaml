# ════════════════════════════════════════════════════════════════
# ACTIVATION RULES — Auto-detection for conditional experts
# ════════════════════════════════════════════════════════════════

activation_rules:
  always_active: [security, architecture, performance, quality, devops]
  has_ui:
    detect_files: ["*.vue", "*.tsx", "*.jsx", "*.svelte", "*.html", "*.css", "*.swift", "*.dart"]
    detect_deps: ["react", "vue", "angular", "svelte", "next", "nuxt", "flutter", "tailwindcss"]
    experts: [ux]
  has_database:
    detect_files: ["*.sql", "*.prisma", "schema.prisma", "drizzle.config.*"]
    detect_deps: ["prisma", "drizzle", "typeorm", "sequelize", "mongoose", "gorm", "sqlalchemy"]
    experts: [data]
  is_regulated:
    detect_files: ["HIPAA*", "GDPR*", "privacy-policy*", "compliance*"]
    detect_code: ["consent", "data_subject", "right_to_delete", "pii"]
    user_input: true
    experts: [compliance]
  scope_full:
    trigger: "scope_option IN [FULL_AUDIT, 1]"
    user_input: true
    experts: [product]
  is_production:
    detect_files: ["Dockerfile", "docker-compose.*", "*.tf", "Procfile", "fly.toml"]
    detect_dirs: ["deploy/", "infra/", ".github/workflows/"]
    experts: [reliability]
  has_infra:
    detect_files: ["*.tf", "*.tfvars", "pulumi.*", "cloudformation.*"]
    detect_dirs: ["terraform/", "infra/", "cdk/"]
    experts: [cloud]
  has_ai:
    detect_deps: ["openai", "langchain", "llama-index", "transformers", "torch", "tensorflow", "anthropic"]
    detect_code: ["system_prompt", "ChatCompletion", "llm.", "embeddings"]
    experts: [ai_safety]

# ════════════════════════════════════════════════════════════════
# SCOPE MAPPING — Expert subsets by audit scope
# ════════════════════════════════════════════════════════════════

scope_mapping:
  FULL_AUDIT: all
  BACKEND: [security, architecture, performance, quality, devops, data, reliability]
  FRONTEND: [security, quality, ux, performance]
  SECURITY_ONLY: [security, compliance]
  CUSTOM: user_selected

# ════════════════════════════════════════════════════════════════
# OVERRIDE — User can force include/exclude experts
# ════════════════════════════════════════════════════════════════

override:
  force_include: "--experts security,ux,compliance"
  force_exclude: "--skip ux,ai_safety"

