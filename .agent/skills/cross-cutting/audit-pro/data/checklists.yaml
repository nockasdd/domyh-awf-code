# Audit Pro — 12-Expert Panel Checklists (Bilingual EN/VN)
# Format: id | check | severity | tools (optional)
# Standards: ISO 25010, CWE Top 25, OWASP Top 10, WCAG 2.2, GDPR, SOC2
# Activation: always (core 5) | conditional (7 experts, auto-detect)

experts:
  # ════════════════════════════════════════════════════════════════
  # CORE EXPERTS — Always Active (5)
  # ════════════════════════════════════════════════════════════════

  security:
    name_en: "Principal Security Architect"
    name_vi: "Kiến trúc sư An ninh Chính"
    persona_en: "David Chen"
    persona_vi: "Minh"
    experience: "15 years"
    seniority: "Principal"
    activation:
      mode: always
    focus: Vulnerabilities, Authentication, Data Protection, Supply Chain
    standards: [OWASP Top 10, CWE Top 25, NIST, ISO 27001]
    checklists:
      authentication:
        label: "🔐 Authentication & Authorization"
        items:
          - SEC-001 | JWT token validation & expiration | P0 | grep_search: jwt,token,verify
          - SEC-002 | Session management security | P1 | grep_search: session,cookie
          - SEC-003 | Password hashing (bcrypt/argon2) | P0 | grep_search: password,hash,bcrypt
          - SEC-004 | OAuth/SSO implementation | P1
          - SEC-005 | Role-based access control (RBAC) | P1
          - SEC-006 | API key management | P1 | grep_search: api_key,apiKey
      cwe_top_25:
        label: "🛡️ CWE Top 25 (2024)"
        items:
          - SEC-007 | CWE-79: XSS vulnerabilities | P0 | grep_search: innerHTML,dangerouslySetInnerHTML
          - SEC-008 | CWE-89: SQL Injection | P0 | grep_search: db.Query,db.Exec,raw SQL
          - SEC-009 | CWE-78: OS Command Injection | P0 | grep_search: exec,system,popen
          - SEC-010 | CWE-22: Path Traversal | P0 | grep_search: filepath,path.Join
          - SEC-011 | CWE-352: CSRF protection | P1
          - SEC-012 | CWE-287: Authentication bypass | P0
          - SEC-013 | CWE-862: Missing authorization | P0
      owasp_top_10:
        label: "🌐 OWASP Top 10 (2021)"
        items:
          - SEC-014 | A01: Broken Access Control | P0
          - SEC-015 | A02: Cryptographic Failures | P0
          - SEC-016 | A03: Injection | P0
          - SEC-017 | A05: Security Misconfiguration | P1
          - SEC-018 | A07: Auth Failures | P0
          - SEC-019 | A09: Logging Failures | P1
      secrets:
        label: "🔒 Secrets & Data"
        items:
          - SEC-020 | No hardcoded secrets | P0 | grep_search: password,secret,api_key,token
          - SEC-021 | .env files not in git | P0 | find_by_name: .env*,credentials.*,*.key
          - SEC-022 | Sensitive data encryption | P1
          - SEC-023 | Audit logging for sensitive ops | P2
      supply_chain:
        label: "📦 Supply Chain Security"
        items:
          - SEC-024 | SBOM (Software Bill of Materials) generated | P2
          - SEC-025 | Dependency vulnerability scanning | P1 | grep_search: dependabot,renovate,snyk
          - SEC-026 | Lock file integrity (package-lock, go.sum) | P1
          - SEC-027 | No typosquatting risk in deps | P2
          - SEC-028 | AI input/output guardrails (if applicable) | P1

  architecture:
