# Audit Pro — Scoring & Grading System v2
# Supports 12-Expert Panel + supplementary checklists
# 11 weight profiles (6 original + 5 new for non-web projects)

scoring:
  scale: 10
  formula: weighted_average(active_expert_scores)

  # Default weights (5 core experts only)
  weights:
    {
      security: 0.30,
      architecture: 0.20,
      performance: 0.20,
      quality: 0.15,
      devops: 0.15,
    }

  # Weight profiles for different audit scopes
  # Note: when conditional experts are skipped, their weight
  # redistributes proportionally to remaining active experts
  weight_profiles:
    default:
      security: 0.30
      architecture: 0.20
      performance: 0.20
      quality: 0.15
      devops: 0.15
    full_audit:
      security: 0.18
      architecture: 0.12
      performance: 0.10
      quality: 0.10
      devops: 0.08
      ux: 0.06
      data: 0.06
      compliance: 0.06
      product: 0.06
      reliability: 0.06
      cloud: 0.06
      ai_safety: 0.06
    backend_focus:
      security: 0.25
      architecture: 0.20
      performance: 0.20
      quality: 0.10
      devops: 0.10
      data: 0.10
      reliability: 0.05
    frontend_focus:
      security: 0.15
      quality: 0.20
      ux: 0.25
      performance: 0.20
      architecture: 0.10
      product: 0.10
    security_focus:
      security: 0.35
      compliance: 0.30
      architecture: 0.10
      quality: 0.10
      devops: 0.15
    ai_ml_focus:
      ai_safety: 0.25
      security: 0.20
      data: 0.15
      reliability: 0.15
      performance: 0.15
      quality: 0.10
    # NEW v2 profiles — non-web project types
    desktop_app:
      security: 0.20
      architecture: 0.25
      performance: 0.20
      quality: 0.15
      devops: 0.10
      ux: 0.10
    cli_tool:
      security: 0.15
      architecture: 0.25
      quality: 0.25
      performance: 0.15
      devops: 0.10
      product: 0.10
    library_sdk:
      architecture: 0.30
      quality: 0.25
      security: 0.20
      performance: 0.15
      devops: 0.10
    mobile_app:
      ux: 0.20
      security: 0.25
      performance: 0.20
      quality: 0.15
      architecture: 0.10
      devops: 0.10
    mcp_plugin:
      security: 0.25
      architecture: 0.25
      quality: 0.20
      performance: 0.15
      devops: 0.15

  redistribution:
    method: proportional
    description: "When a conditional expert is inactive, its weight is redistributed proportionally to remaining active experts"

  # level | label | meaning | sla | penalty
  priorities:
    - P0 | 🔴 Critical | Security/Data loss risk | Fix immediately | -2.0
    - P1 | 🟠 High | Affects core functionality | Fix before deploy | -1.0
    - P2 | 🟡 Medium | Should fix soon | Fix this sprint | -0.5
    - P3 | 🟢 Low | Nice to have | Backlog | -0.1

  # range | label | action
  grades:
    - 9.0-10.0 | 🏆 Production Ready | Deploy with confidence
    - 7.0-8.9 | ✅ Ready with minor fixes | Fix P1s before deploy
    - 5.0-6.9 | ⚠️ Needs work | Address P0/P1 before deploy
    - 3.0-4.9 | 🚫 Not ready | Significant remediation needed
    - 0.0-2.9 | ❌ Critical issues | Do not deploy, major rework

  # id | label | estimate | coverage | use_case
  scope_options:
    - 1 | 🔴 FULL AUDIT | ~2h | All 12 experts + supplementary | Pre-production, Major releases
    - 2 | 🟠 BACKEND | ~1h | Core 5 + Data + Reliability | Backend changes, API updates
    - 3 | 🟡 FRONTEND | ~30m | Security + Quality + UX + Perf | UI changes, UX updates
    - 4 | 🟢 SECURITY ONLY | ~1h | Security + Compliance | Security review, Compliance
    - 5 | 🔵 DESKTOP APP | ~1h | Core 5 + Desktop supplement | Electron/Tauri apps
    - 6 | 🟣 CLI TOOL | ~30m | Core 5 + CLI supplement | Command-line tools
    - 7 | ⚪ LIBRARY/SDK | ~45m | Core 5 + Library supplement | Published packages
    - 8 | 📱 MOBILE APP | ~1h | Core 5 + UX + Mobile security | iOS/Android apps
    - 9 | 🔌 MCP PLUGIN | ~45m | Core 5 + MCP supplement | MCP servers/plugins
    - 10 | 🔵 CUSTOM | ? | User-defined | Specific areas of concern

  consensus:
    voting: Weighted average by severity
    conflicts: Highlight disagreements
    final: Human arbitration for P0
    confidence: { high: ">80%", medium: "60-80%", low: "<60% → flag" }
