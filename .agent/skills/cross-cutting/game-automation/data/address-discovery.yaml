# =====================================================
# Address Discovery Methods — 12 Techniques
# =====================================================
# Comprehensive guide to finding function/data addresses
# in game binaries without static offsets.

# ── 1. PE Export Table Walking ──────────────────────
pe_analysis:
  export_walk:
    name: "Manual GetProcAddress (EAT Walking)"
    category: binary
    desc: "Walk PE export directory to resolve function addresses without calling GetProcAddress"
    code: |
      uintptr_t ManualGetProcAddress(HMODULE module, std::string_view funcName) {
          auto dosHeader = reinterpret_cast<PIMAGE_DOS_HEADER>(module);
          auto ntHeaders = reinterpret_cast<PIMAGE_NT_HEADERS>(
              (uint8_t*)module + dosHeader->e_lfanew);
          auto& exportDir = ntHeaders->OptionalHeader.DataDirectory[IMAGE_DIRECTORY_ENTRY_EXPORT];
          if (!exportDir.VirtualAddress) return 0;
          auto exports = reinterpret_cast<PIMAGE_EXPORT_DIRECTORY>(
              (uint8_t*)module + exportDir.VirtualAddress);
          auto names    = (DWORD*)((uint8_t*)module + exports->AddressOfNames);
          auto ordinals = (WORD*)((uint8_t*)module + exports->AddressOfNameOrdinals);
          auto funcs    = (DWORD*)((uint8_t*)module + exports->AddressOfFunctions);
          for (DWORD i = 0; i < exports->NumberOfNames; ++i) {
              auto name = (const char*)((uint8_t*)module + names[i]);
              if (funcName == name)
                  return (uintptr_t)module + funcs[ordinals[i]];
          }
          return 0;
      }
    use_case: "Stealth API resolution without import entries"
    tags: [pe, export, stealth, address_finding]

  import_scan:
    name: "IAT Scanner"
    category: binary
    desc: "Walk Import Address Table to find all imported function addresses"
    code: |
      void DumpImports(HMODULE module) {
          auto dosHeader = reinterpret_cast<PIMAGE_DOS_HEADER>(module);
          auto ntHeaders = reinterpret_cast<PIMAGE_NT_HEADERS>(
              (uint8_t*)module + dosHeader->e_lfanew);
          auto& importDir = ntHeaders->OptionalHeader.DataDirectory[IMAGE_DIRECTORY_ENTRY_IMPORT];
          auto importDesc = reinterpret_cast<PIMAGE_IMPORT_DESCRIPTOR>(
              (uint8_t*)module + importDir.VirtualAddress);
          while (importDesc->Name) {
              auto dllName = (const char*)((uint8_t*)module + importDesc->Name);
              auto thunk = reinterpret_cast<PIMAGE_THUNK_DATA>(
                  (uint8_t*)module + importDesc->FirstThunk);
              auto origThunk = reinterpret_cast<PIMAGE_THUNK_DATA>(
                  (uint8_t*)module + importDesc->OriginalFirstThunk);
              while (origThunk->u1.AddressOfData) {
                  if (!(origThunk->u1.Ordinal & IMAGE_ORDINAL_FLAG)) {
                      auto hint = reinterpret_cast<PIMAGE_IMPORT_BY_NAME>(
                          (uint8_t*)module + origThunk->u1.AddressOfData);
                      // hint->Name = function name, thunk->u1.Function = resolved address
                  }
                  ++thunk; ++origThunk;
              }
              ++importDesc;
          }
      }
    tags: [pe, import, iat, address_finding]

  section_scan:
    name: "PE Section Finder"
    category: binary
    desc: "Find .text/.data/.rdata section boundaries for targeted scanning"
    code: |
      struct SectionInfo { uintptr_t base; size_t size; std::string name; };
      std::vector<SectionInfo> GetSections(HMODULE module) {
          auto dos = reinterpret_cast<PIMAGE_DOS_HEADER>(module);
          auto nt  = reinterpret_cast<PIMAGE_NT_HEADERS>((uint8_t*)module + dos->e_lfanew);
          auto sec = IMAGE_FIRST_SECTION(nt);
          std::vector<SectionInfo> result;
          for (WORD i = 0; i < nt->FileHeader.NumberOfSections; ++i, ++sec) {
              result.push_back({
                  (uintptr_t)module + sec->VirtualAddress,
                  sec->Misc.VirtualSize,
                  std::string((char*)sec->Name, 8)
              });
          }
          return result;
      }
    tags: [pe, section, scanning]

# ── 2. RTTI-Based Discovery ─────────────────────────
rtti:
  vtable_from_rtti:
    name: "Find VTable via RTTI Class Name"
    category: rtti
    desc: "Scan .rdata for RTTI TypeDescriptor, backtrack to find VTable address"
    code: |
      // MSVC RTTI layout:
      // VTable[-1] = pointer to RTTICompleteObjectLocator
      // RTTICompleteObjectLocator -> TypeDescriptor -> mangled class name
      uintptr_t FindVTableByClassName(uintptr_t moduleBase, size_t moduleSize,
                                       std::string_view mangledName) {
          auto base = reinterpret_cast<const uint8_t*>(moduleBase);
          // Step 1: Find TypeDescriptor with ".?AVClassName@@" pattern
          for (size_t i = 0; i < moduleSize - mangledName.size(); ++i) {
              if (memcmp(base + i, mangledName.data(), mangledName.size()) == 0) {
                  // TypeDescriptor starts 2 * sizeof(void*) before the name string
                  uintptr_t typeDescAddr = moduleBase + i - 2 * sizeof(void*);
                  // Step 2: Scan for pointers to this TypeDescriptor in COL
                  // Step 3: Scan for pointers to COL → that address + sizeof(void*) = vtable
                  return ScanForVTableRef(moduleBase, moduleSize, typeDescAddr);
              }
          }
          return 0;
      }
    naming_convention:
      msvc: ".?AVClassName@@"
      gcc: "N9ClassName"
    tags: [rtti, vtable, class_discovery, advanced]

  instance_finder:
    name: "Find Class Instances by VTable Pointer"
    category: rtti
    desc: "Once VTable address is known, scan heap/stack for objects pointing to it"
    code: |
      std::vector<uintptr_t> FindInstances(HANDLE hProcess, uintptr_t vtableAddr) {
          std::vector<uintptr_t> instances;
          MEMORY_BASIC_INFORMATION mbi{};
          uintptr_t addr = 0;
          while (VirtualQueryEx(hProcess, (LPCVOID)addr, &mbi, sizeof(mbi))) {
              if (mbi.State == MEM_COMMIT && (mbi.Protect & PAGE_READWRITE)) {
                  std::vector<uint8_t> buffer(mbi.RegionSize);
                  SIZE_T bytesRead{};
                  if (ReadProcessMemory(hProcess, mbi.BaseAddress, buffer.data(),
                                         mbi.RegionSize, &bytesRead)) {
                      for (size_t i = 0; i + sizeof(uintptr_t) <= bytesRead; i += sizeof(uintptr_t)) {
                          if (*reinterpret_cast<uintptr_t*>(buffer.data() + i) == vtableAddr)
                              instances.push_back((uintptr_t)mbi.BaseAddress + i);
                      }
                  }
              }
              addr = (uintptr_t)mbi.BaseAddress + mbi.RegionSize;
          }
          return instances;
      }
    tags: [rtti, heap_scan, instance_finding]

# ── 3. String Reference (Xref) Search ──────────────
string_search:
  utf8_scan:
    name: "UTF-8 String Scanner"
    category: string
    desc: "Find ASCII/UTF-8 strings in process memory"
    code: |
      std::vector<uintptr_t> FindString(HANDLE hProcess, uintptr_t start, size_t size,
                                          std::string_view target) {
          std::vector<uintptr_t> results;
          std::vector<uint8_t> buffer(size);
          SIZE_T bytesRead{};
          ReadProcessMemory(hProcess, (LPCVOID)start, buffer.data(), size, &bytesRead);
          for (size_t i = 0; i <= bytesRead - target.size(); ++i) {
              if (memcmp(buffer.data() + i, target.data(), target.size()) == 0)
                  results.push_back(start + i);
          }
          return results;
      }
    tags: [string, utf8, search]

  utf16_scan:
    name: "UTF-16 (Wide String) Scanner"
    category: string
    desc: "Find wchar_t/UTF-16LE strings — common in game UI text"
    code: |
      std::vector<uintptr_t> FindWString(HANDLE hProcess, uintptr_t start, size_t size,
                                            std::wstring_view target) {
          auto byteLen = target.size() * sizeof(wchar_t);
          std::vector<uint8_t> buffer(size);
          SIZE_T bytesRead{};
          ReadProcessMemory(hProcess, (LPCVOID)start, buffer.data(), size, &bytesRead);
          std::vector<uintptr_t> results;
          for (size_t i = 0; i <= bytesRead - byteLen; i += 2) {
              if (memcmp(buffer.data() + i, target.data(), byteLen) == 0)
                  results.push_back(start + i);
          }
          return results;
      }
    tags: [string, utf16, wide, search]

  string_xref:
    name: "String Cross-Reference Finder"
    category: string
    desc: "After finding string address, scan .text for LEA/MOV instructions referencing it"
    code: |
      // x64: LEA uses RIP-relative addressing
      // Find instructions that reference a known string address
      uintptr_t FindXRef(const uint8_t* textBase, size_t textSize,
                          uintptr_t stringAddr) {
          for (size_t i = 0; i < textSize - 7; ++i) {
              // LEA reg, [rip+disp32] — opcode: 48 8D 0D/15/05/... XX XX XX XX
              if (textBase[i] == 0x48 && textBase[i + 1] == 0x8D) {
                  int32_t disp = *(int32_t*)(textBase + i + 3);
                  uintptr_t instrAddr = (uintptr_t)(textBase + i);
                  uintptr_t target = instrAddr + 7 + disp;
                  if (target == stringAddr) return instrAddr;
              }
          }
          return 0;
      }
    notes:
      - "x86: search for PUSH/MOV with absolute 32-bit string address"
      - "x64: search for LEA with RIP-relative displacement"
    tags: [string, xref, code_analysis]

  encrypted_string_detect:
    name: "Encrypted String Detection"
    category: string
    desc: "Detect and decode XOR/ROT encrypted strings at runtime"
    methods:
      xor: "Single-byte or multi-byte XOR — look for XOR loop before string usage"
      rot: "ROT-N cipher — search for add/sub byte in loop"
      stack_string: "Strings built char-by-char on stack (mov byte [rbp-N], 'X')"
      aes_runtime: "AES decryption at startup — set breakpoint on CryptDecrypt/BCryptDecrypt"
    detection: |
      1. Set breakpoint on string display function
      2. Trace backwards to find decryption routine
      3. Extract key and ciphertext
      4. Replicate decryption offline
    tags: [string, encryption, decrypt, reverse_engineering]

# ── 4. Memory Region Enumeration ────────────────────
memory_regions:
  virtual_query_scan:
    name: "Memory Region Enumerator"
    category: memory
    desc: "Walk all memory regions to find executable/writable allocations"
    code: |
      struct MemRegion {
          uintptr_t base; size_t size; DWORD protect; DWORD state; DWORD type;
      };
      std::vector<MemRegion> EnumRegions(HANDLE hProcess, DWORD filterState = MEM_COMMIT,
                                           DWORD filterProtect = 0) {
          std::vector<MemRegion> regions;
          MEMORY_BASIC_INFORMATION mbi{};
          uintptr_t addr = 0;
          while (VirtualQueryEx(hProcess, (LPCVOID)addr, &mbi, sizeof(mbi))) {
              if (mbi.State & filterState) {
                  if (!filterProtect || (mbi.Protect & filterProtect))
                      regions.push_back({(uintptr_t)mbi.BaseAddress, mbi.RegionSize,
                                          mbi.Protect, mbi.State, mbi.Type});
              }
              addr = (uintptr_t)mbi.BaseAddress + mbi.RegionSize;
          }
          return regions;
      }
    use_cases:
      - "Find injected code: scan for MEM_COMMIT + PAGE_EXECUTE_READWRITE"
      - "Find heap objects: MEM_COMMIT + PAGE_READWRITE + MEM_PRIVATE"
      - "Map game module layout: all committed regions"
    tags: [memory, enumeration, virtual_query]

  allocation_tracker:
    name: "New Allocation Detector"
    category: memory
    desc: "Compare snapshots to detect newly allocated memory regions"
    code: |
      auto before = EnumRegions(hProcess);
      // ... trigger game event ...
      auto after = EnumRegions(hProcess);
      // Diff to find new allocations
      for (auto& r : after) {
          bool isNew = std::ranges::none_of(before,
              [&](auto& b) { return b.base == r.base; });
          if (isNew) { /* new allocation found */ }
      }
    tags: [memory, tracking, dynamic]

# ── 5. E8 Relative Call Scanning ────────────────────
call_scanning:
  e8_call_finder:
    name: "E8 Near Call Scanner"
    category: instruction
    desc: "Scan for CALL rel32 instructions targeting a known function"
    code: |
      // E8 XX XX XX XX — target = RIP + 5 + displacement
      std::vector<uintptr_t> FindCallsTo(const uint8_t* code, size_t size,
                                           uintptr_t codeBase, uintptr_t targetFunc) {
          std::vector<uintptr_t> callers;
          for (size_t i = 0; i < size - 5; ++i) {
              if (code[i] == 0xE8) {
                  int32_t disp = *(int32_t*)(code + i + 1);
                  uintptr_t callTarget = codeBase + i + 5 + disp;
                  if (callTarget == targetFunc)
                      callers.push_back(codeBase + i);
              }
          }
          return callers;
      }
    notes:
      - "E8 = near CALL with 32-bit signed displacement"
      - "FF 15 = indirect CALL via memory (IAT calls)"
      - "E9 = near JMP — same displacement format"
    tags: [instruction, call, e8, address_finding]

  rip_relative_resolver:
    name: "RIP-Relative Address Resolver"
    category: instruction
    desc: "Resolve absolute address from x64 RIP-relative instructions"
    code: |
      // Common RIP-relative patterns:
      // MOV reg, [rip+disp32]     — 48 8B 0D XX XX XX XX
      // LEA reg, [rip+disp32]     — 48 8D 0D XX XX XX XX
      // CMP [rip+disp32], imm     — 48 83 3D XX XX XX XX YY
      uintptr_t ResolveRIPRelative(uintptr_t instrAddr, int dispOffset, int instrLen) {
          int32_t disp = *(int32_t*)(instrAddr + dispOffset);
          return instrAddr + instrLen + disp;
      }
      // Usage: after finding pattern "48 8B 0D ? ? ? ?"
      // auto globalVar = ResolveRIPRelative(patternAddr, 3, 7);
    tags: [x64, rip_relative, address_resolution]

# ── 6. Function Prologue Detection ──────────────────
func_detection:
  prologue_scan:
    name: "Function Prologue Scanner"
    category: code_analysis
    desc: "Find function starts by common prologue patterns"
    patterns:
      x64:
        - "48 89 5C 24 ??"           # mov [rsp+??], rbx
        - "40 53 48 83 EC"           # push rbx; sub rsp, N
        - "48 83 EC ??"              # sub rsp, N
        - "55 48 8B EC"              # push rbp; mov rbp, rsp
        - "40 55 48 8D 6C 24"       # push rbp; lea rbp, [rsp+N]
      x86:
        - "55 8B EC"                 # push ebp; mov ebp, esp
        - "55 89 E5"                 # push ebp; mov ebp, esp (gcc)
        - "53 8B DC"                 # push ebx; mov ebx, esp
    code: |
      bool IsFunctionStart(const uint8_t* addr) {
          // x64 common prologues
          if (addr[0] == 0x48 && addr[1] == 0x89 && addr[2] == 0x5C) return true;
          if (addr[0] == 0x40 && addr[1] == 0x53) return true;
          if (addr[0] == 0x48 && addr[1] == 0x83 && addr[2] == 0xEC) return true;
          if (addr[0] == 0x55 && addr[1] == 0x48 && addr[2] == 0x8B) return true;
          // INT3 padding before function
          if (addr[-1] == 0xCC && addr[0] != 0xCC) return true;
          return false;
      }
    tags: [code_analysis, prologue, function_finding]

  cc_boundary:
    name: "INT3 Boundary Scanner"
    category: code_analysis
    desc: "Functions separated by 0xCC (int3) padding — scan for boundaries"
    code: |
      std::vector<uintptr_t> FindFunctionsByCC(const uint8_t* code, size_t size,
                                                 uintptr_t base) {
          std::vector<uintptr_t> funcs;
          bool inPadding = false;
          for (size_t i = 0; i < size; ++i) {
              if (code[i] == 0xCC) {
                  inPadding = true;
              } else if (inPadding) {
                  funcs.push_back(base + i);
                  inPadding = false;
              }
          }
          return funcs;
      }
    tags: [code_analysis, int3, boundary]

# ── 7. Module Export Hash (API Hashing) ─────────────
api_hashing:
  djb2_hash:
    name: "DJB2 API Name Hashing"
    category: stealth
    desc: "Resolve APIs by hash instead of name — avoids string detection"
    code: |
      constexpr uint32_t HashDJB2(const char* str) {
          uint32_t hash = 5381;
          while (*str) hash = ((hash << 5) + hash) + *str++;
          return hash;
      }
      uintptr_t GetProcByHash(HMODULE module, uint32_t targetHash) {
          auto dos = reinterpret_cast<PIMAGE_DOS_HEADER>(module);
          auto nt  = reinterpret_cast<PIMAGE_NT_HEADERS>((uint8_t*)module + dos->e_lfanew);
          auto& ed = nt->OptionalHeader.DataDirectory[IMAGE_DIRECTORY_ENTRY_EXPORT];
          auto exports = reinterpret_cast<PIMAGE_EXPORT_DIRECTORY>((uint8_t*)module + ed.VirtualAddress);
          auto names = (DWORD*)((uint8_t*)module + exports->AddressOfNames);
          auto ordinals = (WORD*)((uint8_t*)module + exports->AddressOfNameOrdinals);
          auto funcs = (DWORD*)((uint8_t*)module + exports->AddressOfFunctions);
          for (DWORD i = 0; i < exports->NumberOfNames; ++i) {
              auto name = (const char*)((uint8_t*)module + names[i]);
              if (HashDJB2(name) == targetHash)
                  return (uintptr_t)module + funcs[ordinals[i]];
          }
          return 0;
      }
    hash_examples:
      LoadLibraryA: 0x0726774C
      GetProcAddress: 0x7C0DFCAA
    tags: [api_hash, stealth, shellcode]

# ── 8. Constant/Magic Number Search ────────────────
constant_search:
  float_scan:
    name: "Float Constant Scanner"
    category: data
    desc: "Search for known game constants (gravity, speed, etc.)"
    examples:
      - "9.81f — gravity constant"
      - "3.14159f — pi for angle calculations"
      - "0x3F800000 — IEEE 754 float 1.0"
    code: |
      template<typename T>
      std::vector<uintptr_t> FindValue(HANDLE hProcess, uintptr_t start, size_t size,
                                         T value) {
          std::vector<uint8_t> buffer(size);
          SIZE_T bytesRead{};
          ReadProcessMemory(hProcess, (LPCVOID)start, buffer.data(), size, &bytesRead);
          std::vector<uintptr_t> results;
          for (size_t i = 0; i <= bytesRead - sizeof(T); ++i) {
              if (*reinterpret_cast<T*>(buffer.data() + i) == value)
                  results.push_back(start + i);
          }
          return results;
      }
    tags: [data, constant, float, search]

  struct_fingerprint:
    name: "Structure Fingerprint Scanner"
    category: data
    desc: "Find structures by known field layout patterns"
    example: |
      // Player struct fingerprint: health(int) at +0x100, mana(int) at +0x104
      // Scan for adjacent values: health=100, mana=50
      // Search for bytes: 64 00 00 00 32 00 00 00 at aligned addresses
    tags: [data, struct, fingerprint]
