name: bun
version: "6.1.2"
category: runtime
tier: 2

description: |
  Bun runtime development patterns.
  Covers all-in-one JS runtime, bundler, test runner, package manager.

triggers:
  file_patterns:
    - "bun.lockb"
    - "bunfig.toml"
  keywords:
    # Core
    - bun
    - bun runtime
    - bun js
    # Features
    - bun install
    - bun run
    - bun build
    - bun test
    # Ecosystem
    - elysia
    - hono bun
  intents:
    - create bun project
    - bun api
    - bun server
    - migrate to bun

related_skills:
  - typescript
  - nodejs

prevent_confusion_with:
  - nodejs: "Bun is faster, uses bun.lockb"
  - deno: "Bun uses npm, Deno uses URL imports"
