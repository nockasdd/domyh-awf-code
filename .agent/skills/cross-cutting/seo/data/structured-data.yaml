# Structured Data Patterns

schemas:
  - type: Article
    required: ["headline", "author", "datePublished", "image"]
    template: |
      {
        "@context": "https://schema.org",
        "@type": "Article",
        "headline": "{{title}}",
        "author": { "@type": "Person", "name": "{{author}}" },
        "datePublished": "{{date}}",
        "image": "{{image_url}}"
      }

  - type: Product
    required: ["name", "description", "offers"]
    template: |
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "{{name}}",
        "description": "{{description}}",
        "image": "{{image_url}}",
        "offers": {
          "@type": "Offer",
          "price": "{{price}}",
          "priceCurrency": "{{currency}}",
          "availability": "https://schema.org/InStock"
        }
      }

  - type: FAQPage
    template: |
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "{{question}}",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "{{answer}}"
            }
          }
        ]
      }

  - type: BreadcrumbList
    template: |
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Home", "item": "{{base_url}}" },
          { "@type": "ListItem", "position": 2, "name": "{{category}}", "item": "{{category_url}}" }
        ]
      }

  - type: Organization
    template: |
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "{{name}}",
        "url": "{{url}}",
        "logo": "{{logo_url}}",
        "sameAs": ["{{social_urls}}"]
      }

validation:
  tools:
    - name: "Google Rich Results Test"
      url: "https://search.google.com/test/rich-results"
    - name: "Schema.org Validator"
      url: "https://validator.schema.org/"
  rules:
    - "Always use JSON-LD (not Microdata or RDFa)"
    - "Place in <head> or end of <body>"
    - "One primary type per page"
    - "Test with Google Rich Results Test before deploy"
