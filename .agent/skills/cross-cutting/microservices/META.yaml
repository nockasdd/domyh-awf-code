# =============================================================================
# META.yaml — Microservices Patterns
# =============================================================================
# Tier 1: Always loaded (~100 tokens)
# =============================================================================

name: microservices
version: "6.4.5"
category: cross-cutting
priority: 2

description: |
  Microservices architecture patterns: Saga, CQRS, Event Sourcing,
  service mesh, inter-service communication, resilience, and deployment.

# =============================================================================
# TRIGGERS — When to activate this skill
# =============================================================================

triggers:
  keywords:
    - microservices
    - microservice
    - saga pattern
    - cqrs
    - event sourcing
    - service mesh
    - api gateway
    - circuit breaker
    - distributed system
    - event-driven
    - message queue
    - kafka
    - rabbitmq
    - nats
    - grpc
    - service discovery
    - sidecar proxy
    - istio
    - linkerd
    - domain-driven design
    - ddd
    - bounded context

  intents:
    - "design microservices architecture"
    - "implement saga pattern"
    - "setup event sourcing"
    - "configure service mesh"
    - "implement circuit breaker"
    - "setup message queue"
    - "distributed tracing"

  detect_patterns:
    files:
      ["docker-compose.yaml", "docker-compose.yml", "k8s/", "helm/", "proto/"]
    content: ["@EventHandler", "@SagaStep", "proto3", "service mesh"]

# =============================================================================
# CAPABILITIES — What this skill provides
# =============================================================================

caps:
  - saga_orchestration
  - saga_choreography
  - cqrs_implementation
  - event_store_design
  - service_mesh_config
  - circuit_breaker_setup
  - distributed_tracing
  - api_gateway_patterns
  - inter_service_communication
  - deployment_strategies

# =============================================================================
# DATA FILES — Tier 2/3 resources
# =============================================================================

data_files:
  - saga-patterns.yaml # Orchestration & Choreography
  - cqrs-patterns.yaml # Command/Query separation
  - event-sourcing.yaml # Event store, snapshots, replay
  - service-mesh.yaml # Istio, Linkerd, sidecar
  - communication.yaml # Sync vs Async patterns
  - resilience.yaml # Circuit breaker, bulkhead, retry
  - observability.yaml # Distributed tracing, correlation IDs
  - deployment.yaml # Blue-green, canary, rolling


# _DOMYH Awesome Code • Microservices Skill_
