# =============================================================================
# _router.yaml — Smart Skill Router
# =============================================================================
# Single Source of Truth for skill loading strategy
# Integrates with HSA v1.3.2 project detector for optimal token usage
# =============================================================================

version: "6.4.0"
engine: "hsa"
schema: "hierarchical"

# =============================================================================
# LOADING STRATEGY
# =============================================================================

strategy:
  # Always loaded (minimal footprint)
  baseline:
    always_load:
      - category: "core"
        skill: "security"
        file: "META.yaml"
    max_tokens: 100

  # Layer 1: Deterministic — Load from workflow frontmatter (0ms)
  on_workflow:
    source: "manifest.commands[].skills"
    mode: "merge" # Merge with on_detect results
    load_file: "META.yaml" # Initially load only metadata
    upgrade_to: "SKILL.md" # Upgrade when actively used
    resolution:
      required: "always_load" # skills.required → always load META
      contextual: "if_detected" # skills.contextual → load only if project has it
      auto: "delegate_to_on_detect" # [auto] → fallback to Layer 2

  # Layer 2: Contextual — Load on project detection (<50ms)
  on_detect:
    source: "project_detector"
    load_file: "META.yaml"
    max_skills: 5
    cache_ttl: 300 # 5 minutes

  # Layer 3: Semantic — Load on user request/workflow (<200ms)
  on_request:
    triggers:
      - "user query contains skill keywords"
      - "workflow requires skill"
      - "command references skill"
    load_file: "SKILL.md"
    max_tokens: 1500

  # Never preload
  never_preload:
    - "ADVANCED.md" # Reference only when explicitly needed

# =============================================================================
# SELECTION CONFIG
# =============================================================================

selection:
  default_threshold: 0.30
  recency_boost: 0.15
  max_active_skills: 3 # Synced with manifest.yaml max_active
  max_active_t2: 3 # Max SKILL.md loaded simultaneously

# =============================================================================
# CATEGORY ROUTING
# =============================================================================

routing:
  languages:
    path: "skills/languages/"
    detect_by:
      - "extension" # .py → python, .go → go
      - "build_system" # go.mod → go, Cargo.toml → rust
    priority: 1
    count: 28

  frameworks:
    path: "skills/frameworks/"
    detect_by:
      - "dependency" # react in package.json
      - "special_file" # next.config.js → nextjs
    priority: 2
    count: 9

  devops:
    path: "skills/devops/"
    detect_by:
      - "special_file" # Dockerfile, k8s/, *.tf
      - "directory" # .github/workflows/
    priority: 3
    count: 7

  core:
    path: "skills/core/"
    always_load: true
    priority: 0
    count: 6

  private:
    path: "private/"
    detect_by:
      - "keyword"
      - "dependency"
    priority: -1 # Highest priority — overrides public skills
    count: 0 # Dynamic: read from private/_index.yaml
    registry: "private/_index.yaml"
    note: "Gitignored private skills, not in public repo"

  cross-cutting:
    path: "skills/cross-cutting/"
    detect_by:
      - "dependency"
      - "extension"
    priority: 4
    count: 22

    # HSA adapter overrides for cross-cutting skills
    skills:
      domyh-design:
        adapter: "hsa.adapters.uiux_adapter"
        preload_data: true
        triggers:
          file_patterns:
            - "*.html"
            - "*.css"
            - "*.scss"
            - "*.tsx"
            - "*.vue"
            - "*.svelte"
            - "tailwind.config.*"
            - "components.json"
          keywords:
            - "ui design"
            - "ux design"
            - "landing page"
            - "dashboard"
            - "glassmorphism"
            - "dark mode"
            - "color palette"
            - "typography"
            - "font pairing"

      electron:
        adapter: "hsa.adapters.electron_adapter"
        data_dir: "skills/cross-cutting/electron/data"
        preload_data: true
        triggers:
          file_patterns:
            - "electron.vite.config.ts"
            - "electron-builder.json5"
            - "forge.config.ts"
            - "**/main.ts:electron"
            - "**/preload.ts"
          keywords:
            - "electron"
            - "electronjs"
            - "electron app"
            - "desktop app"
            - "BrowserWindow"
            - "contextBridge"
            - "ipcMain"
            - "ipcRenderer"
            - "electron-builder"
            - "electron-vite"
            - "autoUpdater"
            - "better-sqlite3"
            - "electron-store"

      tailwind:
        adapter: "hsa.adapters.tailwind_adapter"
        data_dir: "skills/cross-cutting/tailwind/data"
        preload_data: true
        triggers:
          file_patterns:
            - "tailwind.config.js"
            - "tailwind.config.ts"
            - "*.css"
            - "postcss.config.js"
            - "vite.config.ts"
          keywords:
            # Core
            - "tailwind"
            - "tailwindcss"
            - "@tailwindcss"
            # v4 Features
            - "@theme"
            - "@utility"
            - "@source"
            - "container query"
            # Variants
            - "dark:"
            - "hover:"
            - "responsive"
            - "mobile first"
            # Build
            - "oxide engine"
            - "lightning css"
            - "Vite plugin"

  tooling:
    path: "skills/tooling/"
    detect_by:
      - "special_file" # mcp.json, .vscode/extensions.json
      - "dependency" # @modelcontextprotocol/sdk
    priority: 5
    count: 5

  ai-ml:
    path: "skills/ai-ml/"
    detect_by:
      - "dependency" # langchain, openai, pinecone, sklearn, dvc
      - "keyword" # RAG, embeddings, vector, gemini, ml pipeline
      - "special_file" # dvc.yaml, MLproject, mlruns/
    priority: 6
    count: 8

# =============================================================================
# SKILL RESOLUTION
# =============================================================================

resolution:
  # Support both flat and hierarchical paths
  backward_compat: true

  # e.g., "python" → "languages/python"
  aliases:
    python: "languages/python"
    go: "languages/go"
    typescript: "languages/typescript"
    react: "frameworks/react"
    vue: "frameworks/vue"
    docker: "devops/docker"
    security: "core/security"
    testing: "cross-cutting/testing"
    # v6.3 new aliases
    mcp: "tooling/mcp"
    graphql: "tooling/api-protocols"
    trpc: "tooling/api-protocols"
    grpc: "tooling/api-protocols"
    ai-agents: "ai-ml/ai-agents"
    langchain: "ai-ml/ai-agents"
    vector-search: "ai-ml/vector-search"
    tauri: "cross-cutting/tauri"
    websocket: "cross-cutting/real-time"
    sse: "cross-cutting/real-time"
    kafka: "cross-cutting/event-driven"
    rabbitmq: "cross-cutting/event-driven"
    nats: "cross-cutting/event-driven"
    terraform: "devops/terraform"
    gcp: "devops/gcp"
    azure: "devops/azure"
    wasm: "cross-cutting/wasm"
    webassembly: "cross-cutting/wasm"
    playwright: "cross-cutting/playwright"
    e2e: "cross-cutting/playwright"
    browser-testing: "cross-cutting/playwright"
    browser-agent: "tooling/browser-agent"
    # Workflow-required skill aliases (synced with manifest.yaml)
    coding-rules: "cross-cutting/coding-rules"
    audit-pro: "cross-cutting/audit-pro"
    domyh-design: "cross-cutting/domyh-design"
    tdd-workflow: "cross-cutting/tdd-workflow"
    database: "cross-cutting/database"
    web-perf: "cross-cutting/web-perf"
    error-handling: "core/error-handling"
    logging: "core/logging"
    observability: "core/observability"
    ci-cd: "devops/ci-cd"
    kubernetes: "devops/kubernetes"
    aws: "devops/aws"
    prompt-engineering: "ai-ml/prompt-engineering"
    skill-creator: "cross-cutting/skill-creator"
    # v7.0 New aliases
    ml-pipelines: "ai-ml/ml-pipelines"
    sklearn: "ai-ml/ml-pipelines"
    dvc: "ai-ml/ml-pipelines"
    mlflow: "ai-ml/ml-pipelines"
    streamlit: "frameworks/streamlit"

# =============================================================================
# TOKEN BUDGET
# =============================================================================

token_budget:
  baseline: 500 # Router + core/security META
  per_detected: 100 # Each detected skill META
  per_active: 1500 # Each active skill SKILL.md
  max_total: 12700 # Synced with manifest.yaml peak budget


