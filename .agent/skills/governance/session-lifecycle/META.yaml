name: session-lifecycle
display: "Session Lifecycle"
category: governance
tier: 1
priority: 2

desc: "Session start/end governance. Declare intent, set focus/mode/goals, track progress with 3-level hierarchy (trajectory→tactic→action), persist state before session end."

triggers:
  file_patterns: []
  keywords:
    - session start
    - session end
    - declare intent
    - session focus
    - session mode
    - session goals
    - track progress
    - trajectory
    - tactic
    - action tracking
  intents:
    - start new session
    - declare session intent
    - track session progress
    - end session properly

caps:
  - Intent declaration (focus, mode, goals)
  - 3-level progress hierarchy (trajectory→tactic→action)
  - Session persistence (CONTEXT_SNAPSHOT.md)
  - Mode selection (plan_driven, exploration, bugfix, refactor)
