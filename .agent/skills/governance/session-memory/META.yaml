  keywords:
    - session memory
    - memory
    - anchor
    - save decision
    - persist
    - compaction
    - context snapshot
    - remember
    - recall
    - decision log
    - convention
  intents:
    - save session state
    - persist decisions
    - recall prior work
    - memory management

caps:
  - Structured anchor shelves (decision, convention, context, constraint, stack)
  - Compaction survival protocol
  - Cross-session memory persistence
  - Decision recall at session start
  - Emergency save sequence
