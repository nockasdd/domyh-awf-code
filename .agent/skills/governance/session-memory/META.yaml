name: session-memory
display: "Session Memory"
category: governance
tier: 1
priority: 2

desc: "Persistent memory pattern using hsa_session with structured shelves. Decisions, patterns, errors survive across sessions and context compaction. Save anchors by category: decision, convention, context, constraint, stack."

triggers:
