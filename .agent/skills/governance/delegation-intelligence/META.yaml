name: delegation-intelligence
display: "Delegation Intelligence"
category: governance
tier: 1
priority: 2

desc: "Sub-agent work distribution. Decides when to delegate, prepares minimal context packets and task contracts, and validates sub-agent results against acceptance criteria."

triggers:
  file_patterns: []
  keywords:
    - delegation
    - delegate
    - sub-agent
    - subagent
    - handoff
    - task routing
    - context packet
    - task contract
    - decompose
  intents:
    - delegate task
    - prepare handoff
    - decompose work
    - validate subagent result

caps:
  - Complexity scoring for delegation need
  - Context packet preparation (800-1500 tokens)
  - Tool filtering for sub-agent types
  - 2-tier review gate (spec compliance + quality)
  - Sub-agent result validation

links_to:
  - agentic-orchestration
  - ai-agents
  - context-engineering
