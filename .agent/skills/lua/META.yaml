name: lua
version: "6.0.0"
display: Lua
category: scripting
tier: 1
priority: 3

description: |
  Lua scripting for game development, embedded systems, configuration.
  Covers Lua 5.1-5.5, LuaJIT, FFI, metatables, coroutines.

triggers:
  file_patterns:
    - "*.lua"
    - ".luarc.json"
    - "*.rockspec"
    - "main.lua"
    - "game.project"
  keywords:
    # Core
    - lua
    - lua script
    - luajit
    - luau
    # Frameworks
    - love2d
    - defold
    - roblox
    - solar2d
    - openresty
    # Features
    - metatable
    - coroutine
    - pcall
    - ffi
  intents:
    - lua game
    - lua script
    - lua module
    - love2d game
    - roblox script

related_skills:
  - cpp
  - c

caps:
  - Game scripting
  - Embedded systems
  - Configuration scripts
  - FFI bindings
  - Coroutine patterns

prevent_confusion_with:
  python: "Lua uses tables, Python uses dicts/lists"
  javascript: "Lua 1-indexed, JS 0-indexed"
