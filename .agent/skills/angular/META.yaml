name: angular
version: "6.0.0"
category: frontend
tier: 1

description: |
  Enterprise web framework for Angular 19/20.
  Covers signals, standalone components, zoneless change detection.

triggers:
  file_patterns:
    - "angular.json"
    - "*.component.ts"
    - "*.module.ts"
    - "*.service.ts"
    - "*.directive.ts"
  keywords:
    # Core
    - angular
    - angular 19
    - angular 20
    - "@angular/core"
    - "@angular/common"
    # Signals
    - signal()
    - computed()
    - effect()
    - input()
    - output()
    - model()
    - angular signals
    # Components
    - "@Component"
    - standalone component
    - angular component
    # Control Flow
    - "@if"
    - "@for"
    - "@switch"
    - "@defer"
    # Zoneless
    - zoneless
    - provideExperimentalZonelessChangeDetection
    - ChangeDetectionStrategy
    - OnPush
    # RxJS
    - RxJS
    - Observable
    - BehaviorSubject
    - AsyncPipe
    # Services
    - "@Injectable"
    - providedIn
    - dependency injection
    # Forms
    - ReactiveFormsModule
    - FormControl
    - FormGroup
    - Validators
    # HTTP
    - HttpClient
    - HttpInterceptor
    # Router
    - RouterModule
    - RouterLink
    - ActivatedRoute
    # CLI
    - angular cli
    - ng serve
    - ng build
    - ng generate
    # Testing
    - TestBed
    - ComponentFixture
    - jasmine angular
  intents:
    - angular project
    - angular component
    - angular signals
    - angular form
    - angular service

related_skills:
  - typescript
  - rxjs

prevent_confusion_with:
  - react: "Angular uses signals, React uses useState"
  - vue: "Angular is class-based with decorators"
