name: svelte
version: "4.3.0"
category: frontend
tier: 1

description: |
  Compiled UI framework for Svelte 5 and SvelteKit 2.
  Covers runes ($state, $derived, $effect), snippets, form actions.

triggers:
  file_patterns:
    - "svelte.config.js"
    - "*.svelte"
    - "+page.svelte"
    - "+layout.svelte"
    - "+page.server.ts"
  keywords:
    # Core
    - svelte
    - svelte 5
    - sveltekit
    - sveltekit 2
    - svelte component
    # Runes
    - "$state"
    - "$derived"
    - "$effect"
    - "$props"
    - "$bindable"
    - "$inspect"
    - runes svelte
    # Snippets
    - "{#snippet}"
    - "{@render}"
    - svelte snippets
    # Reactivity
    - svelte store
    - writable
    - readable
    - derived store
    # SvelteKit
    - +page.svelte
    - +layout.svelte
    - +page.ts
    - +page.server.ts
    - +server.ts
    - load function
    # Routing
    - sveltekit routing
    - file based routing
    - +error.svelte
    # Forms
    - form actions
    - use:enhance
    - fail svelte
    # Directives
    - bind:
    - on:
    - use:
    - class:
    - style:
    # Control Flow
    - "{#if}"
    - "{#each}"
    - "{#await}"
    - "{:else}"
    # Lifecycle
    - onMount
    - onDestroy
    - beforeUpdate
    - afterUpdate
    # Tools
    - svelte extension
    - svelte devtools
    - vitest svelte
  intents:
    - svelte component
    - sveltekit project
    - svelte state
    - svelte form
    - svelte routing

related_skills:
  - typescript
  - tailwind

prevent_confusion_with:
  - vue: "Svelte compiles away, Vue has virtual DOM"
  - react: "Svelte uses $state runes, React uses useState"
