# DOMYH Awesome Code — Checkpoint System v6.5.0
# status: archived — Design spec, not runtime config
# Implements periodic rule re-injection to prevent drift in long sessions

version: "6.4.10"
engine: checkpoint_system

# =============================================================================
# CHECKPOINT TRIGGERS
# =============================================================================

checkpoints:
  enabled: true

  # ─────────────────────────────────────────────────────────────────────────
  # TRIGGER CONDITIONS
  # ─────────────────────────────────────────────────────────────────────────

  triggers:
    # Message-based (every N messages)
    message_count:
      enabled: true
      threshold: 6 # Every 6 messages
      rationale: "Prevents mid-session rule drift"

    # Token-based (at N tokens in context)
    token_threshold:
      enabled: true
      threshold: 15000 # At 15k tokens (safe for 128k context models)
      rationale: "Prevents context overflow degradation"

    # Event-based triggers
    events:
      before_code_generation:
        enabled: true
        patterns:
          - "scaffold"
          - "refactor"
          - "implement"
          - "create file"
          - "/code"
          - "/init"
        rationale: "Ensure rules applied before large code changes"

      after_tool_chain:
        enabled: true
        consecutive_tools: 3 # After 3+ consecutive tool calls
        rationale: "Re-anchor after heavy tool usage"

      on_context_compression:
        enabled: true
        rationale: "Re-inject rules after summarization"

      on_topic_change:
        enabled: true
        similarity_threshold: 0.3 # Low similarity = topic change
        rationale: "Re-establish context on new topics"

# =============================================================================
# CHECKPOINT ACTIONS
# =============================================================================

actions:
  # What to do at each checkpoint
  on_checkpoint:
    # Re-inject rules at head + tail
    reinject_rules:
      enabled: true
      zones: ["head", "tail"]
      source: ".agent/rules/SACRED_RULES.xml"
      extract: "//requirement[@severity='block']"

    # Restate critical rules
    restate_critical:
      enabled: true
      format: |
        === CHECKPOINT: Rule Reminder ===
        Active rules: LANG_001, MCP_001, SESSION_001
        Priority: Session Rules > Project > Global

    # Optional: Ask model to paraphrase rules (stronger binding)
    ask_confirmation:
      enabled: false # Set true for critical tasks
      prompt: "Before proceeding, confirm you understand the active rules."

    # Log checkpoint for debugging
    log_state:
      enabled: true
      include:
        - message_count
        - token_count
        - active_rules
        - violations_count
      output: ".agent/memory/checkpoint_log.json"

# =============================================================================
# VIOLATION TRACKING
# =============================================================================

violations:
  # Track rule violations per session
  tracking:
    enabled: true
    storage: ".agent/memory/violations.json"

  # Actions on violation detection
  on_violation:
    severity_block:
      action: "flag_response_invalid"
      notify: true
      log: true

    severity_warn:
      action: "log_only"
      notify: false
      log: true

  # Escalation thresholds
  escalation:
    warning_threshold: 3 # 3 warns → escalate
    block_threshold: 1 # 1 block → immediate flag

# =============================================================================
# INTEGRATION
# =============================================================================

integration:
  context_loader:
    syncs_with: "CONTEXT_LOADER.yaml"
    uses_priority_positioning: true

  policy_engine:
    syncs_with: "policy_engine.py"
    runs_validation: true

  session_rules:
    source: ".agent/memory/session_rules.json"
    loads_at_checkpoint: true

# =============================================================================
# METRICS
# =============================================================================

metrics:
  track:
    - checkpoints_triggered
    - rules_reinjected
    - violations_caught
    - response_validity_rate

  report:
    frequency: "on_session_end"
    output: ".agent/memory/checkpoint_metrics.json"
